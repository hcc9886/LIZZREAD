<!DOCTYPE html>
<!-- ============================================================
  LIZZREAD —— 双语线上图书馆（单文件版，无框架）
  功能：词汇量测试(CEFR 定级) → 按等级推荐 → 百余本名著书库
        → 双语试读（可开关中文、可选背景色、词/句颜色标记）
        → 点词自动弹卡（语境义 + 常用义 + 英英释义）+ TTS → 本地生词本
        → 导入书籍(TXT/EPUB) → 本地多账号
  存储：localStorage（账号 / 生词本 / 标记 / 阅读偏好）
============================================================ -->
<html lang="zh-CN">
<head>

<style>
/* ---------- 全局变量（默认 纯白 主题） ---------- */
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --surface2:#EFEFEA;
  --text:#1B1F1D; --muted:#6B7370; --border:#E2E5E0;
  --brand:#0F8A4D; --brand-deep:#0B6B3C; --brand-soft:#E7F5EC;
  --gold:#B98A2F; --danger:#D34B3E;
  --radius:12px; --shadow:0 1px 3px rgba(20,30,25,.08),0 8px 24px rgba(20,30,25,.06);
  --font:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Georgia","Songti SC",serif;
}
/* ---------- 阅读背景主题（全站生效） ---------- */
body[data-bg="sepia"]{--bg:#F1E9D6;--surface:#FBF5E6;--surface2:#EFE4C9;--border:#E0D3B2;--muted:#8A7A55}
body[data-bg="green"]{--bg:#E2EEE1;--surface:#EFF6EE;--surface2:#DFEBDD;--border:#C9DBC7;--muted:#5F7A60}
body[data-bg="blue"]{--bg:#E3EDF4;--surface:#F0F6FA;--surface2:#DFEAF2;--border:#C9DCE8;--muted:#5A7386}
body[data-bg="rose"]{--bg:#F7E9EC;--surface:#FFF6F8;--surface2:#F1DEE3;--border:#E7CDD6;--muted:#8D6473}
body[data-bg="lavender"]{--bg:#EDEAF7;--surface:#F7F4FF;--surface2:#E2DDF3;--border:#D6CEEE;--muted:#6F688D}
body[data-bg="sand"]{--bg:#F4EEE2;--surface:#FFFBF3;--surface2:#EDE3D2;--border:#DFD1BB;--muted:#82735C}
body[data-bg="forest"]{--bg:#E4EFE6;--surface:#F4FAF5;--surface2:#D8E8DB;--border:#C3D9C7;--muted:#5C7663}
body[data-bg="midnight"]{--bg:#0E1420;--surface:#182233;--surface2:#223047;--text:#E3EAF6;--muted:#93A4C0;--border:#2C3C57;--brand:#6FA8FF;--brand-deep:#9CC4FF;--brand-soft:#1A2D4A;--shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4)}
body[data-bg="dark"]{--bg:#17191B;--surface:#212527;--surface2:#2C3134;--text:#E1E5E2;
  --muted:#98A09B;--border:#383F41;--brand:#2FBF72;--brand-deep:#5CD594;--brand-soft:#1D3327;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
body[data-fontsize="s"]{--read-size:15px} body[data-fontsize="m"]{--read-size:17px} body[data-fontsize="l"]{--read-size:19px} body[data-fontsize="xl"]{--read-size:22px}
body[data-serif="0"] .sent .en,body[data-serif="0"] .cover .t{font-family:var(--font)!important}
body[data-width="narrow"] .reader{max-width:560px} body[data-width="wide"] .reader{max-width:900px}
body[data-motion="off"] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--font);
     -webkit-tap-highlight-color:transparent;transition:background .25s}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.bar{max-width:1080px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:700 20px/1 var(--serif);letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.logo b{color:var(--brand)}
.logo small{font:400 11px/1 var(--font);color:var(--muted);margin-left:6px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
nav button{border:1px solid transparent;background:none;color:var(--muted);
  padding:6px 10px;border-radius:999px;font:500 13px/1 var(--font);cursor:pointer;white-space:nowrap}
nav::-webkit-scrollbar{display:none}
nav button:hover{background:var(--surface2)}
nav button.on{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--border)}

/* ---------- 布局容器 ---------- */
main{max-width:1080px;margin:0 auto;padding:20px 16px 90px}
.view{display:none}
.view.on{display:block}
h2.sec{font:700 20px/1.4 var(--font);margin:18px 0 12px}
.tip{color:var(--muted);font-size:13px;margin-bottom:12px}

/* ---------- 筛选器 ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px;align-items:center}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);
  padding:6px 13px;border-radius:999px;font:500 13px/1 var(--font);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.search{flex:1;min-width:160px;border:1px solid var(--border);border-radius:999px;
  padding:8px 14px;font:14px var(--font);outline:none;background:var(--surface);color:var(--text)}
.search:focus{border-color:var(--brand)}

/* ---------- 书卡网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.book{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.book:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cover{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;
  padding:12px;color:#fff;position:relative;overflow:hidden}
.cover img.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 文字浮于书皮图之上并带暗色投影保证可读 */
.cover .lv{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);
  font:600 11px/1 var(--font);padding:4px 8px;border-radius:999px;z-index:2}
.cover .t{position:relative;z-index:2;font:700 15px/1.3 var(--serif);
  text-shadow:0 1px 3px rgba(0,0,0,.65),0 0 6px rgba(0,0,0,.4);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cover .a{position:relative;z-index:2;font:400 11px/1.4 var(--font);
  text-shadow:0 1px 3px rgba(0,0,0,.65)}
.book .meta{padding:8px 10px 10px;font-size:12px;color:var(--muted)}
.book .meta .g{color:var(--brand-deep);font-weight:600}
.badge{display:inline-block;background:var(--gold);color:#fff;font:600 11px/1 var(--font);
  padding:3px 8px;border-radius:999px;margin-left:4px}
/* 各类型封面配色 */
.g-lit{background:linear-gradient(135deg,#2E5E4E,#4E8C6A)}
.g-mys{background:linear-gradient(135deg,#2B2F3A,#4A5268)}
.g-sci{background:linear-gradient(135deg,#1F3A5F,#3E6FA3)}
.g-fab{background:linear-gradient(135deg,#B96A2F,#E0A45C)}
.g-adv{background:linear-gradient(135deg,#8A4B2F,#C08A5A)}
.g-phl{background:linear-gradient(135deg,#4B3A6B,#7A68A0)}
.g-drama{background:linear-gradient(135deg,#7A3B3B,#A86868)}
.g-imp{background:linear-gradient(135deg,#555F66,#8A9AA5)}
.g-poe{background:linear-gradient(135deg,#5B3B63,#8E6AA0)}
.g-his{background:linear-gradient(135deg,#6B4A2F,#A5794C)}
.g-rom{background:linear-gradient(135deg,#8E3B5A,#C57792)}
.g-hum{background:linear-gradient(135deg,#A06A1E,#D6A247)}
.cover{isolation:isolate}
#view-reader .sent.listen-on{background:var(--brand-soft);border-radius:10px;transition:background .3s}
/* 单词弹窗：更紧凑的行内操作 + 限高滚动，避免占满屏幕 */
/* 更多释义面板：紧凑分节 */
.ios-step{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--border);font-size:13.5px;line-height:1.6}
.ios-step:first-of-type{border-top:none}
.ios-step b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font:600 12px/22px var(--font);text-align:center}
.mm-sec{border-top:1px solid var(--border);padding:8px 0 2px}
.mm-sec:first-of-type{border-top:none}
.mm-h{font:600 12px var(--font);color:var(--brand-deep);margin-bottom:4px}
.mm-row{font-size:13px;line-height:1.65;margin:2px 0 4px}
.mm-row b{color:var(--muted);font-weight:600;margin-right:4px}
.mm-zh{color:var(--text);margin-top:1px}
.sheet-mini{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.sheet-mini .linkbtn{background:none;border:none;padding:2px 0;color:var(--brand-deep);font:500 12.5px var(--font);cursor:pointer}
.sheet-mini .linkbtn:hover{text-decoration:underline}
.sheet-mini .dot{color:var(--border-strong,var(--muted));font-size:12px}
#sheet{max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (max-height:700px){ #sheet{max-height:86vh} }
.cover .ctag{position:absolute;left:8px;bottom:7px;z-index:2;font:500 9px/1 var(--font);letter-spacing:1px;
  color:rgba(255,255,255,.92);background:rgba(0,0,0,.32);padding:3px 6px;border-radius:6px;backdrop-filter:blur(2px)}
.cover .t{font-size:15px}
.cover.gen .t{font-size:15px}

/* ---------- 推荐横幅 ---------- */
.rec-banner{background:var(--brand-soft);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-banner b{color:var(--brand-deep)}
.rec-banner button{margin-left:auto}

/* ---------- 按钮 ---------- */
.btn{display:inline-block;border:none;cursor:pointer;font:500 14px/1 var(--font);
  padding:9px 18px;border-radius:10px;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-deep)}
.btn.ghost{background:var(--surface);color:var(--brand-deep);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--surface2)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 词汇测试 ---------- */
.test-card{max-width:560px;margin:24px auto;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow);padding:28px 24px;text-align:center}
.test-card .prog{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-bottom:20px}
.test-card .prog i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .25s}
.test-card .tier{font:600 12px/1 var(--font);color:var(--muted);letter-spacing:1px}
.test-card .word{font:700 34px/1.3 var(--serif);margin:14px 0 20px}
.opts{display:grid;gap:10px}
.opts button{border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:12px;font:15px var(--font);cursor:pointer;text-align:left;color:var(--text)}
.opts button:hover{border-color:var(--brand);background:var(--brand-soft)}
.opts button.ok{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.opts button.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface));color:var(--danger)}
.result-lv{font:800 56px/1.2 var(--serif);color:var(--brand)}
.result-desc{color:var(--muted);font-size:14px;margin:10px 0 20px}

/* ---------- 书籍详情 ---------- */
.detail-head{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.detail-head .cover{width:130px;flex:0 0 auto;border-radius:var(--radius)}
.detail-info{flex:1;min-width:240px}
.detail-info h2{font:700 24px/1.3 var(--serif)}
.detail-info .by{color:var(--muted);margin:4px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tag{background:var(--surface2);border-radius:999px;padding:4px 12px;font:500 12px/1 var(--font);color:var(--muted)}
.links a{color:var(--brand-deep);text-decoration:none;font-size:13px}
.links a:hover{text-decoration:underline}
.back{color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--brand-deep)}

/* ---------- 阅读器（逐句对照） ---------- */
.reader{max-width:720px;margin:0 auto;transition:max-width .2s}
.rd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rd-head h2{font:700 19px/1.3 var(--serif);flex:1;min-width:180px}
.rd-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.bgdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0}
.bgdot.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
/* 阅读器底部 sticky 进度条 */
.rd-foot{position:sticky;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--border);padding:8px 14px;margin-top:18px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.rd-foot .prog{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.rd-foot .prog i{display:block;height:100%;background:var(--brand);transition:width .2s}
.sent{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;transition:background .2s}
.sent .en{font:var(--read-size,17px)/1.7 var(--serif);line-height:1.8}
/* 整段模式：段落正文两端对齐，读起来像原版书 */
.sent.para .en{text-align:justify}
.sent .en span.w{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .1s}
.sent .en span.w:hover{background:var(--brand-soft)}
.sent .zh{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);
  color:var(--muted);font-size:14px}
body.no-zh .sent .zh{display:none}
.sent .tools{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 颜色标记 */
.mk1{background:#FFE58F}.mk2{background:#B7EB8F}.mk3{background:#FFB8C6}
.mk4{background:#A8D8FF}.mk5{background:#D9BFFF}
.sent.sm1{border-left-color:#F3C53D;background:color-mix(in srgb,#FFE58F 16%,var(--surface))}
.sent.sm2{border-left-color:#7BC34A;background:color-mix(in srgb,#B7EB8F 16%,var(--surface))}
.sent.sm3{border-left-color:#E86F87;background:color-mix(in srgb,#FFB8C6 16%,var(--surface))}
.sent.sm4{border-left-color:#5AA7E0;background:color-mix(in srgb,#A8D8FF 16%,var(--surface))}
.sent.sm5{border-left-color:#9F7BE0;background:color-mix(in srgb,#D9BFFF 16%,var(--surface))}
.mdot{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);cursor:pointer;padding:0}
.mdot.tit{width:auto;height:auto;border:none;background:none;font-size:12px;color:var(--muted);cursor:default;padding:0}

/* ---------- 生词卡（底部弹层） ---------- */
.mask{position:fixed;inset:0;background:rgba(15,20,17,.35);display:none;z-index:90}
.mask.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);
  width:100%;max-width:540px;background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:20px 22px 26px;z-index:99;
  transition:transform .25s ease;max-height:78vh;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}
.sheet .w{font:700 26px/1.2 var(--serif)}
.sheet .sec-t{font:600 12px/1.5 var(--font);color:var(--brand-deep);margin:14px 0 4px;letter-spacing:.5px}
.sheet .d{color:var(--text);margin:2px 0;font-size:14px}
.sheet .d.dim{color:var(--muted)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sheet .close{position:absolute;top:10px;right:14px;background:none;border:none;
  font-size:20px;color:var(--muted);cursor:pointer}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- 生词本 ---------- */
.vlist{display:grid;gap:10px;max-width:720px}
.vitem{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.vitem .w{font:600 17px/1.3 var(--serif);flex:1;min-width:100px;overflow:hidden;text-overflow:ellipsis}
.vitem .m{color:var(--muted);font-size:13px;flex:2;min-width:120px}
/* 词卡折叠区 */
.fold{border:1px solid var(--border);border-radius:10px;margin-top:10px;padding:8px 12px}
.fold summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.fold[open] summary{color:var(--brand)}
/* 生词详情展开区 */
.vdet{flex-basis:100%;border-top:1px dashed var(--border);margin-top:8px;
  padding-top:8px;font-size:13px;color:var(--text);cursor:default}
.vdet .dim{color:var(--muted)}
/* M2：词族熟练度正文高亮（陌生=红点线，学习中=琥珀实线，已掌握=不高亮） */
.w.st0{background:rgba(220,80,60,.12);border-bottom:1.5px dotted rgba(200,60,40,.55)}
.w.st1{background:rgba(230,160,30,.16);border-bottom:1.5px solid rgba(220,140,20,.6)}
.defen{cursor:pointer}
.defen:hover{text-decoration:underline}
/* 划选弹层（查首词 / 整段翻译 / 朗读） */
#selpop{display:none;position:absolute;z-index:80;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.2);
  padding:10px 12px;max-width:300px}
.rec-banner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 18px;font-size:15px;margin-bottom:14px;text-align:center}
.iconbtn{background:none;border:1px solid var(--border);border-radius:8px;
  padding:5px 10px;cursor:pointer;font-size:14px;color:var(--muted)}
.iconbtn:hover{border-color:var(--brand);color:var(--brand-deep)}
.empty{text-align:center;color:var(--muted);padding:50px 0;font-size:14px}

/* ---------- 新手引导 / 个性化 / 拼装 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(10,16,13,.55);backdrop-filter:blur(4px);z-index:1200;display:flex;align-items:center;justify-content:center;padding:18px}
.onboard{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow:hidden}
.onboard .oh{padding:22px 24px 10px;display:flex;align-items:center;gap:10px}
.onboard .oh .ico{font-size:34px}
.onboard .oh h3{font:700 20px/1.3 var(--serif);margin:0}
.onboard .ob{padding:2px 24px 8px;color:var(--text);font-size:14px;line-height:1.75}
.onboard .ob ul{margin:10px 0 0 18px;color:var(--muted)}
.onboard .of{padding:14px 24px 20px;display:flex;align-items:center;gap:8px}
.onboard .dots{display:flex;gap:5px;margin-right:auto}
.onboard .dots i{width:7px;height:7px;border-radius:50%;background:var(--border)}
.onboard .dots i.on{background:var(--brand)}
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.settings-card h3{font:700 16px/1.4 var(--serif);margin:0 0 4px}
.settings-card .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.pref-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.pref-row label{min-width:96px;font-size:13px;color:var(--muted)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.theme-tile{border:2px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;background:var(--surface2);text-align:center;font-size:12px}
.theme-tile.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.theme-swatch{height:32px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(0,0,0,.08)}
.switch{width:42px;height:24px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);position:relative;cursor:pointer;padding:0}
.switch.on{background:var(--brand);border-color:var(--brand)}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on i{left:20px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:7px 13px;font:13px var(--font);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
.guide-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border)}
.guide-step .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:flex;align-items:center;justify-content:center;font-weight:700}
.guide-step .tx{flex:1;font-size:14px;line-height:1.7}
.asmtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.asm-slot{min-height:50px;border:2px dashed var(--border);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;background:transparent}
.asm-slot.filled{background:var(--brand-soft);border-style:solid;border-color:var(--brand)}
.asm-block{padding:9px 14px;background:var(--surface);border:1px solid var(--border);border-radius:9px;cursor:pointer;font:500 14px var(--font);user-select:none}
.asm-block:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(15,138,77,.15)}
.asm-sent{font:17px/1.7 var(--serif);padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--brand);border-radius:12px;margin-bottom:12px}
.asm-zh{color:var(--muted);font-size:14px;margin-top:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.statbox{background:var(--surface2);border-radius:10px;padding:12px;text-align:center}
.statbox b{display:block;font:700 22px/1.2 var(--serif);color:var(--brand-deep)}
.statbox span{font-size:11px;color:var(--muted)}

/* ---------- 会员 / 报告 / 全文搜索 ---------- */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0}
.plan-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.plan-card.hot{border-color:var(--brand);box-shadow:0 10px 30px rgba(15,138,77,.12)}
.plan-card .tagline{position:absolute;top:-11px;left:16px;background:var(--brand);color:#fff;font:600 11px/1 var(--font);padding:5px 10px;border-radius:999px}
.plan-price{font:800 34px/1 var(--serif);color:var(--brand-deep)}
.plan-price small{font:500 12px/1 var(--font);color:var(--muted);margin-left:4px}
.plan-name{font:700 15px/1.3 var(--font)}
.plan-feat{font-size:13px;line-height:1.9;color:var(--text);flex:1}
.plan-feat li{list-style:none;padding-left:20px;position:relative;color:var(--muted)}
.plan-feat li.ok{color:var(--text)}
.plan-feat li.ok::before{content:"✓";position:absolute;left:0;color:var(--brand);font-weight:700}
.plan-feat li.no::before{content:"—";position:absolute;left:0;color:var(--border)}
.paywall-note{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}
.current-plan{display:inline-flex;align-items:center;gap:8px;background:var(--brand-soft);color:var(--brand-deep);border-radius:999px;padding:6px 12px;font:600 12px var(--font)}
.report-hero{background:linear-gradient(135deg,var(--brand-soft),var(--surface));border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px}
.report-hero h3{font:700 20px/1.3 var(--serif);margin:0 0 6px}
.report-hero p{color:var(--muted);font-size:13px;margin:0}
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding:10px 4px;border-bottom:1px solid var(--border)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--brand);border-radius:6px 6px 0 0;min-height:3px}
.bars .b span{font-size:10px;color:var(--muted)}
.bars .b b{font-size:11px;color:var(--brand-deep)}
.ft-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.ft-item:hover{border-color:var(--brand)}
.ft-item .ft-b{font:600 13px var(--font);color:var(--brand-deep)}
.ft-item .ft-s{font:14px/1.6 var(--serif);margin:4px 0;color:var(--text)}
.ft-item .ft-x{font-size:12px;color:var(--muted)}
.paywall{position:fixed;inset:0;background:rgba(8,12,10,.55);z-index:1250;display:none;align-items:center;justify-content:center;padding:18px}
.paywall.on{display:flex}
.paywall .box{width:100%;max-width:440px;background:var(--surface);border-radius:18px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.code-input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font:14px var(--font);background:var(--surface);color:var(--text);outline:none;margin-top:8px}
.share-link-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.share-link-box input{flex:1;min-width:220px;padding:8px 12px;border:1px solid var(--border);border-radius:9px;font:13px var(--font);background:var(--surface);color:var(--text)}

/* ---------- 新手带练 ---------- */
#lzCoach{position:fixed;left:50%;top:64px;transform:translateX(-50%);width:calc(100% - 24px);max-width:460px;
  background:var(--surface);border:1px solid var(--brand);border-radius:16px;box-shadow:0 16px 50px rgba(0,0,0,.28);
  padding:14px 16px;z-index:1210}
#lzCoach .tc-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#lzCoach .tc-badge{background:var(--brand-soft);color:var(--brand-deep);border-radius:999px;padding:3px 9px;font:600 11px var(--font)}
#lzCoach .tc-title{font:700 15px/1.4 var(--font)}
#lzCoach .tc-desc{font-size:13px;line-height:1.65;color:var(--muted)}
#lzCoach .tc-dots{display:flex;gap:5px;margin:8px 0 10px}
#lzCoach .tc-dots i{width:100%;height:4px;border-radius:2px;background:var(--border);flex:1}
#lzCoach .tc-dots i.on{background:var(--brand)}
#lzCoach .tc-actions{display:flex;gap:8px;flex-wrap:wrap}
#lzCoach .tc-actions button{flex:1;min-width:110px}
.tut-target{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px;animation:tutPulse 1.1s ease-in-out infinite}
@keyframes tutPulse{0%,100%{box-shadow:0 0 0 0 rgba(15,138,77,.35)}50%{box-shadow:0 0 0 9px rgba(15,138,77,0)}}

/* ---------- 语言模式 ---------- */
.lang-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
  border-radius:999px;padding:6px 12px;cursor:pointer;font:600 13px/1 var(--font);color:var(--text);white-space:nowrap}
.lang-pill:hover{border-color:var(--brand);color:var(--brand-deep)}
.lang-pill #langPillSub{color:var(--muted);font-weight:400;font-size:12px}
.lang-pill #langPillSub::before{content:"→";margin-right:4px}
.nav-more{display:none;border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:6px 10px;cursor:pointer;font-size:16px;color:var(--text)}
.lang-sheet{position:fixed;inset:0;z-index:1400;background:rgba(8,12,10,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.lang-sheet .box{background:var(--surface);border-radius:18px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lang-sheet h3{font:700 18px/1.3 var(--serif);margin:0 0 4px}
.lang-sheet .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.lang-card{border:2px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--surface2);text-align:left}
.lang-card.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.lang-card b{display:block;font:700 15px/1.3 var(--font)}
.lang-card span{font-size:11px;color:var(--muted)}
.lang-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lang-row .chip{flex:0 0 auto}
.lang-badge{display:inline-block;background:var(--surface2);color:var(--muted);border-radius:6px;
  padding:1px 6px;font:500 10px/1.6 var(--font);margin-left:6px;vertical-align:middle}

.lang-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.lang-chips::-webkit-scrollbar{display:none}
.lang-chips .chip{flex:0 0 auto}
/* ---------- 移动端适配 ---------- */
@media (max-width:560px){
  .bar{padding:8px 12px;flex-wrap:nowrap;gap:6px;position:relative}
  .logo small{display:none}
  .logo{font-size:17px;flex:0 0 auto;margin-right:auto}
  .nav-more{display:inline-block}
  .lang-pill{padding:5px 9px;font-size:12px}
  .lang-pill #langPillSub{display:none}
  #mainNav{display:none;position:absolute;top:100%;left:0;right:0;margin:0;padding:10px 12px 14px;
    background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 14px 30px rgba(0,0,0,.14);
    flex-wrap:wrap;gap:6px;z-index:60}
  #mainNav.open{display:flex}
  #mainNav button{padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:10px}
  main{padding:14px 12px 80px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .test-card{margin:14px auto;padding:22px 16px}
  .test-card .word{font-size:28px}
  .detail-head .cover{width:110px}
  .sent .en{font-size:16px}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" onclick="go('library')">LIZZ<b>READ</b><small>线上图书馆</small></div>
    <button class="lang-pill" id="langPill" onclick="openLangPanel()" title="切换学习语言 / 展示语言">
      <span id="langPillMain">🌐 英语</span><span id="langPillSub">中文</span>
    </button>
    <button class="nav-more" id="navMore" onclick="toggleNavMore()" aria-label="更多菜单">☰</button>
    <nav id="mainNav">
      <button id="nav-library" class="on" onclick="go('library')">书城</button>
      <button id="nav-assembly" onclick="go('assembly')">🧩 句子拼装</button>
      <button onclick="go('collections')">📚 书单</button>
      <button id="nav-test" onclick="go('test')">词汇测试</button>
      <button id="nav-vocab" onclick="go('vocab')">生词本</button>
      <button onclick="go('sentcol')">⭐ 金句</button>
      <button onclick="go('review')" id="nav-review" style="display:none">📝 复习</button>
      <button id="nav-sreview" onclick="go('sreview')">生词模式</button>
      <button id="nav-report" onclick="go('report')">📊 报告</button>
      <button id="nav-plan" onclick="go('plan')">💎 会员</button>
      <button id="nav-guide" onclick="go('guide')">🎓 教程</button>
      <button id="nav-settings" onclick="go('settings')">🎨 个性化</button>
      <button id="nav-account" onclick="go('account')">账号</button>
    </nav>
  </div>
</header>

<main>
  <!-- ============ 书城 ============ -->
  <section class="view on" id="view-library">
    <div id="recBanner"></div>
    <div id="recGrid"></div>
    <div class="filters lang-chips" id="langChips"></div>
    <div class="filters" id="lvChips"></div>
    <div class="filters"><div id="genreChips" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
    <div class="filters">
      <button class="btn ghost small" id="importBtnLabel" onclick="document.getElementById('importFile').click()">📥 导入书籍</button>
      <input type="file" id="importFile" accept=".txt,.md,.markdown,.html,.htm,.xhtml,.epub,.docx,.odt,.pdf,.fb2,.rtf,.srt,.vtt,.csv,.json,.zip,.mobi,.azw,.azw3,text/plain,application/epub+zip,application/pdf" multiple style="display:none" onchange="doImport(this)">
      <button class="btn ghost small" onclick="go('guide')" title="支持 16 种格式，点击看导入教程">❓ 支持哪些格式</button>
      <button class="btn ghost small" onclick="openUrlImport()" title="从外部网站抓取正文（Gutenberg / 青空文库 / 维基文库 / 任意文章页）">🔗 网址导入</button>
      <button class="btn ghost small" id="offlineBtn" onclick="downloadAll()">📶 离线下载常用书</button>
      <input class="search" id="searchBox" placeholder="搜索书名 / 作者…">
      <button class="btn ghost small" onclick="runFullTextSearch()">🔎 全文搜索</button>
      <button class="btn ghost small" onclick="document.getElementById('ftResults').innerHTML='';document.getElementById('ftResults').style.display='none'">关闭结果</button>
    </div>
    <div id="recSec"></div>
    <div id="ftResults" style="display:none;margin:12px 0"></div>
    <h2 class="sec" id="gridTitle">全部书目</h2>
    <div class="grid" id="bookGrid"></div>
  </section>

  <!-- ============ 词汇测试 ============ -->
  <section class="view" id="view-test">
    <div id="testIntro">
      <div class="test-card">
        <div class="word" style="font-size:26px">📚 词汇量测试</div>
        <p class="result-desc">
          24 道题，从 A1 到 C2 六个难度递进。<br>
          选出你认为最接近的解释，答完即得 CEFR 等级，<br>
          系统将按等级为你推荐适合的书。
        </p>
        <button class="btn" onclick="startTest()">开始测试（约 2 分钟）</button>
        <p class="result-desc" id="haveLv"></p>
      </div>
    </div>
    <div id="testBox" style="display:none">
      <div class="test-card">
        <div class="prog"><i id="progBar"></i></div>
        <div class="tier" id="qTier"></div>
        <div class="word" id="qWord"></div>
        <div class="opts" id="qOpts"></div>
      </div>
    </div>
    <div id="testResult" style="display:none">
      <div class="test-card">
        <div class="tier">你的词汇等级</div>
        <div class="result-lv" id="resLv"></div>
        <p class="result-desc" id="resDesc"></p>
        <button class="btn" onclick="afterTest()">去书城看推荐书目</button>
        <button class="btn ghost" onclick="startTest()" style="margin-left:8px">重新测试</button>
      </div>
    </div>
  </section>

  <!-- ============ 生词本 ============ -->
  <section class="view" id="view-vocab">
    <h2 class="sec">我的生词本 <span class="tip" style="display:inline" id="vocabCount"></span>
      <span class="tip" id="revTip" style="display:none"></span></h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn" onclick="go('sreview')">🎧 生词模式（复习 / 练习）</button>
      <button class="btn ghost small" id="revBtn" onclick="goReviewew()" style="display:none">📝 今日复习</button>
      <button class="btn ghost small" onclick="wsExport()">⬇️ 导出 JSON</button>
      <button class="btn ghost small" onclick="document.getElementById('vocabImport').click()">⬆️ 导入</button>
      <input type="file" id="vocabImport" accept=".json" style="display:none" onchange="wsImport(this)">
      <button class="btn ghost small" onclick="if(confirm('确定清空所有生词与熟练度？')){store.vocab=[];store.wstates={};try{localStorage.removeItem(pk(langKey('vocab')));localStorage.removeItem(pk(langKey('vocabsrs')));localStorage.removeItem(pk(langKey('wstates')));}catch(e){}renderVocab();toast('已清空本语言生词');}">♻️ 清空</button>
    </div>
    <div class="vlist" id="vocabList"></div>
  </section>

  <!-- ============ 书单合集（增长③） ============ -->
  <section class="view" id="view-collections">
    <h2 class="sec">📚 精选书单合集</h2>
    <div id="collectionsBody"></div>
  </section>

  <!-- ============ 金句本 ============ -->
  <section class="view" id="view-sentcol">
    <h2 class="sec">⭐ 我的金句</h2>
    <div class="tip" id="sentcolTip">在阅读器里点句子旁边的 ⭐ 就收藏进来，配本句译文和收藏时间。</div>
    <div class="vlist" id="sentcolList"></div>
  </section>


  <!-- ============ SM-2 复习页面（增长②） ============ -->
  <section class="view" id="view-review">
    <div id="reviewBody"></div>
  </section>

  <!-- ============ 生词模式（每日复习 + 详细词库） ============ -->
  <section class="view" id="view-sreview">
    <div id="sreviewBody"></div>
  </section>

  <!-- ============ 账号 ============ -->
  <section class="view" id="view-account">
    <div class="test-card" id="accountCard"></div>
  </section>

  <!-- ============ 书籍详情 ============ -->
  <section class="view" id="view-book"></section>

  <!-- ============ 阅读器 ============ -->
  <section class="view" id="view-reader"></section>

  <!-- ============ 句子拼装（独立模块） ============ -->
  <section class="view" id="view-assembly">
    <div id="assemblyBody"></div>
  </section>

  <!-- ============ 个性化设置 ============ -->
  <section class="view" id="view-settings">
    <div id="settingsBody"></div>
  </section>

  <!-- ============ 新手教程 ============ -->
  <section class="view" id="view-guide">
    <div id="guideBody"></div>
  </section>

  <!-- ============ 会员 / 订阅 ============ -->
  <section class="view" id="view-plan">
    <div id="planBody"></div>
  </section>

  <!-- ============ 学习报告 ============ -->
  <section class="view" id="view-report">
    <div id="reportBody"></div>
  </section>
</main>

<!-- 新手引导（首次打开自动弹出） -->
<div id="onboardWrap"></div>

<!-- 生词弹层 -->
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <button class="close" onclick="closeSheet()">✕</button>
  <div class="w" id="shWord"></div>
  <div class="sec-t">📖 常用义</div>
  <div class="d" id="shDef"></div>
  <div id="shGlossBox"></div>
  <div class="d dim" id="shMorph" style="font-size:12px;margin-top:2px"></div>
  <div class="sheet-mini">
    <button class="linkbtn" id="shTr" onclick="translateSheetWord()">🌐 重译此词</button>
    <span class="dot">·</span>
    <button class="linkbtn" id="shCtxTr" onclick="translateSheetCtx()">🌐 翻译本句</button>
    <span class="dot">·</span>
    <button class="linkbtn" id="shMoreBtn" onclick="expandDefs()" style="display:none">更多义项</button>
  </div>
  <details class="fold"><summary>🔍 本句语境义 · 英英 · 音标（点开）</summary>
    <div class="d" id="shCtx" style="margin-bottom:6px;font-size:13px"></div>
    <div class="d dim" id="shEn" style="font-size:12.5px">查询中…</div></details>
  <details class="fold"><summary>🎨 标记 · 🎯 熟练度（点开）</summary>
    <div class="mrow" id="shMarks"></div>
    <div class="mrow" id="shState" style="margin-top:8px"></div>
    <div class="d dim" id="shLookup" style="font-size:12px"></div></details>
  <div class="row" style="margin-top:14px">
    <button class="btn small" id="shAdd">＋ 加入生词本</button>
    <button class="btn ghost small" onclick="speakWord()">🔊 朗读</button>

function dispTitle(b){ return (b && (b.zh || b.t)) || "未命名"; }
function cleanAuthor(a){
  a = String(a||"").trim();
  if(!a || /^(various|unknown|anonymous)$/i.test(a)) return "佚名";
  const first = a.split(";")[0].trim();
  const parts = first.split(",").map(x=>x.trim()).filter(Boolean);
  const isDate = x => /^(\d{4}|c\.\s*\d{4}|ca\.\s*\d{4}|\d{4}-\d{4}|-?\d{4})/.test(x) || /^\d{3,4}\s*[-–]\s*\d{3,4}$/.test(x);
  const nameParts = parts.filter(x=>!isDate(x) && !/^(graf|sir|dame|dr|mr|mrs|rev|st|saint|jr|sr|esq|comte|baron|von|de|du|le|la)$/i.test(x));
  if(nameParts.length >= 2){
    const firstNames = nameParts.slice(1).join(" ");
    return (firstNames + " " + nameParts[0]).replace(/\s+/g," ").trim();
  }
  return first.replace(/\s*\(.*?\)\s*/g,"").replace(/\s+\d{4}.*$/,"").trim() || "佚名";
}
function dispAuthor(b){ return cleanAuthor(b && b.a); }
function dispYear(b){

/* 为 3000+ 本书生成"程序化书衣"（本地 SVG data URI，永不 404，离线可用） */
const _coverCache = new Map();
const COVER_PALETTES = {
  lit:["#1F4B3F","#2F6B55","#0E2E28"], mys:["#1B2230","#39445C","#0B0F18"],

  hum:["#8B5A18","#C79A40","#432A09"], imp:["#4A5258","#7E8A92","#242A2E"]

function _hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function _xml(s){ return String(s||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function _wrapTitle(t, maxCh){
  t = String(t||"").replace(/\s+/g," ").trim();
  if(!t) return ["UNTITLED"];
  const lines = [];
  if(/[\u4e00-\u9fff]/.test(t)){
    const chars = [...t];
    for(let i=0;i<chars.length && lines.length<4;i+=maxCh) lines.push(chars.slice(i,i+maxCh).join(""));
    if(chars.length > maxCh*4) lines[3] = lines[3].slice(0,Math.max(4,maxCh-1))+"…";
    return lines;
  }
  const words = t.split(" ");
  let cur = "";
  for(const w of words){
    if(!cur){ cur = w; continue; }
    if((cur+" "+w).length <= maxCh){ cur += " "+w; }
    else { lines.push(cur); cur = w; }
    if(lines.length >= 4) break;
  }
  if(cur && lines.length < 4) lines.push(cur);
  if(lines.length === 4 && words.join(" ").length > lines.join(" ").length) lines[3] = lines[3].slice(0,Math.max(8,maxCh-1))+"…";
  return lines;
}
function coverArt(b){
  const key = (b.id||b.gb||b.t||"x")+"|"+(b.zh||"");
  if(_coverCache.has(key)) return _coverCache.get(key);
  const g = b.g || "lit";
  const h = _hash(key);
  const angle = 115 + (h % 70);
  const title = dispTitle(b);
  const lines = _wrapTitle(title, title.match(/[\u4e00-\u9fff]/) ? 9 : 18);
  const fs = lines.length <= 2 ? 28 : lines.length === 3 ? 24 : 21;
  const author = dispAuthor(b);
  const y = (b.y && b.y > 0) ? String(b.y) : "PG";

  const baseHue = {lit:155,mys:225,sci:210,fab:22,adv:18,phl:265,drama:355,poe:285,his:32,rom:335,hum:40,imp:210}[g] ?? 155;
  const hue = (baseHue + (h % 44) - 22 + 360) % 360;
  const sat = 30 + (h % 14);
  const c1 = `hsl(${hue} ${sat}% 20%)`;
  const c2 = `hsl(${(hue+8)%360} ${sat+4}% 31%)`;
  const c3 = `hsl(${(hue+350)%360} ${sat}% 11%)`;
  const cx1 = 18 + (h % 60), cy1 = 14 + (h % 30), r1 = 60 + (h % 70);
  const cx2 = 70 + (h % 40), cy2 = 58 + (h % 22), r2 = 30 + (h % 55);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(${angle} .5 .5)">
<stop offset="0" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.55)"/></linearGradient></defs>
<rect width="300" height="400" fill="url(#bg)"/>
<g opacity=".16" fill="none" stroke="#fff" stroke-width="1">
<circle cx="${cx1}" cy="${cy1}" r="${r1}"/><circle cx="${cx2}" cy="${cy2}" r="${r2}"/>
<path d="M0 ${170+(h%60)} Q 150 ${90+(h%80)} 300 ${190+(h%50)}"/>
<path d="M0 ${230+(h%40)} Q 150 ${150+(h%60)} 300 ${250+(h%30)}"/>
</g>
<g opacity=".22" fill="#fff"><rect x="20" y="34" width="44" height="2"/><rect x="20" y="40" width="26" height="1"/></g>
<text x="20" y="62" fill="rgba(255,255,255,.72)" font-family="Georgia,serif" font-size="9" letter-spacing="3">LIZZREAD CLASSICS</text>
<g font-family="Georgia,'Times New Roman',serif" fill="#fff" text-anchor="start">
${lines.map((l,i)=>`<text x="20" y="${118+i*(fs+6)}" font-size="${fs}" font-weight="700" letter-spacing=".3">${_xml(l)}</text>`).join("")}
</g>
<text x="20" y="330" fill="rgba(255,255,255,.78)" font-family="Georgia,serif" font-size="12" font-style="italic">${_xml(author)}</text>
<text x="20" y="352" fill="rgba(255,255,255,.58)" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5">${_xml((GENRES()[g]||"CLASSICS")+" · "+y)}</text>
<rect y="330" width="300" height="70" fill="url(#sh)" opacity=".35"/>
<line x1="20" y1="366" x2="94" y2="366" stroke="rgba(255,255,255,.45)" stroke-width="1"/>
<text x="20" y="384" fill="rgba(255,255,255,.5)" font-family="Arial,sans-serif" font-size="7" letter-spacing="1">LIZZREAD · READ THE WORLD</text>
<rect x="0" y="0" width="300" height="400" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
</svg>`;
  /* 单引号必须编码：data URI 会被放进 onclick="this.src='...'" 里，未编码会截断 JS 字符串 */

let _bigDictLoading = false;
const _DICT_V = "7";
let _bigDictPromise = null;
function loadBigDict(){
  if(window.LIZ_DICT) return Promise.resolve(true);
  if(_bigDictPromise) return _bigDictPromise;
  _bigDictLoading = true;
  _bigDictPromise = new Promise(resolve => {
    const s = document.createElement("script");
    s.src = "./dict.js?v="+_DICT_V;
    s.async = true;
    s.onload = ()=>{ _bigDictLoading = false; resolve(true); };
    s.onerror = ()=>{ _bigDictLoading = false; _bigDictPromise = null; resolve(false); };
    document.head.appendChild(s);
  });
  return _bigDictPromise;
}

/* 词形变化兜底：复数/过去式/进行式/副词/比较级 */
function _baseForms(w){
  const c = [];
  if(/ies$/.test(w)) c.push(w.slice(0,-3)+"y");
  if(/ied$/.test(w)) c.push(w.slice(0,-3)+"y");
  if(/es$/.test(w)) c.push(w.slice(0,-2));
  if(/s$/.test(w) && !/ss$/.test(w)) c.push(w.slice(0,-1));
  if(/ed$/.test(w)){ c.push(w.slice(0,-2)); c.push(w.slice(0,-1)); }
  if(/ing$/.test(w)){ c.push(w.slice(0,-3)); c.push(w.slice(0,-3)+"e"); }
  if(/ly$/.test(w)) c.push(w.slice(0,-2));
  if(/er$/.test(w)){ c.push(w.slice(0,-2)); c.push(w.slice(0,-1)); }
  if(/est$/.test(w)){ c.push(w.slice(0,-3)); c.push(w.slice(0,-2)); }
  return c.filter(x=>x.length>2 && x!==w);
}
function _getDictEntry(w){
  const G = window.LIZ_DICT;
  if(G){
    if(G[w]) return G[w];
    for(const b of _baseForms(w)) if(G[b]) return G[b];
  }
  return null;
}
function dictEntry(w){
  const raw = String(w || "").trim();
  if(activeLang() !== "en"){
    /* 非英语：本地无词条 → 返回 [词性, 已缓存释义] 或 null（由机翻兜底） */
    const key = raw.toLowerCase();
    if(_zhCache[key]) return ["", _zhCache[key]];
    return null;
  }
  const low = raw.toLowerCase().replace(/[^a-z'-]/g,"");
  if(!low) return null;
  if(DICT[low]) return DICT[low];
  const G = _getDictEntry(low);
  if(G) return [G[0], G[1]];
  for(const b of _baseForms(low)) if(DICT[b]) return [DICT[b][0], DICT[b][1]+"（"+low+"）"];
  /* 所有格：mother's → mother */
  if(/'s$/.test(low)){
    const base = low.slice(0,-2);
    const e = dictEntry(base);
    if(e) return [e[0], e[1]+"（所有格）"];
  }
  /* 连字符复合词：door-nail / well-known */
  if(low.includes("-")){
    const parts = low.split("-").filter(Boolean);
    const gloss = [];
    let ok = true;
    for(const p of parts){
      const e = dictEntry(p);
      if(e && e[1]) gloss.push(p+"："+e[1].split(/[；;]/)[0]);
      else { ok = false; break; }
    }
    if(ok && gloss.length) return ["复合词", gloss.join("；")];
  }
  return null;
}

function dictEnDef(w){
  const low = String(w||"").toLowerCase().replace(/[^a-z'-]/g,"");
  if(!low) return "";
  const G = _getDictEntry(low);
  if(G && G[2]) return G[2];
  return "";
}

async function loadLanguageBooks(code){
  code = code || activeLang();
  if(code === 'en') return BOOKS;
  if(_langBooks[code]) return _langBooks[code];
  if(_langLoading[code]) return _langLoading[code];
  _langLoading[code] = new Promise((resolve) => {
    const FINISH_MAIN = () => {
      const raw = window['LZ_LANG_' + code.toUpperCase()] || [];
      const bad = /\b(English|Anglais|Inglés|Inglese|Englisch)\b/i;
      const list = raw.filter(b => !bad.test(String(b.t + ' ' + (b.a || '')))).map((b, i) => ({
        id: 'L-' + code + '-' + (b.gb || b.az || b.ko || i),
        t: b.t, zh: (code === 'zh' ? b.t : (b.zh || '')), en: b.en || '', a: b.a || '', y: b.y || 0, lv: b.lv || 'B2', g: b.g || 'lit',
        gb: b.gb || 0, az: b.az || '', ko: b.ko || '',
        d: b.d || '', lang: code, fs: b.fs ? 1 : 0,
        demo: Array.isArray(b.demo) ? b.demo : (b.demo ? [b.demo] : [])
      }));
      return list;
    };
    const finish = () => { const list = FINISH_MAIN(); _langBooks[code] = list; resolve(list); };
    if(window['LZ_LANG_' + code.toUpperCase()]) return finish();
    /* 先加载译本（经典著作的日/韩/中等译本），再加载本语言书目，两者合并后才算加载完成 */
    const loadScript = (src) => new Promise((res) => {
      const sc = document.createElement('script');
      sc.src = src;
      sc.onload = () => res(true);
      sc.onerror = () => {
        /* 离线壳（file://）里动态 script 可能被拦：改用同步 XHR 读取已缓存内容 */
        let ok = false;
        try{
          const x = new XMLHttpRequest();
          x.open("GET", src, false); x.send(null);
          if((x.status === 200 || x.status === 0) && x.responseText){ (0, eval)(x.responseText); ok = true; }
        }catch(e){ ok = false; }
        res(ok);
      };
      document.head.appendChild(sc);
    });
    (async () => {
      await loadScript('data/lang-' + code + '-tr.js?v=1');
      await loadScript('data/lang-' + code + '.js?v=2');
      const extra0 = (window['LZ_LANG_' + code.toUpperCase() + '_TR'] || []).map((b, i) => ({
        id: 'T-' + code + '-' + i, t: b.t, zh: b.zh || '', en: b.en || '', a: b.a || '', y: b.y || 0,
        lv: b.lv || 'B2', g: b.g || 'lit', gb: b.gb || 0, az: '', ko: '', d: b.d || '', lang: code,
        fs: 0, demo: Array.isArray(b.demo) ? b.demo : [], translated: 1
      })).filter(b => !/\b(English|Anglais|Inglés|Inglese|Englisch)\b/i.test(String(b.t)));
      /* 译本与本土书目合并（同一 GB 号已在部分语言书目里的，保留本土标题），再统一产出 */
      const list = FINISH_MAIN();
      const seen = new Set(list.map(b => String(b.gb || "")));
      const add = extra0.filter(b => !seen.has(String(b.gb || "")));
      _langBooks[code] = list.concat(add);
      resolve(_langBooks[code]);
    })();
  });
  return _langLoading[code];
}

async function migrateImports(){
  if(_migratingImports) return _migratingImports;

    let old = [];
    try{ old = JSON.parse(localStorage.getItem("lz_imports")||"[]"); }catch(e){ old = []; }
    if(!old.length) return;
    const meta = [];
    for(const rec of old){
      if(!rec || !rec.id) continue;
      try{

            sents, chapters, text:rec.text, chars:rec.text.length, at:rec.at||Date.now()});
          meta.push({id:rec.id, t:rec.t||"导入书籍", format:rec.format||"TXT", chars:rec.text.length,
            sents:sents.length, chapters:chapters.length, at:rec.at||Date.now()});
        } else if(rec.sents){
          meta.push(rec);
        }
      }catch(e){ meta.push({...rec, text:undefined}); }

/* 语言迁移：把当前学习语言的生词转成另一种学习语言（走机翻） */
async function transferVocabTo(fromCode, toCode){
  if(!fromCode || !toCode || fromCode === toCode) return 0;
  const srcKey = "lz_" + (ACCOUNT ? ACCOUNT.name + "_" : "") + "vocab_" + fromCode;
  const dstKey = "lz_" + (ACCOUNT ? ACCOUNT.name + "_" : "") + "vocab_" + toCode;
  let src = [], dst = [];
  try{ src = JSON.parse(localStorage.getItem(srcKey) || "[]"); }catch(e){ src = []; }
  try{ dst = JSON.parse(localStorage.getItem(dstKey) || "[]"); }catch(e){ dst = []; }
  if(!src.length) return 0;
  const need = src.filter(x => !dst.some(y => y.w === x.w)).map(x => x.w).slice(0, 40);
  const map = await apiTranslateTexts(need);
  let n = 0;
  for(const w of need){
    const t = map[w];
    if(!t) continue;
    dst.unshift({w:t, m:"（来自 " + (LANG_INFO[fromCode]||{}).native + " 的生词「" + w + "」）", src:"语言迁移", book:"", si:0, sent:"", ctx:"", at:Date.now(), marked_at:Date.now()});
    n++;
  }
  localStorage.setItem(dstKey, JSON.stringify(dst));
  return n;
}

/* =====================================================
  增长② SM-2 间隔重复复习引擎
  扩 wordStates 加 due/ef/reps/interval，自动安排复习
===================================================== */
const _SM_BASE = { ef: 2.5, reps: 0, interval: 0, due: 0, addedAt: 0 };
function smSchedule(stem, quality){
  /* quality 0-3：0=忘了（重新学），1=费劲，2=还行，3=很容易 */
  const ws = wordStates();
  const fs = ws[stem];
  if(!fs) return;
  const sm = fs.sm = fs.sm || { ..._SM_BASE, addedAt: Date.now(), due: Date.now() };
  const q = quality;
  if(q < 2){
    sm.reps = 0; sm.interval = 1;
  } else {
    sm.ef = Math.max(1.3, sm.ef + (0.1 - (3 - q) * (0.08 + (3 - q) * 0.02)));
    sm.reps++;
    sm.interval = sm.reps === 1 ? 1 : sm.reps === 2 ? 3 : Math.round(sm.interval * sm.ef);
  }
  sm.due = Date.now() + sm.interval * 24 * 60 * 60 * 1000;
  saveWS();
}
function dueVocabs(){
  const ws = wordStates(); const now = Date.now();
  return Object.entries(ws).filter(([stem,fs])=>{
    const sm = fs.sm;
    if(!sm) return false;
    return sm.due <= now && fs.st !== -1;
  });
}

/* =====================================================
  增长① 远程 PG 元数据（按需拉取，IndexedDB 缓存）
===================================================== */
/* =====================================================
  IndexedDB 封装 — 解决长书/多书缓存问题（localStorage 仅 5MB，IndexedDB 几百 MB）
===================================================== */
let _idbPromise = null;
function openIDB(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    const r = indexedDB.open("lizzread_v1", 3);
    r.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains("books")) db.createObjectStore("books", {keyPath:"gb"});
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", {keyPath:"key"});
      if(!db.objectStoreNames.contains("imports")) db.createObjectStore("imports", {keyPath:"id"});
      if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv", {keyPath:"key"});
    };
    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
  return _idbPromise;
}
async function idbPut(gb, txt, size, title){
  try{
    const db = await openIDB();
    const tx = db.transaction("books","readwrite");
    tx.objectStore("books").put({ gb, txt, size, title, createdAt: Date.now(), lastReadAt: Date.now() });
    await new Promise((res, rej)=>{ tx.oncomplete=res; tx.onerror=rej; });
    /* 超 100MB 自动清理最久没读的 */
    idbGc();
  } catch(e){
    /* IndexedDB 不可用时兜底 localStorage */
    try{ localStorage.setItem("lz_remote_"+gb, txt); }catch(e2){}
  }
}
async function idbDel(gb){
  try{
    const db = await openIDB();
    const tx = db.transaction("books","readwrite");
    tx.objectStore("books").delete(gb);
    await new Promise((res, rej)=>{ tx.oncomplete=res; tx.onerror=rej; });
  }catch(e){}
  try{ localStorage.removeItem("lz_remote_"+gb); }catch(e){}
}
async function idbGet(gb){
  try{
    const db = await openIDB();
    const tx = db.transaction("books","readonly");
    const req = tx.objectStore("books").get(gb);
    const r = await new Promise((res, rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=rej; });
    if(r){
      /* 更新 lastReadAt */
      const tx2 = db.transaction("books","readwrite");
      tx2.objectStore("books").put({ ...r, lastReadAt: Date.now() });
      return r.txt;
    }
  } catch(e){}
  /* 兜底 localStorage */
  const c = localStorage.getItem("lz_remote_"+gb);
  if(c){
    /* 迁移进 IndexedDB，然后删 localStorage */
    try{ await idbPut(gb, c, c.length, ""); localStorage.removeItem("lz_remote_"+gb); }catch(e){}
    return c;
  }
  return null;
}
async function idbHas(gb){
  try{
    const db = await openIDB();
    const tx = db.transaction("books","readonly");
    const req = tx.objectStore("books").count(gb);
    const n = await new Promise((res, rej)=>{ req.onsuccess=()=>res(req.result); req.onerror=rej; });
    if(n>0) return true;
  } catch(e){}
  return !!localStorage.getItem("lz_remote_"+gb);
}
async function idbSize(){
  try{
    const db = await openIDB();
    const tx = db.transaction("books","readonly");
    const all = await new Promise((res, rej)=>{ const r=tx.objectStore("books").getAll(); r.onsuccess=()=>res(r.result); r.onerror=rej; });
    return all.reduce((s,x)=> s + (x.size||x.txt.length||0), 0);
  } catch(e){ return 0; }
}
async function idbGc(){
  /* 超过 100MB → 删除 lastReadAt 最旧的直到 ≤ 70MB */
  const limit = 100*1024*1024;
  const target = 70*1024*1024;
  let total = await idbSize();
  if(total < limit) return;
  try{
    const db = await openIDB();
    const tx = db.transaction("books","readonly");
    const all = await new Promise((res, rej)=>{ const r=tx.objectStore("books").getAll(); r.onsuccess=()=>res(r.result); r.onerror=rej; });
    /* 只清理“按需下载”的书（file 字段为空表示非站内打包书），且按最近阅读时间排序 */
    all.sort((a,b)=> (a.lastReadAt||0)-(b.lastReadAt||0));
    const wr = db.transaction("books","readwrite");
    for(const b of all){
      if(total <= target) break;
      if(b.file) continue;           /* 站内打包书不参与回收 */
      wr.objectStore("books").delete(b.gb);
      total -= (b.size||b.txt.length||0);
    }
  } catch(e){}
}

function exportWordCard(){
  const c = document.createElement("canvas");
  c.width = 512; c.height = 512;
  const ctx = c.getContext("2d");
  const g = ctx.createLinearGradient(0,0,512,512);
  g.addColorStop(0,"#0F8A4D"); g.addColorStop(1,"#0B6B3C");
  ctx.fillStyle = g; ctx.fillRect(0,0,512,512);
  ctx.fillStyle = "#fff";
  const w = sheetWord || "";
  ctx.font = "bold 48px Georgia, serif"; ctx.textAlign = "center";
  ctx.fillText(w, 256, 140);
  ctx.font = "20px Georgia"; ctx.fillStyle = "#E7F5EC";
  const e0 = (window._dictCache||{})[w.toLowerCase()];
  if(e0 && e0.phon) ctx.fillText("/"+e0.phon.replace(/^\/|\/$/g,"")+"/", 256, 180);
  const d = dictEntry(w.toLowerCase());
  if(d){ ctx.font = "bold 28px 'PingFang SC', 'Microsoft YaHei', sans-serif"; ctx.fillStyle = "#fff";
    wrapText(ctx, d[1], 256, 250, 440, 38); }
  if(lastSent && lastSent.en){
    ctx.font = "italic 16px Georgia, serif"; ctx.fillStyle = "rgba(255,255,255,.85)";
    wrapText(ctx, "\u201C"+lastSent.en.slice(0, 140)+"\u201D", 256, 390, 440, 22);
  }
  ctx.font = "12px sans-serif"; ctx.fillStyle = "rgba(255,255,255,.5)";
  ctx.fillText("LIZZREAD · 双语线上图书馆", 256, 480);
  c.toBlob(blob=>{
    /* 优先 Web Share API，回退下载 */
    const file = new File([blob], "lizzread-"+w+".png", {type:"image/png"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({
        title: w, text: (d?d[1]:"") + " · LIZZREAD 点词查义", files:[file]
      }).catch(()=>{});
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "lizzread-"+w+".png"; a.click();
    }
  });
}
function wrapText(ctx, text, x, y, maxW, lh){
  const words = text.split(" "); let line = ""; let cy = y;
  for(const w of words){
    const test = line + w + " ";
    if(ctx.measureText(test).width > maxW){ ctx.fillText(line, x, cy); line = w + " "; cy += lh; }
    else line = test;
  }
  if(line) ctx.fillText(line, x, cy);
}

let _bia = null;

const INSTALL_DISMISS_KEY = "lz_install_dismissed_at";
function installPromptAllowed(){
  try{
    const at = Number(localStorage.getItem(INSTALL_DISMISS_KEY) || 0);

    if(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) return false;

  }catch(e){}

const _prefetchBooks = new Set();
async function prefetchBookData(b){
  if(!b || (!b.gb && !b.az)) return;
  const key = b.az || b.gb;
  if(_prefetchBooks.has(key)) return;
  if(fullCache[b.id] && fullCache[b.id].sents) return;
  _prefetchBooks.add(key);
  try{
    const txt = await (typeof loadLanguageText === "function" ? loadLanguageText(b, null) : loadBookText(b, null));
    const parsed = parseFull(txt);
    if(parsed && parsed.sents.length >= 20){
      fullCache[b.id] = parsed;
      await loadBookTranslations(b.id, parsed);
    }
  }catch(e){ /* 预取失败不影响用户手动打开 */ }
  finally{ _prefetchBooks.delete(key); }
}

/* =====================================================
  九、双语阅读器：逐句对照(可关) + 背景色 + 颜色标记 + TTS
===================================================== */
const fullCache = {};        // bookId → {sents:[{en,zh}], chapters:[{t,start,end}]}
let fullMode = null;         // {id, chap} 整书阅读模式
/* 解析古腾堡纯文本：只去平台许可证 → 保留原书目录/前言/题献 → 按标题分章 → 全书分句
   原则：不丢正文；标题识别必须行首锚定，避免正文里的 “book 4” 被误判 */
function parseFull(txt){
  let t = String(txt).replace(/\r/g,"");
  /* 头部：只切掉 START 之前的平台许可证与元数据 */
  const st = t.search(/\*\*\*\s*START OF (THE|THIS) PROJECT/i);
  if(st > -1) t = t.slice(st).replace(/^[^\n]*\n/, "");
  /* 尾部：END 标记 / 旧式结尾 / 许可证正文，全部切掉 */
  let end = t.length;
  [/\*\*\*\s*END OF (THE|THIS) PROJECT/i,
   /\n\s*End of (the )?Project Gutenberg/i,
   /\n\s*THE FULL PROJECT GUTENBERG LICENSE/i,
   /\n\s*Section\s+1\.\s+General Terms of Use/i].forEach(re=>{
    const m = t.search(re);
    if(m > -1 && m < end) end = m;
  });
  t = t.slice(0, end);

  const blocks = t.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const NUM = "([IVXLCDM]+|\\d{1,3}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred)";
  function headingKind(b){
    const lines = b.split("\n");
    if(b.length > 120 || lines.length > 3) return null;
    const s = b.replace(/\s+/g," ").trim();
    if(!s) return null;
    /* 目录行：点线引导符或多个页码，不当章节标题（作为正文保留） */
    if(/\.{3,}|(\.\s*){3,}|…{2,}/.test(s)) return null;
    /* CHAPTER / PART / BOOK / LETTER / EPISODE / CANTO / STAVE / ACT / SCENE */
    const m = s.match(new RegExp("^(chapter|part|book|volume|letter|episode|canto|stave|act|scene|section)\\b\\s*" + NUM + "?\\s*[.:—–-]?\\s*(.{0,60})$","i"));
    if(m){
      /* 排除 “the book 4 times…” 这类句子：标题里不应有句末标点 */
      if(/[.!?]\s+\S/.test(m[3]||"")) return null;
      return "named";
    }
    /* 前后件类标题 */
    if(/^(prologue|epilogue|preface|introduction|foreword|afterword|contents|table of contents|dedication|appendix|notes?|glossary)\b/i.test(s)) return "named";
    /* 装饰性章节号：— I — / [ 1 ] / I. / 12. */
    if(/^[—–-]\s*[IVXLCDM\d]{1,4}\s*[—–-]$/.test(s)) return "bare";
    if(/^\[\s*\d{1,3}\s*\]$/.test(s)) return "bare";
    if(/^[IVXLCDM]{1,7}\.?$/.test(s)) return "bare";
    if(/^\d{1,3}\.?$/.test(s)) return "bare";
    /* 罗马/阿拉伯数字 + 全大写标题，如 “I. A SCANDAL IN BOHEMIA” */
    if(/^([IVXLCDM]{1,7}|\d{1,3})\.\s+[A-Z][A-Z0-9 ,.'’\-]{3,}$/.test(s)) return "named";
    return null;
  }

  const sents = [], chapters = [];
  let heading = "卷首 · 书名页 / 目录 / 题献";
  let curStart = 0;
  const close = ()=>{
    chapters.push({t:heading, start:curStart, end:sents.length});
    curStart = sents.length;
  };
  for(const b of blocks){
    const kind = headingKind(b);
    if(kind){
      const empty = sents.length === curStart;
      /* 刚设过标题又遇到装饰性数字（I. / [ 1 ]），忽略，避免把真标题冲掉 */
      if(empty && kind === "bare" && heading !== "卷首 · 书名页 / 目录 / 题献") continue;
      const title = b.replace(/\s+/g," ").trim().replace(/\]\s*$/,"").replace(/\.\s*$/,"").slice(0,80);
      if(empty){ heading = title; }        /* 空章：直接换标题，不产生空章 */
      else { close(); heading = title; }
      continue;
    }
    const p = b.replace(/\s+/g," ").trim();
    if(!p) continue;
    if(/^(image|illustration|\[illustration)/i.test(p)) continue;
    p.split(/(?<=[.!?…"”])\s+/).forEach(s=>{ s = s.trim(); if(s) sents.push({en:s, zh:null}); });
  }
  close();

  /* 丢弃空章；如果章节识别失败，按 250 句切分兜底 */
  let chs = chapters.filter(c=>c.end > c.start);
  if(!chs.length || (sents.length > 400 && chs.length < 4) ||
     (chs.length < 30 && sents.length / chs.length > 1500)){
    chs = [];
    const step = Math.max(120, Math.ceil(sents.length/40));
    for(let i=0; i<sents.length; i+=step)
      chs.push({t:`第 ${chs.length+1} 部分`, start:i, end:Math.min(i+step, sents.length)});
  }
  /* 相邻超短章（目录/题词误判）合并，避免出现只有 1 句的“章” */
  const merged = [];
  for(const c of chs){
    const last = merged[merged.length-1];
    if(last && (c.end-c.start <= 1 || last.end-last.start <= 1) && (c.end-c.start)+(last.end-last.start) < 60){
      last.end = c.end;
    } else merged.push({...c});
  }
  return {sents, chapters:merged};
}

/* 打开精读导读：把导读内容转成与整书一致的数据结构 */
function openGuide(id){
  const g = GUIDES[id];
  if(!g) return;
  const sents = [], chapters = [];
  g.forEach(ch=>{
    const start = sents.length;
    ch.items.forEach(it=>sents.push({en:it.en, zh:it.zh}));
    chapters.push({t:ch.t, start, end:sents.length});
  });
  fullCache[id] = {sents, chapters, guide:true};
  fullMode = {id, chap:0};
  openReader(id);
}
/* 整书阅读入口：加载全文 → 分章 → 打开阅读器
   优先读站内打包文件；缺失时自动从古腾堡镜像拉取并写入 IndexedDB（装到 PWA 后可离线）
   自动恢复上次阅读位置 */
const _bookLoadJobs = {};
async function loadBookText(b, onProgress){
  const gb = Number(b.gb);
  if(!gb) throw new Error("这本书没有可用的公版编号");
  if(_bookLoadJobs[gb]) return _bookLoadJobs[gb];
  const job = (async()=>{
    /* 1) 站内打包文件优先（仓库里已带的 145 本，秒开；静态托管时这是主路径） */
    {
      const localPath = b.file || ("./books/pg"+gb+".txt");
      try{
        const r = await fetch(localPath, {cache:"force-cache"});
        if(r.ok){
          const t = await r.text();
          if(t && t.length > 2000 && !/^\s*(URL Source:|<!DOCTYPE|<html)/i.test(t.slice(0, 300))) return t;
        }
      }catch(e){}
    }
    /* 2) IndexedDB 离线缓存（历史缓存可能被代理写入错误页，读时校验并丢弃） */
    try{
      const cached = await idbGet(gb);
      if(cached && cached.length > 2000){
        const head = String(cached).slice(0, 400);
        if(/^\s*(URL Source:|<!DOCTYPE|<html)/i.test(head)){
          try{ await idbDel(gb); }catch(e){}
        } else {
          return cached;
        }
      }
    }catch(e){}
    if(isOfflineMode()) throw new Error("离线模式：这本书还没下载到本地。关闭离线模式或先点「离线下载本书」。");
    /* 3) 本机服务端代理（同源，无 CORS；首次抓取后落盘 books/pg<id>.txt） */
    let lastErr = null;
    if(/^https?:/.test(location.protocol)){
      try{
        const t = await fetchTextProgress(apiUrl("api/pg/") + gb, onProgress, 150000);
        if(t && t.length > 2000 && !t.startsWith('{"error"') && !/^\s*(URL Source:|<!DOCTYPE|<html)/i.test(t.slice(0, 300))){
          try{ await idbPut(gb, t, t.length, b.t); }catch(e){}
          return t;
        }
        lastErr = new Error("代理返回内容过短");
      }catch(e){ lastErr = e; }
    }
    /* 静态托管（没有后端）时，浏览器直连古腾堡会被跨域拦截：
       跳过 3 个必失败的镜像，直接走代理，整体在 ~20 秒内给出结论 */
    const canDirect = hasLocalAPI !== false || window.__LZ_NATIVE;
    if(!canDirect){
      const proxied0 = [
        "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://gutenberg.pglaf.org/cache/epub/" + gb + "/pg" + gb + ".txt"),
        "https://r.jina.ai/https://gutenberg.pglaf.org/cache/epub/" + gb + "/pg" + gb + ".txt"
      ];
      for(const url of proxied0){
        try{
          let txt = await fetchTextProgress(url, onProgress, 12000);
          if(!txt || txt.length < 2000) continue;
          if(/^(Title:|URL Source:|Markdown Content:)/.test(txt)){
            const cut = txt.indexOf('Markdown Content:');
            if(cut >= 0) txt = txt.slice(cut + 18);
          }
          txt = txt.replace(/^\s*URL Source:[^\n]*\n/i, '');
          if(/^\s*<!DOCTYPE|<html/i.test(txt.slice(0,300)) || txt.length < 2000) continue;
          try{ await idbPut(gb, txt, txt.length, b.t); }catch(e){}
          return txt;
        }catch(e){ lastErr = e; }
      }
      throw new Error("网页版无法直接获取这本书的全文（浏览器跨域限制）。\n\n三个办法：\n① 装 App（Android 版内置离线全文）\n② 在设置里填一个已部署的后端地址\n③ 换一本已内置全文的书（书城左上角「可读全文」标记）");
    }
    /* 4) 古腾堡镜像（带进度 + 超时 + 备用域名） */
    const mirrors = [
      "https://gutenberg.pglaf.org/cache/epub/"+gb+"/pg"+gb+".txt",
      "https://gutenberg.pglaf.org/cache/epub/"+gb+"/pg"+gb+"-0.txt",
      "https://www.gutenberg.org/cache/epub/"+gb+"/pg"+gb+".txt"
    ];
    for(const url of mirrors){
      try{
        const txt = await fetchTextProgress(url, onProgress, 45000);
        /* 校验是 Gutenberg 正文而非错误页/HTML（镜像偶尔返回 200 + 网页） */
        if(txt && txt.length > 2000 && !/^\s*(URL Source:|<!DOCTYPE|<html)/i.test(txt.slice(0, 400))){
          try{ await idbPut(gb, txt, txt.length, b.t); }catch(e){}
          return txt;
        }
        lastErr = new Error("返回内容不是正文");
      }catch(e){ lastErr = e; }
    }
    /* 5) 跨域阅读代理（Capacitor/无本地服务时最后兜底） */
    const proxied = [
      "https://r.jina.ai/https://gutenberg.pglaf.org/cache/epub/"+gb+"/pg"+gb+".txt",
      "https://api.allorigins.win/raw?url="+encodeURIComponent("https://gutenberg.pglaf.org/cache/epub/"+gb+"/pg"+gb+".txt")
    ];
    for(const url of proxied){
      try{
        let txt = await fetchTextProgress(url, onProgress, 60000);
        if(!txt || txt.length < 2000) continue;
        /* r.jina.ai 会加 Markdown 头（Title:/URL Source:/Markdown Content:），切到正文 */
        if(/^(Title:|URL Source:|Markdown Content:)/.test(txt)){
          const cut = txt.indexOf('Markdown Content:');
          if(cut >= 0) txt = txt.slice(cut + 'Markdown Content:'.length);
          else if(txt.startsWith('Title:')){ const c2 = txt.indexOf('\n\n'); if(c2 > 0) txt = txt.slice(c2 + 2); }
        }
        txt = txt.replace(/^\s*URL Source:[^\n]*\n/i, '').replace(/^\s*Markdown Content:\s*\n?/i, '');
        if(/^\s*<!DOCTYPE|<html/i.test(txt.slice(0, 300))) continue;
        try{ await idbPut(gb, txt, txt.length, b.t); }catch(e){}
        return txt;
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error("无法从古腾堡镜像取回全文");
  })();
  _bookLoadJobs[gb] = job;
  try{ return await job; } finally { delete _bookLoadJobs[gb]; }
}
/* 流式下载纯文本，边下边更新进度 */
async function fetchTextProgress(url, onProgress, timeoutMs){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs || 45000);
  try{
    const r = await fetch(url, {signal:ctrl.signal, cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const total = Number(r.headers.get("content-length") || 0);
    if(!r.body || !r.body.getReader){
      const t = await r.text();
      if(onProgress) onProgress(100, t.length, total);
      return t;
    }
    const reader = r.body.getReader();
    const chunks = [];
    let got = 0;
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value); got += value.length;
      if(onProgress) onProgress(total ? Math.min(99, Math.round(got/total*100)) : -1, got, total);
    }
    const all = new Uint8Array(got);
    let off = 0;
    for(const c of chunks){ all.set(c, off); off += c.length; }
    return new TextDecoder("utf-8").decode(all);
  } finally { clearTimeout(timer); }
}
/* 离线样章：用书目自带的 3~5 个真实句子组成一篇短读（不需要网络也能读、能点词） */
function openDemoReader(id){
  const b = BOOKS.find(x => x.id === id);
  if(!b) return;
  const lines = (b.demo || []).slice(0, 8);
  if(!lines.length){ toast("这本书没有内置样章，联网后可直接读全文。"); return; }
  const sents = lines.map(t => ({ en: t, zh: null }));
  fullCache[id] = { sents, chapters: [{ t: "离线样章", start: 0, end: sents.length }], demo: true };
  fullMode = { id, chap: 0 };
  openReader(id);
  setTimeout(() => autoTranslateOnOpen(id, fullCache[id]), 600);
}

/* 日语（青空文库）/韩语（无公版全文）语言：按需加载 */
/* 把 "000148/files/773_14560.html" 编码成单段路径 */
function splitAzPath(az){
  const p = String(az || "").replace(/\.html$/i, "");
  return p.split('/').map(encodeURIComponent).join('%2F');
}
async function loadLanguageText(b, onProgress){
  const code = activeLang();
  if(b.demo && b.demo.length && !b.gb && !b.az){
    return b.demo.join('\n\n');
  }
  if(b.az){
    let lastErr = null;
    for(let attempt = 0; attempt < 3; attempt++){
      try{
        if(attempt) await new Promise(r => setTimeout(r, 800 * attempt));
        if(!hasLocalAPI) throw new Error("离线壳没有青空文库代理，请联网后在网页版阅读");
        const r = await fetch(apiUrl("api/az/") + splitAzPath(b.az), {signal: AbortSignal.timeout(180000)});
        if(r.ok){
          const t = await r.text();
          if(t && t.length > 400 && !/^\s*\{/.test(t)) return t;
          lastErr = new Error("返回内容异常");
        } else {
          lastErr = new Error("HTTP " + r.status);
        }
      }catch(e){ lastErr = e; }
    }
    throw new Error("青空文库暂时取不到这篇（" + (lastErr && lastErr.message || "网络") + "）");
  }
  if(b.gb){
    return await loadBookText(b, onProgress);
  }
  if(b.demo) return b.demo.join('\n\n');
  throw new Error("这本书暂时没有可读全文");
}

/* 离线下载当前书：拉全文 + 解析 + 存 IndexedDB（之后断网可读） */
async function downloadBook(id){
  const b = BOOKS.find(x=>x.id===id);
  if(!b || !b.gb) return;
  let off = [];
  try{ off = JSON.parse(localStorage.getItem(pk("offline_books")) || "[]"); }catch(e){ off = []; }
  if(!isPro() && off.length >= FREE_OFFLINE_BOOKS && !off.includes(String(b.gb))){
    showPaywall("免费版最多离线保存 " + FREE_OFFLINE_BOOKS + " 本");
    return;
  }
  const btn = event && event.target ? event.target : null;
  if(btn){ btn.disabled = true; btn.textContent = "📶 下载中…"; }
  try{
    const txt = await loadBookText(b, null);
    const parsed = parseFull(txt);
    fullCache[id] = parsed;
    await idbPut(Number(b.gb), txt, txt.length, b.t);
    await saveBookTranslations(id, parsed);
    try{ off = JSON.parse(localStorage.getItem(pk("offline_books")) || "[]");
      if(!off.includes(String(b.gb))) off.push(String(b.gb));
      localStorage.setItem(pk("offline_books"), JSON.stringify(off)); }catch(e){}
    if(btn){ btn.textContent = "✓ 已离线（"+Math.round(txt.length/1024)+"KB）"; }
    else alert("已离线保存《"+b.t+"》，断网也能读。");
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent="📶 离线下载本书"; }
    alert("离线下载失败："+(e.message||e));
  }
}
/* 滚动到指定句序号（sentIdx 是全书全局序号） */
function scrollToSent(sentIdx){
  const rng = fullCache[curBook.id].chapters[fullMode.chap];
  if(sentIdx < rng.start || sentIdx >= rng.end){
    /* 目标句子不在当前章，跳过去 */
    for(let i=0; i<fullCache[curBook.id].chapters.length; i++){
      const c = fullCache[curBook.id].chapters[i];
      if(sentIdx >= c.start && sentIdx < c.end){
        jumpChapter(i);
        setTimeout(()=>scrollToSent(sentIdx), 120);
        return;
      }
    }
    return;
  }
  /* 逐句模式下找 dataset.si === sentIdx 的元素 */
  const node = document.querySelector(`#view-reader .sent[data-si="${sentIdx}"]`);
  if(node){ node.scrollIntoView({block:"center", behavior:"smooth"}); }
}
function jumpChapter(n){
  if(!fullMode) return;
  saveProgressNow();
  fullMode.chap = Math.max(0, Math.min(fullCache[curBook.id].chapters.length-1, Number(n)));
  openReader(curBook.id);
  window.scrollTo(0, 0);
  setTimeout(saveProgressNow, 200);
}
/* 翻译本章：逐句机翻 + 并发 4 + 自动缓存；离线时走本地译文/释义 */
async function mtChapter(){
  if(!fullMode || !fullCache[curBook.id]) return;
  tutorialEvent("translate");
  const sents = getSents(curBook.id);
  const ch = fullCache[curBook.id].chapters[fullMode.chap];
  const todo = [];
  for(let i=ch.start; i<ch.end; i++){
    if(!sents[i].zh) todo.push(i);
  }
  if(!todo.length){ alert("本章已全部翻译 ✓"); return; }
  const freeLeft = freeQuotaLeft();
  if(!isPro() && freeLeft <= 0){
    showPaywall("今日免费翻译额度已用完（" + FREE_TRANSLATE_DAILY + " 句/天）");
    return;
  }
  const budget = isPro() ? todo.length : Math.min(todo.length, freeLeft);
  const todoAll = todo.slice();
  const todoRun = todo.slice(0, budget);
  if(!isPro() && budget < todo.length){
    toast("免费版今天还能翻 " + budget + " 句；剩余 " + (todo.length - budget) + " 句可明天继续，或升级会员立即解锁。");
  }
  if(!store.showzh){
    store.showzh = true;
    document.body.classList.remove("no-zh");
    const z = document.getElementById("zhToggle");
    if(z) z.textContent = "中文对照：开";
  }
  const btn = document.getElementById("mtChapBtn");
  const stat = document.getElementById("mtChapStat");
  if(btn){ btn.disabled = true; btn.textContent = "🌐 翻译中 0/"+todoRun.length; }
  let done = 0, failed = 0, success = 0;
  const groups = [];
  for(let p=0; p<todoRun.length; p+=8) groups.push(todoRun.slice(p, p+8));
  for(const grp of groups){
    const texts = grp.map(i => sents[i].en);
    let map = {};
    try{ map = await mtFetchSentences(texts); }catch(e){ map = {}; }
    for(const i of grp){
      let t = map[_normText(sents[i].en)] || mtCache[_normText(sents[i].en)];
      if(t && !_isUsableZh(sents[i].en, t)) t = "";
      if(t){ sents[i].zh = t; success++; }
      else failed++;
    }
    done += grp.length;
    if(btn) btn.textContent = `🌐 翻译中 ${done}/${todoRun.length}`;
    if(stat) stat.textContent = `${done}/${ch.end-ch.start} 句已处理`;
    if(done % 24 === 0) saveBookTranslations(curBook.id, fullCache[curBook.id]);
  }
  saveBookTranslations(curBook.id, fullCache[curBook.id]);
  if(!isPro()) consumeTranslate(Math.max(success, 0));
  if(btn){ btn.disabled = false; btn.textContent = failed ? `🌐 重试未完成 ${failed} 句` : "✓ 本章已翻译"; }
  const quotaEl = document.getElementById("mtQuota");
  if(quotaEl) quotaEl.textContent = isPro() ? "会员 · 不限量" : "免费版今日剩 " + freeQuotaLeft() + " 句";
  const y = window.scrollY;
  openReader(curBook.id);
  window.scrollTo(0, y);
  if(failed) setTimeout(()=>alert("有 "+failed+" 句暂时没翻成（可能是网络限制）。已有译文已保存，可稍后点「重试」或断网时仍可显示已缓存部分。"), 50);
}

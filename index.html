/* ---------- 词义覆盖：统计本章生词/未收录词，并支持批量补全 ---------- */
function currentChapterRange(){
  if(!curBook) return null;
  if(fullMode && fullCache[curBook.id] && fullCache[curBook.id].chapters && !fullCache[curBook.id].guide){
    const ch = fullCache[curBook.id].chapters[fullMode.chap];
    if(ch) return [ch.start, ch.end];
  }
  return [0, getSents(curBook.id).length];
}
function chapterWordStats(){
  const range = currentChapterRange();
  if(!range) return {total:0, covered:0, pct:0, missing:[]};
  const sents = getSents(curBook.id);
  const uniq = new Set();
  for(let i = range[0]; i < range[1]; i++){
    const s = sents[i];
    if(!s) continue;
    const words = (s.en || "").match(TOKEN_RE()) || [];
    for(const w of words){
      const low = w.toLowerCase().replace(/^[-']+|[-']+$/g, "");
      if(low.length < 3) continue;
      if(/^(chapter|contents|preface|dedication|volume|book|part|page)$/.test(low)) continue;
      if(/^(i{1,3}|iv|v|vi{1,3}|ix|x{1,3}|xi{1,3}|xii)$/.test(low)) continue;
      uniq.add(low);
    }
  }
  let covered = 0;
  const missing = [];
  for(const low of uniq){
    if(dictEntry(low) || _zhCache[low] || dictEnDef(low)) covered++;
    else missing.push(low);
  }
  const total = uniq.size;
  const pct = total ? (covered / total * 100) : 100;
  return {total, covered, pct, missing};
}
function updateCoverageUI(){
  const el = document.getElementById("covStat");
  if(!el) return;
  const st = chapterWordStats();
  const color = st.pct >= 99 ? "var(--brand-deep)" : st.pct >= 95 ? "var(--gold)" : "var(--danger)";
  el.innerHTML = `本章 <b style="color:${color}">${st.pct.toFixed(1)}%</b>（${st.covered}/${st.total} 词有释义）${st.pct < 99.5 ? ' · 后台补全中' : ' ✓'}`;
}
/* 批量机翻单词（Google gtx 支持多行 q，一次 30-40 词，覆盖长尾词） */
async function mtFetchWords(words){
  const out = {};
  const list = words.map(w => String(w || "").trim().toLowerCase()).filter(Boolean);
  const batches = [];
  for(let i = 0; i < list.length; i += 60) batches.push(list.slice(i, i + 60));
  const runBatch = async (batch) => {
    /* 先走本机服务（Bing 代理），失败再直连 Google */
    try{
      if(hasLocalAPI === false && !window.__LZ_NATIVE) throw new Error("no-api");
      const map = await apiTranslateTexts(batch);
      let hit = 0;
      for(const w of batch){
        const t = _stripBadTrans(map[w] || map[w.charAt(0).toUpperCase()+w.slice(1)] || "");
        if(t && _isUsableZh(w, t)){ out[w] = t.trim(); hit++; }
      }
      if(hit) return;
    }catch(e){}
    try{
      const q = batch.join("\n");
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + mtSrc() + "&tl=" + mtTgt() + "&dt=t&dj=1&q=" + encodeURIComponent(q);
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) throw new Error("http " + r.status);
      const j = await r.json();
      if(j && j.sentences){
        for(const seg of j.sentences){
          const orig = String(seg.orig || "").trim().toLowerCase();
          const trans = String(seg.trans || "").trim();
          if(orig && trans) out[orig] = trans;
        }
      }
    }catch(e){
      /* 单批失败：逐词兜底，避免整章卡住 */
      await Promise.all(batch.slice(0, 8).map(async w => {
        try{
          const t = await mtFetch(w);
          if(t && _isUsableZh(w, t)) out[w] = t.trim();
        }catch(e2){}
      }));
    }
  };
  for(let i = 0; i < batches.length; i += 3){
    await Promise.all(batches.slice(i, i + 3).map(runBatch));
  }
  /* 本机代理兜底（不依赖浏览器直连 Google） */
  const missing0 = list.filter(w => !out[w]);
  if(missing0.length){
    try{
      const map = await apiTranslateTexts(missing0);
      for(const [w, t] of Object.entries(map)){
        if(t && _isUsableZh(w, t)) out[w.trim().toLowerCase()] = t.trim();
      }
    }catch(e){}
  }
  /* 未返回的词再试单次 */
  const missing = list.filter(w => !out[w]);
  for(let i = 0; i < missing.length; i += 4){
    await Promise.all(missing.slice(i, i + 4).map(async w => {
      try{
        const t = await mtFetch(w);
        if(t && t.trim()) out[w] = t.trim();
      }catch(e){}
    }));
  }
  return out;
}
/* 批量机翻整句（Google 多行 q，一次 8 句；失败的句子回退单句 mtFetch） */
async function mtFetchSentences(texts){
  const out = {};
  const list = texts.map(t => _normText(t)).filter(Boolean);
  const batches = [];
  for(let i = 0; i < list.length; i += 8) batches.push(list.slice(i, i + 8));
  const runBatch = async (batch) => {
    try{
      if(hasLocalAPI === false && !window.__LZ_NATIVE) throw new Error("no-api");
      const map = await apiTranslateTexts(batch);
      let hit = 0;
      for(const t of batch){
        const v = _stripBadTrans(map[_normText(t)] || map[t] || "");
        if(v && _isUsableZh(t, v)){ out[_normText(t)] = v.trim(); hit++; }
      }
      if(hit) return;
    }catch(e){}
    try{
      const q = batch.join("\n");
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + mtSrc() + "&tl=" + mtTgt() + "&dt=t&dj=1&q=" + encodeURIComponent(q);
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) throw new Error("http " + r.status);
      const j = await r.json();
      if(!j || !j.sentences) throw new Error("empty");
      /* 按 orig 精确对应；对不上时按顺序均分 */
      if(j.sentences.length === batch.length){
        j.sentences.forEach((seg, i) => {
          const t = String(seg.trans || "").trim();
          if(t) out[batch[i]] = t;
        });
      } else {
        const joined = j.sentences.map(s => s.trans || "").join("");
        const chunks = joined.split(/(?<=[。！？…])\s*/).filter(Boolean);
        if(chunks.length === batch.length) batch.forEach((b, i) => out[b] = chunks[i]);
        else out[batch[0]] = joined;
      }
    }catch(e){ /* fallback below */ }
  };
  for(let i = 0; i < batches.length; i += 3){
    await Promise.all(batches.slice(i, i + 3).map(runBatch));
  }
  let missing = list.filter(t => !out[t]);
  if(missing.length){
    try{
      const map = await apiTranslateTexts(missing);
      for(const [k, v] of Object.entries(map)) if(v) out[k] = v;
      missing = list.filter(t => !out[t]);
    }catch(e){}
  }
  for(let i = 0; i < missing.length; i += 4){
    await Promise.all(missing.slice(i, i + 4).map(async t => {
      try{ const r = await mtFetch(t); if(r) out[t] = r; }catch(e){}
    }));
  }
  return out;
}
const _prefetchedChapters = new Set();
async function prefetchChapterMisses(limit, quiet){
  if(!curBook) return;
  const st = chapterWordStats();
  if(!st.missing.length){ if(!quiet) toast("本章词义已 100% 覆盖，点词即可秒显。"); updateCoverageUI(); return; }
  if(isOfflineMode()){
    if(!quiet) toast("离线模式：未收录词只显示本地词典释义；联网后可补全。");
    return;
  }
  const targets = st.missing.slice(0, limit || st.missing.length);
  if(!quiet) toast("正在批量补全 " + targets.length + " 个词的释义…");
  let got = 0;
  /* 按 120 词一组滚动补全，覆盖进度实时可见 */
  for(let i = 0; i < targets.length; i += 120){
    const chunk = targets.slice(i, i + 120);
    const map = await mtFetchWords(chunk);
    for(const [w, t] of Object.entries(map)){
      if(t){ _zhCache[w] = t; kvSet("w_" + w, t).catch(()=>{}); got++; }
    }
    if(got) _saveZhCache();
    updateCoverageUI();
    if(!quiet) toast("补全中 " + Math.min(targets.length, i + 120) + "/" + targets.length);
  }
  updateCoverageUI();
  if(!quiet) toast("补全完成：本章覆盖 " + (got ? "已更新 " + got + " 个词" : "没有新增"));
  setTimeout(updateCoverageUI, 600);
}
function autoPrefetchChapter(){
  if(!curBook || isOfflineMode()) return;
  const key = curBook.id + ":" + (fullMode ? fullMode.chap : 0);
  if(_prefetchedChapters.has(key)) return;
  _prefetchedChapters.add(key);
  const st = chapterWordStats();
  if(st.pct >= 99.5) return;
  /* 后台批量补全整章，不打扰阅读；结果进本地缓存，下次秒开 */
  setTimeout(() => { prefetchChapterMisses(null, true); }, 900);
}

/* 所有语言通用：点词时补一行「各国语言怎么说」 */
const _multiGlossCache = {};
async function fillMultiGloss(word){
  const box = document.getElementById("shGlossBox");
  if(!box || !word) return;
  const lc = activeLang();
  const key = lc + "|" + word;
  const render = (g) => {
    const cur = document.getElementById("shGlossBox");
    if(!cur || sheetWord !== word) return;
    const rows = Object.entries(g || {}).filter(([c, v]) => v && v.toLowerCase() !== String(word).toLowerCase())
      .map(([c, v]) => `<div style="display:flex;gap:8px;align-items:baseline;padding:2px 0">
        <span class="tag" style="flex:0 0 auto">${escHtml((SHOW_LANGS.find(x => x.code === c) || {}).name || c)}</span>
        <span style="font:14px/1.6 var(--font)">${escHtml(v)}</span></div>`).join("");
    cur.innerHTML = rows ? `<details style="margin-top:8px;border-top:1px dashed var(--border);padding-top:6px">
      <summary style="cursor:pointer;color:var(--brand-deep);font-size:13px">各家语言怎么说（点开）</summary>
      <div>${rows}</div></details>` : "";
  };
  if(_multiGlossCache[key]) return render(_multiGlossCache[key]);
  const tosAll = SHOW_LANGS.map(x => x.code).filter(c => c !== lc);
  /* 没有后端（GitHub Pages 等）：用浏览器直连机翻，至少给出 4 门最常用语言 */
  if(!hasLocalAPI && !window.__LZ_NATIVE){
    const picked = ["en","zh","ja","de"].filter(c => c !== lc).slice(0, 4);
    try{
      const pairs = await Promise.all(picked.map(async c => {
        try{ const t = await mtTo(word, c); return [c, t && _isUsableIn(t, c) ? t : ""]; }
        catch(e){ return [c, ""]; }
      }));
      const g = {};
      pairs.forEach(([c, v]) => { if(v) g[c] = v; });
      if(Object.keys(g).length){ _multiGlossCache[key] = g; render(g); return; }
    }catch(e){}
    return;
  }
  try{
    const tos = tosAll.slice(0, 8);
    const r = await fetch(apiUrl("api/word?lang=") + encodeURIComponent(lc) + "&word=" + encodeURIComponent(word) + "&tos=" + tos.join(","), {signal: AbortSignal.timeout(9000)});
    if(r.ok){
      const j = await r.json();
      if(j && j.gloss){ _multiGlossCache[key] = j.gloss; render(j.gloss); }
    }
  }catch(e){}
}

    paint(merged, null);
  }).catch(() => {});
  const addBtn = document.getElementById("shAdd");
  if(addBtn){
    const alreadyIn = store.vocab.some(v => v.w === low);
    addBtn.disabled = alreadyIn;
    addBtn.textContent = alreadyIn ? "✓ 已在生词本" : "＋ 加入生词本";
    addBtn.onclick = () => addVocab(low);

/* 联网抓取详细释义（音标+多义项+例句）写回生词记录，供生词模式展示 */
async function fetchDictDetail(word, entry){
  try{
    const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word));
    if(!r.ok) return;
    const j = await r.json();
    const e0 = j[0];
    const phon = e0.phonetic || (e0.phonetics.find(p=>p.text)||{}).text || "";
    const defs = [];
    outer: for(const e of j) for(const m of e.meanings) for(const df of m.definitions){
      defs.push({pos:m.partOfSpeech, en:df.definition, ex:df.example||""});
      if(defs.length>=4) break outer;
    }
    const v = store.vocab, it = v.find(x=>x.w===word && x.at===entry.at);
    if(it){ it.phon = phon; it.defs = defs; store.vocab = v; }
  }catch(e){ /* 离线时保留基础信息 */ }
}

/* ---- 机翻引擎（2026 重写） ----
   目标：点击「翻译」立刻有反馈；成功优先，不再被 CORS 失败源拖死。
   源：① Google gtx（最快，CORS 可用） ② MyMemory ③ clients5 Google
   策略：Promise.any 取第一个成功源；单源 12s 超时；结果写 IndexedDB + 内存缓存。
   离线：只读缓存 + 本地词典释义，绝不偷偷联网。
*/
/* 翻译语言对：源=学习语言，目标=展示语言 */
const GT_LANG = { zh:"zh-CN", en:"en", de:"de", fr:"fr", it:"it", es:"es", ja:"ja", ko:"ko" };
/* 指定目标语言机翻（不需要后端）：供「各国语言怎么说」使用 */
const _mtToCache = {};
async function mtTo(text, code){
  const tgt = GT_LANG[code] || code;
  const key = tgt + "|" + text;
  if(_mtToCache[key]) return _mtToCache[key];
  const u1 = "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl=" + encodeURIComponent(tgt) + "&q=" + encodeURIComponent(text);
  try{
    const r = await fetch(u1, {cache:"no-store", signal: AbortSignal.timeout(8000)});
    if(r.ok){
      const j = await r.json();
      const t = Array.isArray(j) ? (Array.isArray(j[0]) ? j[0][0] : j.join("")) : (j && j.sentences ? j.sentences.map(x=>x.trans||"").join("") : "");
      if(t && t.trim()){ _mtToCache[key] = t.trim(); return t.trim(); }
    }
  }catch(e){}
  try{
    const pair = encodeURIComponent((GT_LANG[activeLang()]||"en") + "|" + tgt);
    const r2 = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + pair, {cache:"no-store", signal: AbortSignal.timeout(9000)});
    if(r2.ok){
      const j2 = await r2.json();
      let t = (j2 && j2.responseData && j2.responseData.translatedText) || "";
      if(/MYMEMORY WARNING|QUOTA|INVALID/i.test(t)) t = "";
      if(t && t.trim()){ _mtToCache[key] = t.trim(); return t.trim(); }
    }
  }catch(e){}
  return "";
}
/* 粗略校验：译文要包含该语言的典型字符（中文/日文），其他拉丁语言只要求非空且不等于原文 */
function _isUsableIn(out, code){
  out = String(out || "").trim();
  if(!out) return false;
  if(code === "zh") return /[\u4e00-\u9fff]/.test(out);
  if(code === "ja") return /[\u3040-\u30ff\u4e00-\u9fff]/.test(out);
  if(code === "ko") return /[\uac00-\ud7a3]/.test(out);
  if(code === "el") return /[\u0370-\u03ff]/.test(out);
  return /[\p{L}]/u.test(out);
}

function _stripBadTrans(t){

/* 本机翻译代理：浏览器直连失败时的同源兜底（服务端用 MyMemory） */
async function apiTranslateTexts(texts){

  try{ if(window.__lzApiReady) await window.__lzApiReady; }catch(e){}
  /* 静态托管（GitHub Pages 等）没有后端：直接跳过，避免每个词都发一个 404 */
  if(hasLocalAPI === false && !window.__LZ_NATIVE) return {};
  if(!window.__LZ_NATIVE && !hasLocalAPI) return {};   /* 探测中/未知也先不请求 */
  const payload = JSON.stringify({texts: texts.map(t=>_normText(t)).filter(Boolean).slice(0,40), from: activeLang(), to: showLang()});
  const urls = [apiUrl("api/translate")];
  /* 打包壳：Capacitor 把 public/api/* 的请求交给原生层发起（不经 WebView CORS） */
  if(window.__LZ_NATIVE) urls.push("public/api/translate");
  for(const u of urls){
    try{
      const r = await fetch(u, {method:"POST", headers:{"Content-Type":"application/json"}, body:payload});
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.translations && Object.keys(j.translations).length) return j.translations;
    }catch(e){}

}
window.lzUsableZh = function(src, out){ return _isUsableZh(src, out); };

  const tgt = (typeof mtTgt === "function") ? mtTgt() : "zh-CN";

const MT_SOURCES = [

const _mtPending = new Map();
async function mtFetch(text){
  const raw = _normText(text);
  if(!raw) throw new Error("empty input");
  /* 1) 内存 / localStorage 缓存 */
  if(mtCache[raw] && _isUsableZh(raw, mtCache[raw])) return mtCache[raw];
  if(mtCache[raw]){ delete mtCache[raw]; }
  const pkey = "tx_"+_hashText(raw);
  /* 2) IndexedDB 缓存（离线也能用） */
  const cached = await kvGet(pkey).catch(()=>null);
  if(cached && _isUsableZh(raw, cached)){
    mtCache[raw] = cached;
    return cached;
  }
  if(cached) kvDel(pkey).catch(()=>{});
  /* 3) 离线模式：只做本地释义，不联网 */
  if(isOfflineMode()){
    const gloss = offlineGloss(raw);
    if(gloss) return gloss;
    throw new Error("离线模式：这段还没有本地译文");
  }
  /* 4) 合并同一文本的并发请求 */
  if(_mtPending.has(raw)) return _mtPending.get(raw);
  const job = (async()=>{
    let text2 = raw;
    let out = "";
    /* Google 单次约 3000 字符较稳；长段拆成 1400 字符左右 */
    if(text2.length > 1600){
      const parts = [];
      let rest = text2;
      while(rest.length){
        let cut = 1400;
        const sp = rest.lastIndexOf(". ", cut);
        if(sp > 500) cut = sp + 1;
        parts.push(rest.slice(0, cut).trim());
        rest = rest.slice(cut).trim();
      }
      for(const p of parts){
        out += (out ? " " : "") + await _mtOne(p);
      }
    } else out = await _mtOne(text2);
    out = _stripBadTrans(out);
    if(!out || !_isUsableZh(raw, out)) throw new Error("所有翻译源都没有返回有效中文");
    mtCache[raw] = out;
    _saveMtCache();
    kvSet(pkey, out).catch(()=>{});
    return out;
  })();
  _mtPending.set(raw, job);
  try{ return await job; } finally { _mtPending.delete(raw); }
}
async function _mtOne(text){
  const tasks = MT_SOURCES.map(src =>
    _withTimeout(src.fn(text), 12000, src.name).then(t=>{ if(!_isUsableZh(text, _stripBadTrans(t))) throw new Error(src.name+" empty"); return t; })
  );
  try{
    return await Promise.any(tasks);
  }catch(e){
    throw new Error(hasLocalAPI === false
      ? "翻译服务未连接（可在设置→后端连接填写地址，或检查网络）"
      : "翻译服务暂时不可用（网络或限流），稍后再点一次即可");
  }
}

/* 离线兜底：逐词给本地词典释义（不是整句机翻，但足以应急） */
function offlineGloss(text){
  const words = (String(text).match(/[A-Za-z][A-Za-z'’-]{1,}/g) || []);
  const seen = new Set(), out = [];
  for(const w of words){
    const low = w.toLowerCase();
    if(seen.has(low)) continue;
    seen.add(low);
    const d = dictEntry(low);
    if(d && d[1]) out.push(w+"："+d[1].split(/[；;]/)[0].slice(0,28));
    if(out.length >= 10) break;
  }
  if(!out.length) return "";
  return "【离线本地释义】" + out.join("；");
}
async function ctxTranslate(sent, fallback){
  const key = _normText(sent);
  if(mtCache[key] && _isUsableZh(key, mtCache[key])) return mtCache[key];
  if(mtCache[key]) delete mtCache[key];
  try{
    const t = await mtFetch(sent);
    mtCache[key] = t; _saveMtCache();
    return t;
  }catch(e){
    return fallback && fallback !== "（暂无译文）" ? fallback : (offlineGloss(key) || "（暂无译文）");
  }
}

/* 整本书的译文持久化：IndexedDB 里按书保存 en→zh 映射，断网后仍可显示 */
const _txSaveTimers = {};
async function loadBookTranslations(id, parsed){
  try{
    const map = await kvGet("txmap_" + id + "_" + activeLang() + "_" + showLang());
    if(map && parsed && parsed.sents){
      parsed.sents.forEach(s=>{
        if(!s.zh && map[s.en] && _isUsableZh(s.en, map[s.en])) s.zh = map[s.en];
        else if(s.zh && !_isUsableZh(s.en, s.zh)) s.zh = "";
      });
    }
  }catch(e){}
  return parsed;
}
function saveBookTranslations(id, parsed){
  if(!parsed || !parsed.sents) return;
  clearTimeout(_txSaveTimers[id]);
  _txSaveTimers[id] = setTimeout(async()=>{
    const map = {};
    parsed.sents.forEach(s=>{ if(s.zh) map[s.en] = s.zh; });
    await kvSet("txmap_" + id + "_" + activeLang() + "_" + showLang(), map);
  }, 400);
}

/* 打开书时自动准备译文：只翻当前章、受每日额度限制、失败静默 */
let _autoTxBusy = false;
async function autoTranslateOnOpen(id, parsed){
  if(_autoTxBusy) return;
  if(isOfflineMode()) return;
  if(showLang() === activeLang()) return;             /* 同一语言不需要翻译 */
  const cur = getSents(id);
  if(!cur || !cur.length) return;
  const rng = (typeof currentChapterRange === "function" && fullCache[id]) ? currentChapterRange() : [0, Math.min(cur.length, 40)];
  if(!rng || rng[1] <= rng[0]) return;
  const miss = [];
  const quota = freeQuotaLeft();
  for(let i = rng[0]; i < Math.min(rng[1], rng[0] + 40); i++){
    const s = cur[i];
    if(s && s.en && !s.zh) miss.push(s);
    if(miss.length >= Math.min(20, Math.max(1, quota))) break;
  }
  if(!miss.length){ if(!store.showzh) store.showzh = true; return; }
  if(quota <= 0){
    setTimeout(() => { try{ toast("译文额度已用完（免费版每天 " + langQuota() + " 句，会员不限量），可先阅读原文或升级会员。"); }catch(e){} }, 1200);
    return;
  }
  _autoTxBusy = true;
  try{
    let map = null;
    try{
      if(hasLocalAPI) map = await apiTranslateTexts(miss.map(s => s.en));
    }catch(e){ map = null; }
    if(!map || !Object.keys(map).length){
      /* 离线壳或服务端不可用：逐句走浏览器直连机翻（Google/MyMemory） */
      map = {};
      for(const s of miss.slice(0, 8)){
        try{
          const t = await mtFetch(s.en).catch(() => null);
          if(t) map[s.en] = t;
        }catch(e){}
      }
    }
    if(map){
      let n = 0;
      miss.forEach(s => {
        const t = map[s.en];
        if(t && (typeof lzUsableZh === "function" ? lzUsableZh(s.en, t) : t) && t !== s.en){ s.zh = t; n++; }
      });
      if(n){
        store.showzh = true;
        saveBookTranslations(id, parsed);
        /* 不整页重绘：把译文填进每句已有的 .zh 区（原本放的是「翻译这句」按钮） */
        cur.forEach((s, si) => {
          if(!s.zh) return;
          document.querySelectorAll(`#view-reader .sent[data-si="${si}"]`).forEach(el => {
            const zh = el.querySelector(".zh");
            if(!zh || zh.dataset.filled === "1") return;
            zh.textContent = s.zh;
            zh.dataset.filled = "1";
          });
        });
      }
    }
  }catch(e){} finally { _autoTxBusy = false; }
}

/* =====================================================
  九·补：导入书籍（TXT 直接读取；EPUB 解包正文提取）
===================================================== */
const impCache = {};   // 导入书 id → 分句缓存（兼容旧流程）
/* 内置书取样章；导入书/整书返回全书句子 */
function getSents(id){
  if(fullMode && fullMode.id===id && fullCache[id] && fullCache[id].sents) return fullCache[id].sents;
  if(SAMPLES[id]) return SAMPLES[id];
  if(fullCache[id] && fullCache[id].sents) return fullCache[id].sents;
  if(!impCache[id]){
    const data = fullCache[id];
    if(data && data.sents) return data.sents;
    const rec = store.imports.find(x=>x.id===id);
    if(!rec) return [];
    if(rec.text) impCache[id] = splitSentences(rec.text);
    else return [];
  }
  return impCache[id];
}
/* 分句：按空行/换行分段，再按句号/问号/感叹号断句（不再截断整本书） */
function splitSentences(text){
  const paras = String(text||"").replace(/\r/g,"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  for(const p of paras){
    const parts = p.split(/(?<=[.!?…。！？])\s+/);
    for(const s of parts){
      const t = s.trim();
      if(t) out.push({en:t, zh:null});
    }
  }
  return out;
}
/* 从全文自动识别章节；识别不到就按 220 句切分 */
function buildChapterRanges(sents, text){
  const isHead = (t)=>{
    const s = String(t||"").trim();
    if(!s || s.length > 90) return false;
    if(/\.{3,}|(\.\s*){3,}/.test(s)) return false;
    if(/^(chapter|part|book|volume|letter|episode|canto|stave|act|scene|section|prologue|epilogue|preface|introduction|foreword|contents|dedication|appendix|notes?|glossary)\b/i.test(s)) return true;
    if(/^第[一二三四五六七八九十百千0-9]+[章节卷部篇回]/.test(s)) return true;
    if(/^[\[（(]?\s*([IVXLCDM]{1,7}|\d{1,3})\s*[\]）)]?\s*[.、]?\s*$/.test(s)) return s.length <= 8;
    if(/^([IVXLCDM]{1,7}|\d{1,3})\.\s+[A-Z][A-Z0-9 ,.'’\-]{3,}$/.test(s)) return true;
    if(/^[A-Z][A-Z0-9 ,.'’\-:]{4,70}$/.test(s) && s.split(/\s+/).length <= 9) return true;
    return false;
  };
  const chapters = [];
  let curTitle = "卷首 · 目录 / 题献 / 前言", curStart = 0;
  for(let i=0;i<sents.length;i++){
    if(isHead(sents[i].en)){
      if(i > curStart){
        chapters.push({t:curTitle, start:curStart, end:i});
      }
      curTitle = sents[i].en.replace(/\s+/g," ").trim().slice(0,80);
      curStart = i;   /* 标题本身也留在正文里 */
    }
  }
  if(sents.length > curStart) chapters.push({t:curTitle, start:curStart, end:sents.length});
  /* 标题识别太少 → 按固定句数切分，避免一万句一个 DOM */
  if(chapters.length < 3 || (sents.length > 600 && chapters.length < 5)){
    return chunkRanges(sents.length, Math.max(160, Math.ceil(sents.length/32)));
  }
  /* 合并 1-2 句的超短章 */
  const merged = [];
  for(const c of chapters){
    const last = merged[merged.length-1];
    if(last && (c.end-c.start <= 2 || last.end-last.start <= 2) && (c.end-c.start)+(last.end-last.start) < 80){
      last.end = c.end;
    } else merged.push({...c});
  }
  return merged;
}
function chunkRanges(n, step){
  const out = [];
  for(let i=0;i<n;i+=step) out.push({t:`第 ${out.length+1} 部分`, start:i, end:Math.min(i+step,n)});
  return out;
}
/* 载入导入书（IndexedDB）；首次打开或刷新后调用 */
async function ensureImportLoaded(id){
  if(fullCache[id] && fullCache[id].sents) return true;
  let rec = null;
  try{ rec = await idbImportGet(id); }catch(e){}
  if(!rec){
    const meta = store.imports.find(x=>x.id===id);
    if(meta && meta.text){ /* 旧版尚未迁移 */
      const sents = splitSentences(meta.text);
      rec = {id, t:meta.t, format:meta.format||"TXT", sents, chapters:buildChapterRanges(sents, meta.text), text:meta.text, chars:meta.text.length};
      try{ await idbImportPut(rec); }catch(e){}
    }
  } else if(!rec.sents || !rec.sents.length){
    const text = rec.text || "";
    if(text){
      rec.sents = splitSentences(text);
      rec.chapters = buildChapterRanges(rec.sents, text);
    }
  }
  if(!rec || !rec.sents) return false;
  fullCache[id] = {sents:rec.sents, chapters:rec.chapters, imported:true};
  await loadBookTranslations(id, fullCache[id]);
  const saved = store.progress[id] || {};
  let chap = saved.chap;
  if(chap === undefined){
    chap = rec.chapters.findIndex(c => /^(chapter|part|book|volume|letter|act|scene|canto|stave|section|第[一二三四五六七八九十百千0-9]+[章节卷部篇回])/i.test((c.t||'').trim()));
    if(chap < 0) chap = rec.chapters.findIndex(c => (c.end - c.start) >= 25);
    if(chap < 0) chap = 0;
  }
  if(!fullMode || fullMode.id!==id) fullMode = {id, chap: Math.min(chap, Math.max(0,rec.chapters.length-1))};
  return true;
}
/* 动态加载 JSZip（EPUB/DOCX/ODT 解析；优先本地 vendor，离线也能导入） */
function loadJsZip(){
  if(window.LZImport) return window.LZImport.ensureJSZip();
  return new Promise((res,rej)=>{
    if(window.JSZip) return res(window.JSZip);
    const s = document.createElement("script");
    s.src = "./vendor/jszip.min.js";
    s.onload = ()=>res(window.JSZip);
    s.onerror = ()=>rej(new Error("JSZip 加载失败"));
    document.head.appendChild(s);

/* 把导入结果规范成站内分章结构 */
function normalizeImportResult(res, fileName){
  let sents, chapters;
  if(res.chapters && res.chapters.length > 1){
    sents = []; chapters = [];
    for(const ch of res.chapters){
      const arr = splitSentences(ch.text || "");
      if(!arr.length) continue;
      const start = sents.length;
      sents.push(...arr);
      chapters.push({t: (ch.t || ("第 "+(chapters.length+1)+" 章")).slice(0,90), start, end:sents.length});
    }
    if(!sents.length){ sents = splitSentences(res.text); chapters = buildChapterRanges(sents, res.text); }
  } else {
    sents = splitSentences(res.text);
    chapters = buildChapterRanges(sents, res.text);
  }
  return {sents, chapters};
}
async function doImport(input){
  const files = [...(input.files||[])];
  input.value = "";
  if(!files.length) return;
  if(!window.LZImport){ alert("导入模块还在加载，请稍等 1 秒再试，或刷新页面。"); return; }
  for(const file of files){
    if(file.size > 80*1024*1024){ alert("《"+file.name+"》超过 80MB，请先拆分或转换为 EPUB/TXT。"); continue; }
    showImportOverlay(file.name);
    try{
      const res = await window.LZImport.parseFile(file, (pct,a,b)=>{
        updateImportOverlay(pct, b>1 ? `解析中 ${a}/${b}…` : "解析并转换格式…");
      });
      updateImportOverlay(92, "分章 / 分句 / 写入 IndexedDB…");
      await new Promise(r=>setTimeout(r, 30));
      const {sents, chapters} = normalizeImportResult(res, file.name);
      if(!sents.length) throw new Error("没有识别到正文句子");
      const id = await saveImportedBook(res, file.name, sents, chapters);
      updateImportOverlay(100, "完成 ✓ 已转换 "+chapters.length+" 章 / "+sents.length+" 句");
      await new Promise(r=>setTimeout(r, 350));
      hideImportOverlay();
      renderLibrary();
      openBook(id);
    }catch(e){
      hideImportOverlay();
      alert("《"+file.name+"》导入失败：\n"+(e.message||e));
    }
  }
}

function detectUrlType(url){
  const u = String(url||"");
  if(/gutenberg\.org|gutenberg\.net|pglaf\.org/.test(u)) return "gutenberg";
  if(/aozora\.gr\.jp/.test(u)) return "aozora";
  if(/wikisource\.org/.test(u)) return "wikisource";
  if(/(\.rss$|\/feed\/?$|\/rss\/?$|atom\.xml$)/i.test(u)) return "rss";
  return "page";
}
function htmlToText(html){
  const doc = new DOMParser().parseFromString(String(html||""), "text/html");
  doc.querySelectorAll("script,style,nav,header,footer,aside,form,iframe,noscript,svg,.ad,.ads,.advert,.sidebar,.comment,.comments,.menu,.nav,.share,.related").forEach(n=>n.remove());
  const main = doc.querySelector("article, main, .content, .post, .entry-content, #content, #mw-content-text, .mw-parser-output") || doc.body;
  const txt = (main ? main.innerText || main.textContent : "") || "";
  let out = txt.replace(/\n{3,}/g,"\n\n").replace(/[ \t]{2,}/g," ").trim();
  /* DOMParser 文档的 innerText 不一定继承换行：段标签之间补空行 */
  if(main && !/\n/.test(out) && main.querySelectorAll("p,div,br,li,h1,h2,h3").length){
    out = [...main.querySelectorAll("p,div,li,h1,h2,h3,blockquote")].map(n=>n.textContent.trim()).filter(Boolean).join("\n\n");
  }
  return out;
}
function gutenbergId(url){
  const m = String(url).match(/gutenberg\.org\/(?:ebooks|files|cache\/epub)\/(\d+)/i) || String(url).match(/pglaf\.org\/cache\/epub\/(\d+)/i);
  return m ? Number(m[1]) : 0;
}
async function fetchTextSmart(url){
  /* 直连失败时走公共 CORS 代理（仅 GET，公开文本） */
  const tries = [
    url,
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://r.jina.ai/" + url
  ];
  let lastErr = null;
  for(const u of tries){
    try{
      const r = await fetch(u, {signal: AbortSignal.timeout(25000)});
      if(!r.ok) { lastErr = new Error("HTTP " + r.status); continue; }
      const t = await r.text();
      if(t && t.length > 200) return t;
      lastErr = new Error("内容过短");
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("抓取失败（可能是跨域限制）");
}

/* =====================================================
  M2：词族状态机（近似词根归并 + 三态 + 查词自动升级）
  st: 0=陌生 1=学习中 2=已掌握 -1=忽略；n=查词次数
  正文高亮：陌生=红点线 / 学习中=琥珀实线 / 已掌握与忽略=不高亮
  标记一个 = 标记整族（同一词根的变形共用一条状态记录）
===================================================== */
let _ws = null;
function wordStates(){ if(_ws===null) _ws = store.wstates; return _ws; }
function saveWS(){ store.wstates = _ws; }
/* 常见不规则动词/名词词形 → 词根 */
const IRREG = {went:"go",gone:"go",was:"be",were:"be",been:"be",am:"be",is:"be",are:"be",
 had:"have",has:"have",did:"do",does:"do",made:"make",said:"say",saw:"see",seen:"see",
 took:"take",taken:"take",came:"come",got:"get",gotten:"get",gave:"give",given:"give",
 found:"find",knew:"know",known:"know",thought:"think",felt:"feel",left:"leave",
 kept:"keep",held:"hold",brought:"bring",began:"begin",begun:"begin",grew:"grow",
 spoke:"speak",spoken:"speak",broke:"break",broken:"break",chose:"choose",chosen:"choose",
 drove:"drive",driven:"drive",ate:"eat",eaten:"eat",fell:"fall",fallen:"fall",
 heard:"hear",lost:"lose",met:"meet",paid:"pay",ran:"run",rose:"rise",risen:"rise",
 sat:"sit",slept:"sleep",stood:"stand",understood:"understand",told:"tell",
 wore:"wear",worn:"wear",won:"win",wrote:"write",written:"write",better:"good",
 best:"good",worse:"bad",worst:"bad",children:"child",men:"man",women:"woman",
 feet:"foot",teeth:"tooth",mice:"mouse",people:"person"};
/* 近似词根：规则后缀剥离（同族词归并到同一 key，允许个别误差） */
function stemOf(w){
  w = w.toLowerCase();
  if(IRREG[w]) return IRREG[w];
  const suf = [["ies","y",5],["ied","y",5],["sses","ss",6],["ves","f",5],
    ["es","",4],["ed","",4],["ing","",5],["ly","",4],["er","",4],["est","",5],["s","",3]];
  for(const [a,b,min] of suf){
    if(w.length > min && w.endsWith(a)) return w.slice(0, -a.length) + b;
  }
  return w;
}
/* 点词时调用：累计查词次数，达阈值自动升级（忽略词除外） */
function recordLookup(low){
  statsBump({lookups:1});
  const ws = wordStates(); const stem = stemOf(low);
  const fs = ws[stem] || (ws[stem] = {st:null, n:0, w:low});
  fs.n++; fs.w = low;
  if(fs.st !== -1){
    if(fs.n >= 6 && fs.st !== 2) fs.st = 2;             // 查满 6 次 → 已掌握
    else if(fs.n >= 3 && (fs.st===null || fs.st===0)) fs.st = 1;  // 满 3 次 → 学习中
  }
  saveWS();
  return fs;
}
/* 词卡状态行：四态按钮 + 查词次数说明 */
function renderStateRow(low){
  const row = document.getElementById("shState");
  if(!row) return;
  const stem = stemOf(low);
  const fs = wordStates()[stem];
  const st = fs ? fs.st : null, n = fs ? fs.n : 0;
  row.innerHTML = [[0,"陌生"],[1,"学习中"],[2,"已掌握"],[-1,"忽略"]].map(([v,l])=>
    `<button class="mdot" style="width:auto;padding:4px 10px;background:none;
      border:1px solid ${st===v?"var(--brand)":"var(--border)"};
      color:${st===v?"var(--brand)":"var(--muted)"};font-size:12px"
      onclick="setWordState('${low}',${v})">${st===v?"● ":""}${l}</button>`).join("");
  document.getElementById("shLookup").textContent =
    `已查 ${n} 次 · 词族【${stem}*】 · 满 3 次自动升「学习中」，满 6 次自动「已掌握」`;
}
/* 手动切换状态：刷新正文高亮与状态行 */
function setWordState(low, st){
  const ws = wordStates(); const stem = stemOf(low);
  const fs = ws[stem] || (ws[stem] = {st:null, n:0, w:low});
  fs.st = st; fs.w = low;
  saveWS();
  if(curBook) openReader(curBook.id);
  renderStateRow(low);
}

/* ---------- 汉语模式：中→英本地词典分包 + 多语言释义 ---------- */
const _zhEnLoaded = {};
function loadZhEn(ch){
  const cp = (ch && ch.charCodeAt(0)) || 0;
  const key = "x" + (cp % 16);
  if(window.LZ_ZHD && window.LZ_ZHD[key]) return Promise.resolve(window.LZ_ZHD[key]);
  if(_zhEnLoaded[key]) return _zhEnLoaded[key];
  _zhEnLoaded[key] = new Promise((resolve) => {
    const sc = document.createElement("script");
    sc.src = "dicts/zh/" + key + ".js?v=1";
    sc.onload = () => resolve((window.LZ_ZHD || {})[key] || {});
    sc.onerror = () => resolve({});
    document.head.appendChild(sc);
  });
  return _zhEnLoaded[key];
}
/* 最长匹配查词典（分片按首字哈希，只加载需要的几片） */
async function zhEntry(word){
  const w = String(word || "");
  if(!w) return null;
  const tries = [];
  for(let n = Math.min(4, w.length); n >= 1; n--) for(let i = 0; i + n <= w.length; i++) tries.push(w.slice(i, i+n));
  const keys = [...new Set(tries.map(t => "x" + (t.charCodeAt(0) % 16)))];
  const loaded = await Promise.all(keys.map(k => new Promise(res => {
    if(window.LZ_ZHD && window.LZ_ZHD[k]) return res(window.LZ_ZHD[k]);
    if(_zhEnLoaded[k]) return _zhEnLoaded[k].then(res);
    _zhEnLoaded[k] = new Promise((resolve) => {
      const sc = document.createElement("script");
      sc.src = "dicts/zh/" + k + ".js?v=1";

/* ---------- 点词速度：hover 预取 + 本地优先 ---------- */
const _wordPending = new Map();
const _wordPrefetched = new Set();
function wordCached(low){ return _zhCache[low] || null; }
function prefetchWord(low, delay){
  const isLatin = isLatinLang();
  low = String(low||"").trim().toLowerCase();
  if(isLatin) low = low.replace(/[^a-zà-ÿßäöüñç'-]/g,"");
  if(!low || _wordPrefetched.has(low) || _wordPending.has(low)) return;
  if(dictEntry(low) || _zhCache[low]) { _wordPrefetched.add(low); return; }
  const lg = activeLang();
  const run = () => {
    if(_wordPrefetched.has(low)) return;
    _wordPending.set(low, true);
    const kvKey = "w_" + lg + "_" + low;
    kvGet(kvKey).then(v => {
      if(v){ _zhCache[low] = v; return v; }
      if(isOfflineMode()) return offlineGloss(low);
      /* 汉语：先用本地中英索引，再补多语言释义 */
      if(lg === "zh"){
        return zhEntry(low).then(e => {
          if(e && e.en){ _zhCache[low] = e.en; kvSet(kvKey, e.en).catch(()=>{}); _saveZhCache(); return e.en; }
          return zhMultiGloss(low).then(g => {
            const t = g && (g.zh || g.en);
            if(t){ _zhCache[low] = g.en || t; kvSet(kvKey, g.en || t).catch(()=>{}); _saveZhCache(); }
            return t || null;
          });
        });
      }
      /* 非英语走本机多语言词典代理，更快更稳 */
      if(lg !== "en"){
        return fetchWordServer(low, lg).then(j => {
          if(j && j.gloss && j.gloss[0]){
            const t = showLang() === "zh" ? j.gloss[0] : (j.gloss.find(g => /[\u4e00-\u9fff]/.test(g)) || j.gloss[0]);
            _zhCache[low] = t; kvSet(kvKey, t).catch(()=>{}); _saveZhCache();
            return t;
          }
          return mtFetch(low).then(t => {
            if(t && _isUsableZh(low, t)){ _zhCache[low] = t; kvSet(kvKey, t).catch(()=>{}); _saveZhCache(); }
            return t;
          });
        });
      }
      return mtFetch(low).then(t => {
        if(t && _isUsableZh(low, t)){ _zhCache[low] = t; kvSet(kvKey, t).catch(()=>{}); _saveZhCache(); }
        return t;
      });
    }).catch(()=>{}).finally(()=>{ _wordPending.delete(low); _wordPrefetched.add(low); });
  };
  if(delay) setTimeout(run, delay); else run();
}

async function fetchDict(word){
  if(_dictCache[word]) return renderDefs(word, 1);
  const ctrl = new AbortController();
  const tm = setTimeout(()=>ctrl.abort(), 4000);
  try{
    const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word), {signal:ctrl.signal});
    if(!r.ok) throw new Error("http");
    const j = await r.json();
    const e0 = j[0];
    const phon = e0.phonetic || (e0.phonetics.find(p=>p.text)||{}).text || "";
    const defs = [];
    outer: for(const e of j) for(const m of e.meanings) for(const df of m.definitions){
      defs.push({pos:m.partOfSpeech, en:df.definition, ex:df.example||""});
      if(defs.length>=5) break outer;

  } finally { clearTimeout(tm); }
}

function queueDictZh(){
  clearTimeout(_dictZhTimer);

function fillDictZh(){
  const scope = wordPopScope();
  const pending = [...scope.querySelectorAll(".dictzh")].filter(el=>!el.dataset.done && !el.dataset.busy);
  if(!pending.length) return;
  pending.forEach(el=>{ el.dataset.busy="1"; });
  const texts = pending.map(el=>el.dataset.en || "");
  const finish = t => {
    pending.forEach(el=>{ el.dataset.busy=""; el.dataset.done="1";
      el.textContent = t ? (" → " + t) : "（暂无法翻译，可点「更多释义」看站内词典）"; });
  };
  Promise.race([
    apiTranslateTexts(texts).then(map=>{
      const one = _stripBadTrans(map[_normText(texts[0])] || "");
      if(!one) return "";
      /* 多条时逐条填；单条直接填 */
      if(pending.length === 1) return one;
      pending.forEach(el=>{
        const t = _stripBadTrans(map[_normText(el.dataset.en)] || "");
        if(t){ el.textContent = " → " + t; el.dataset.done="1"; el.dataset.busy=""; }
      });
      return "␀";
    }),
    new Promise(r=>setTimeout(()=>r(""), 7000))
  ]).then(t=>{
    if(t === "␀") return;
    const left = pending.filter(el=>!el.dataset.done);
    if(!left.length) return;
    if(t){ left.forEach(el=>{ el.textContent=" → "+t; el.dataset.done="1"; }); return; }
    /* 批量失败：逐条兜底，各最多 6 秒 */
    left.forEach(el=>{
      Promise.race([mtFetch(el.dataset.en), new Promise(r=>setTimeout(()=>r(""), 6000))])
        .then(v=>{ el.textContent = v ? (" → " + v) : "（暂无法翻译，可点「更多释义」看站内词典）"; el.dataset.done="1"; })
        .catch(()=>{ el.textContent = "（暂无法翻译）"; el.dataset.done="1"; });
    });
  }).catch(()=>finish(""));
}
/* 简洁英英释义 + 自动中译（最多 2 个义项，后台再补到 5 个） */
function renderDefs(word, n){

  /* 章节范围：只读当前章 */

  const s = all[_listen.idx];
  const text = (s && s.en) ? s.en : "";

  try{ scrollToSent(_listen.idx); }catch(e){}

function accList(){ try{ return JSON.parse(localStorage.getItem("lz_accounts")||"[]"); }catch(e){ return []; } }

function accCheck(){
  const name = (document.getElementById("accName").value||"").trim();
  const pwd = document.getElementById("accPwd").value||"";
  if(!/^[A-Za-z0-9_\u4e00-\u9fa5]{2,16}$/.test(name)){ alert("账号名需为 2-16 位字母/数字/汉字/下划线"); return null; }
  if(pwd.length < 4){ alert("密码至少 4 位"); return null; }
  return {name, pwd};
}
function accRegister(){
  const r = accCheck(); if(!r) return;
  const list = accList();
  if(list.some(a=>a.name===r.name)){ alert("该账号名已存在，请直接登录"); return; }
  list.push({name:r.name, ph:hashPwd(r.pwd)});
  localStorage.setItem("lz_accounts", JSON.stringify(list));
  accSwitch(r.name);
}
function accLogin(){
  const r = accCheck(); if(!r) return;
  const a = accList().find(a=>a.name===r.name);
  if(!a || a.ph!==hashPwd(r.pwd)){ alert("账号名或密码不正确"); return; }
  accSwitch(r.name);
}
function accSwitch(name){
  localStorage.setItem("lz_account", JSON.stringify({name}));
  location.reload();   // 重载后按新账号读取数据
}
function accLogout(){
  localStorage.removeItem("lz_account");
  location.reload();
}

  十一·补 2：生词模式（每日复习 + 超详细生词详情）
  复习算法：间隔重复，认识一次推进一格（1/2/4/7/15 天），
  点「不认识」回到第 0 格明天再见；详情含 音标/多义项/
  例句/收藏原句/出处书名/句序/收藏时间
===================================================== */
const SRS = [1,2,4,7,15];   // 认识次数 → 下次复习间隔（天）
let revIdx = 0;             // 本次复习进度指针
let practiceMode = false;   // 练习模式：不改变复习计划
let cardPhase = false;      // 是否已翻开答案
function fmtDate(t){
  const d = new Date(Number(t) || Date.now());
  if(isNaN(d.getTime())) return "—";
  return d.getFullYear() + "年" + (d.getMonth()+1) + "月" + d.getDate() + "日";
}
function vocabSrs(){ try{ return JSON.parse(localStorage.getItem(pk(langKey("vocabsrs"))) || "{}"); }catch(e){ return {}; } }
function saveVocabSrs(o){ try{ localStorage.setItem(pk(langKey("vocabsrs")), JSON.stringify(o)); }catch(e){} }
function vocabSrsOf(w){ return vocabSrs()[String(w||"").toLowerCase()] || null; }
function setVocabSrs(w, box){
  const o = vocabSrs();
  o[String(w||"").toLowerCase()] = {box, next: Date.now() + (SRS[box] || 15) * 864e5, at: Date.now()};
  saveVocabSrs(o);
}
function vocabDueList(){
  const now = Date.now(), sr = vocabSrs();
  return store.vocab.map((x,i)=>({x,i}))
    .filter(({x})=>{ const s = sr[String(x.w||"").toLowerCase()]; return !s || s.next <= now; });
}
function vocabStats(){
  const sr = vocabSrs(), now = Date.now();
  const all = store.vocab;
  let due = 0, learning = 0, mastered = 0, fresh = 0;
  all.forEach(x=>{
    const s = sr[String(x.w||"").toLowerCase()];
    if(!s) fresh++;
    else if(s.next > now && (s.box||0) >= 3) mastered++;
    else { learning++; if(s.next <= now) due++; }
  });
  return {total:all.length, due, learning, mastered, fresh};
}
function dueList(){ return vocabDueList(); }

      <button class="iconbtn" onclick="event.stopPropagation();speakText('${String(x.w).replace(/'/g,"\\'")}')">🔊</button>
      <button class="iconbtn" onclick="event.stopPropagation();vocabMarkMastered(${i})">✓ 掌握</button>

      <button class="iconbtn" onclick="event.stopPropagation();delVocab2(${i})">🗑</button>

  }).join("");

    `<h2 class="sec">全部生词（${v.length}）· 点开查看详细释义与出处</h2>` +

}
function togglePractice(){
  practiceMode = !practiceMode;
  revIdx = 0;
  cardPhase = false;
  renderSReview();
}
function toggleCardPhase(){
  cardPhase = !cardPhase;
  renderSReview();

function vocabRate(i, quality){
  const v = store.vocab, x = v[i];
  if(!x) return;
  const w = String(x.w || "").toLowerCase();
  const prev = vocabSrsOf(w);
  let box = prev ? (prev.box || 0) : 0;
  if(quality >= 2) box = Math.min(box + 1, SRS.length - 1);
  else if(quality === 1) box = Math.max(0, box);
  else box = 0;
  if(!practiceMode) setVocabSrs(w, box);
  x.srs = {box, next: Date.now() + SRS[box] * 864e5};
  store.vocab = v;
  const ws = wordStates();
  const stem = stemOf(w);
  if(ws[stem]){ ws[stem].st = box >= 3 ? 2 : (box >= 1 ? 1 : 0); saveWS(); }
  revIdx++;
  cardPhase = false;
  renderSReview();
  updateNavRev();
}
function vocabMarkMastered(i){
  const x = store.vocab[i];
  if(!x) return;
  const w = String(x.w || "").toLowerCase();
  setVocabSrs(w, SRS.length - 1);
  const ws = wordStates(); const stem = stemOf(w);
  if(ws[stem]){ ws[stem].st = 2; saveWS(); }
  renderSReview();
  toast("已标记为掌握，下次复习 " + SRS[SRS.length-1] + " 天后");
}
function goPracticeWord(i){
  const x = store.vocab[i];
  if(!x) return;
  practiceMode = true;
  revIdx = i;
  cardPhase = false;
  renderSReview();
  try{ window.scrollTo(0, 0); }catch(e){}
}
async function jumpToVocabSource(i){
  const x = store.vocab[i];
  if(!x || !x.book) return;
  const isImport = store.imports.some(v => v.id === x.book);
  try{
    if(isImport) await ensureImportLoaded(x.book);
    else await openFull(x.book);
    setTimeout(()=>{ try{ scrollToSent(Number(x.si) || 0); }catch(e){} }, 600);
  }catch(e){ toast("这本书需要联网打开一次。"); }
}

    ${x.book_id ? `<button class="btn ghost small" onclick="event.stopPropagation();jumpToVocabSource(${i})">📖 回到原句</button>` : ""}
  </div></div>`;
  el.innerHTML = h;
  el.hidden = false;

function wsLabel(v){ return v===0?"陌生":v===1?"学习中":v===2?"已掌握":"忽略"; }
function renderWSMgr(){
  const el = document.getElementById("wsmgr");
  if(!el) return;
  const ws = wordStates();
  const cnt = {"-1":0}; let total=0;
  Object.values(ws).forEach(f=>{ total++; cnt[f.st]=(cnt[f.st]||0)+1; });
  const list = Object.entries(ws)
    .filter(([k,f])=> (wsf==="all"||String(f.st)===wsf) && (!wsk || (f.w||k).toLowerCase().includes(wsk)))
    .slice(0,300);
  el.innerHTML = `
    <h2 class="sec">📚 词库管理（词族粒度 · M2）</h2>
    <div class="rec-banner">共 ${total} 个词族 · 陌生 ${cnt[0]||0} · 学习中 ${cnt[1]||0} · 已掌握 ${cnt[2]||0} · 忽略 ${cnt["-1"]}</div>
    <div class="filters">
      ${[["all","全部"],["0","陌生"],["1","学习中"],["2","已掌握"],["-1","忽略"]].map(([v,l])=>
        `<button class="chip ${wsf===v?"on":""}" onclick="wsf='${v}';renderWSMgr()">${l}</button>`).join("")}
    </div>
    <input class="search" style="margin-top:10px" placeholder="搜索词根…" value="${wsk}"
      oninput="wsk=this.value.toLowerCase();renderWSMgr()">
    <div class="vlist" style="margin-top:10px">
      ${list.map(([k,f])=>`<div class="vitem">
        <span class="w">${f.w||k}</span>
        <span class="m">${wsLabel(f.st)} · 查 ${f.n} 次 · 词族 ${k}*</span>
        <button class="iconbtn" onclick="event.stopPropagation();speakText('${(f.w||k).replace(/'/g,"\\'")}')">🔊</button>
        <button class="iconbtn" onclick="wsToggle('${k}')">切换状态</button>
        <button class="iconbtn" onclick="wsDel('${k}')">🗑</button>
      </div>`).join("") || `<div class="empty">暂无记录：阅读时点词即自动进入词库。</div>`}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <button class="btn ghost small" onclick="wsBatch()">把筛选结果全部标为已掌握</button>
      <button class="btn ghost small" onclick="wsExport()">📤 导出 JSON</button>
      <button class="btn ghost small" onclick="document.getElementById('wsImportFile').click()">📥 导入 JSON</button>
      <input type="file" id="wsImportFile" accept=".json" style="display:none" onchange="wsImport(this)">
    </div>

/* =====================================================
  离线：把站内全部书籍下载进缓存，之后断网也能读
===================================================== */
let dlRunning = false;
async function downloadAll(){
  if(!requirePro("批量离线下载")) return;
  if(dlRunning) return;
  const btn = document.getElementById("offlineBtn");
  /* 只下载站内已打包的 272 本；其余 3000+ 本按需下载，避免 3GB 流量 */
  const list = BOOKS.filter(b=>typeof b.gb === "number" && b.src !== "pg");
  dlRunning = true; btn.disabled = true;
  let ok = 0, fail = 0;
  const total = list.length;
  for(let i=0;i<total;i++){
    const b = list[i];
    try{
      /* 已缓存就跳过，避免重复下载 */
      const cached = await idbGet(b.gb).catch(()=>null);
      if(cached && cached.length > 2000){ ok++; }
      else{
        const r = await fetch("./books/pg"+b.gb+".txt", {cache:"force-cache"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        const txt = await r.text();
        if(!txt || txt.length < 2000) throw new Error("内容过短");
        await idbPut(b.gb, txt, txt.length, b.t);
        ok++;
      }
    }catch(e){ fail++; }
    btn.textContent = `📶 下载中 ${i+1}/${total}（成功 ${ok}${fail?(" · 失败 "+fail):""}）`;
    if(i % 10 === 0) await new Promise(r=>setTimeout(r, 0));
  }
  btn.textContent = `📶 已离线 ${ok}/${list.length}`;
  btn.disabled = false; dlRunning = false;
}

function inferPracticeWord(text){
  const STOP = new Set(("the a an is are was were be been being have has had do does did will would shall should can could may might must of in on at to for with by from as and but or that which who whom this these those it its i me my we us our you your he him his she her they them their what when where why how not no so if then than just about into through over under up down out off all any some more most such very too only own same other another each both few many much little less least").split(/\s+/));
  const words = (String(text || "").match(/[A-Za-z'’-]{4,}/g) || [])
    .map(w => w.toLowerCase().replace(/^[-']+|[-']+$/g, ""))
    .filter(w => !STOP.has(w));
  if(!words.length) return "";
  /* 取最长、最像实词的一个；同长取靠前 */
  return words.sort((a,b)=> b.length - a.length)[0];
}
function practiceSentence(bookId, si){

  if(!s){ toast("句子还没准备好，请稍后再试"); return; }
  const AC = window.AssemblyCore;
  if(!AC || !window.AssemblyPanel){ toast("拼装模块加载中，请稍后重试"); return; }
  const chunks = AC.splitIntoChunks(s.en);
  const b = BOOKS.find(x=>x.id===bookId) || {};
  const targetWord = (s.target_words && s.target_words[0]) || inferPracticeWord(s.en);
  const sentence = {
    sentence_id: bookId + "_s" + String(si + 1).padStart(3, "0"),
    book_id: bookId, level: b.lv || "B1", text: s.en, zh: s.zh || "",
    chunks, chunk_roles: AC.chunkRoles(chunks),
    target_words: targetWord ? [targetWord] : [], readability: 0, custom: true, source: "当前阅读句"
  };
  /* 关键：面板覆盖在阅读器上，不跳页、不打断阅读 */
  const all = getSents(bookId);
  const rng = currentChapterRange();
  const ctx = {
    prev: rng && si > rng[0] && all[si-1] ? all[si-1].en : "",
    next: rng && si + 1 < rng[1] && all[si+1] ? all[si+1].en : "",
    chapter: (fullMode && fullCache[bookId] && fullCache[bookId].chapters[fullMode.chap] || {}).t || "",

}

function asmUsageHtml(s){
  const word = (s.target_words && s.target_words[0]) || "";
  let info = null;
  try{ if(typeof lzWordInfo === "function") info = lzWordInfo(word); }catch(e){}
  let html = "";
  if(word){
    html += `<b>${escHtml(word)}</b>`;
    if(info && info.zh) html += ` <span style="color:var(--muted)">常用义：${escHtml(info.zh)}</span>`;
    else if(info && info.def) html += ` <span style="color:var(--muted)">常用义：${escHtml(info.def[0]+" "+info.def[1])}</span>`;
    html += ` · <a href="#" onclick="asmMoreMeaning(event,${JSON.stringify(word)});return false;" style="color:var(--brand-deep)">更多释义</a>`;
  }
  const roles = window.AssemblyCore ? AssemblyCore.chunkRoles((s.chunks||[])) : [];
  const tips = {
    subject:"主语通常放句首", predicate:"谓语是句子核心", prep_phrase:"介词短语可整体移动",
    clause:"从句可前置强调", conjunction:"连词连接两个意群", infinitive:"不定式常表目的",
    participle:"分词短语作定语或状语", copular:"系动词连接表语", auxiliary:"助动词构成时态语态"
  };
  const line = [...new Set(roles)].map(r=>tips[r]).filter(Boolean).join("；");
  if(line) html += `<div style="color:var(--muted);margin-top:4px">${escHtml(line)}</div>`;
  return html;
}

function asmSlotClick(i){
  /* 点已填槽位 = 把这块意群退回下方的块池 */
  if(asmState && asmState.userChunks[i]){
    asmState.userChunks[i] = null;
    asmRenderStage();
  }
}
function asmPut(chunk){
  if(asmState.userChunks.includes(chunk)) return;
  const idx = asmState.userChunks.findIndex(x=>!x);
  if(idx<0) return;
  asmState.userChunks[idx] = chunk;
  asmRenderStage();
}
function asmReset(){
  asmTextUnlocked = false;
  asmState.userChunks = new Array(asmState.chunks.length).fill(null);
  asmState.shuffled = asmState.chunks.slice().sort(()=>Math.random()-.5);
  asmState.revealUsed = false;
  asmState.showAnswer = false;
  asmState.lastResult = null;
  asmRenderStage();
}
function asmHint(){
  if(!asmState) return;
  if(asmState.revealUsed){ toast("已经看过答案，这次不计分，点「↺ 重置」重新做。"); return; }
  for(let i=0;i<asmState.chunks.length;i++){
    if(!asmState.userChunks[i]){ asmState.userChunks[i] = asmState.chunks[i]; asmState.revealUsed = true; break; }
  }
  asmRenderStage();
}
function asmTranslate(){
  const s = asmState && asmState.sentence;
  if(!s) return;
  const el = document.getElementById("asmZh");
  if(el) el.innerHTML = `<span style="color:var(--muted)">翻译中…</span>`;
  mtFetch(s.text).then(t=>{
    s.zh = t;
    if(el) el.textContent = "💬 "+t;
  }).catch(e=>{
    if(el) el.innerHTML = `翻译失败：${e.message} <button class="btn ghost small" onclick="asmTranslate()">重试</button>`;
  });
}
function asmSpeak(){ if(asmState) speakText(asmState.sentence.text); }
function asmSubmit(){
  if(!asmState) return;
  if(asmState.userChunks.some(x=>!x)){ document.getElementById("asmResult").innerHTML = `<span style="color:var(--danger)">⚠️ 还有槽位没放意群</span>`; return; }
  if(asmState.revealUsed){
    document.getElementById("asmResult").innerHTML = `<span style="color:var(--danger)">这次看过答案了，不计分；点「↺ 重置」再来一次。</span>`;
    return;
  }
  const r = window.AssemblyCore.judgeAssembly(asmState.userChunks, asmState.chunks);
  asmState.showAnswer = false;
  const st = asmStats();
  st.attempts++; if(r.result==="EXACT") st.exact++;
  const lv = asmState.sentence.level || "B1";
  st.byLevel[lv] = (st.byLevel[lv]||0)+1;
  asmSaveStats(st);
  const color = r.result==="EXACT" ? "var(--brand)" : "var(--danger)";
  const emoji = {EXACT:"🎉 完全正确！",SPELLING:"📝 拼写小问题",ORDER_ERROR:"🔀 顺序不对",MIXED:"⚠️ 有多处错误",OTHER:"❌ 不太对"}[r.result] || "结果";
  document.getElementById("asmResult").innerHTML = `<div style="font-size:17px;font-weight:700;color:${color}">${emoji}</div>
    <div style="color:var(--muted)">${r.hint||""}</div>
    ${r.result==="EXACT"?`<div class="tip" style="margin-top:6px">正确语序：${asmState.chunks.map((c,i)=>`<b>${i+1}</b>. ${escHtml(c)}`).join("　")}</div>`:""}
    <div style="margin-top:8px"><button class="btn small" onclick="asmNewRandom()">🎲 下一句</button></div>`;
  window.AssemblyCore.recordAssembly({sentence_id:asmState.sentence.sentence_id, book_id:asmState.sentence.book_id,
    user_chunks:asmState.userChunks, target_chunks:asmState.chunks, result:r.result, error_type:r.error_type,
    duration_ms: Date.now() - (asmState.startedAt || Date.now())});
  statsBump({asm:1, exact: r.result === "EXACT" ? 1 : 0});
  if(r.result === "EXACT" && typeof window.onAssemblySuccess === "function"){
    window.onAssemblySuccess(asmState.selected || null, asmState.sentence);
  }
  asmState.startedAt = Date.now();
  document.querySelectorAll(".statbox b").forEach((el,i)=>{
    if(i===0) el.textContent = st.attempts;
    if(i===1) el.textContent = st.exact;
    if(i===2) el.textContent = Math.round(st.exact/Math.max(1,st.attempts)*100)+"%";
  });
}

async function refreshCacheSize(){
  const el = document.getElementById("cacheSizeTip");
  if(!el) return;
  try{
    const bookBytes = await idbSize();
    let importBytes = 0;
    try{
      const db = await openIDB();
      const tx = db.transaction("imports","readonly");
      const all = await new Promise((res,rej)=>{ const r=tx.objectStore("imports").getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=rej; });
      importBytes = all.reduce((s,x)=> s + ((x.chars||x.text?.length||0)*2), 0);
    }catch(e){}
    el.textContent = "全文 "+(bookBytes/1024/1024).toFixed(1)+"MB · 导入书约 "+(importBytes/1024/1024).toFixed(1)+"MB";
  }catch(e){ el.textContent = "IndexedDB 不可用"; }
}
async function clearOfflineCache(){
  if(!confirm("清空下载的全文与缓存的整章译文？导入到书架的书不会被删除。")) return;
  try{
    const db = await openIDB();
    const tx = db.transaction(["books","kv"],"readwrite");
    tx.objectStore("books").clear();
    const keys = await new Promise((res,rej)=>{ const r=tx.objectStore("kv").keys(); r.onsuccess=()=>res(r.result||[]); r.onerror=rej; });
    keys.forEach(k=>{ if(String(k).startsWith("txmap_") || String(k).startsWith("tx_")) tx.objectStore("kv").delete(k); });
    await new Promise((res,rej)=>{ tx.oncomplete=res; tx.onerror=rej; });
  }catch(e){}
  Object.keys(fullCache).forEach(k=>{ if(!fullCache[k].guide && !fullCache[k].imported) delete fullCache[k]; });
  mtCache = {}; _saveMtCache();
  refreshCacheSize();
  alert("已清空离线全文与译文缓存。");
}

/* ========== 权益叠加模型 ==========
   同时持有「全语言会员」和「单语言会员」时不应互相覆盖，而要合并：
   - entitlements.all       所有语言的会员（取最晚到期时间）
   - entitlements.one[code] 单个语言的会员
   - entitlements.permanent 永久标记

const ENT_KEY = "lz_entitlements_v2";
function emptyEnt(){
  return { all: { expires:0, permanent:false, plan:"", sources:[] },
           one: {}, permanent:false, updatedAt: Date.now() };
}
function loadEnt(){
  let e = null;
  try{ e = JSON.parse(localStorage.getItem(ENT_KEY) || "null"); }catch(e2){ e = null; }
  if(!e || !e.all){
    e = emptyEnt();
    /* 迁移旧数据：pk("pro") 里可能有一个 {plan, scope, lang, expires} */
    try{
      const old = JSON.parse(localStorage.getItem(pk("pro")) || "null");
      if(old){
        const exp = old.permanent ? 0 : (Number(old.expires) || 0);
        const scope = old.scope || (old.plan === "lang" ? "one" : "all");
        if(scope === "one" && old.lang){
          e.one[old.lang] = { expires: exp, permanent: !!old.permanent, plan: old.plan || "lang", sources: ["migrated"] };
        } else {
          e.all = { expires: exp, permanent: !!old.permanent, plan: old.plan || "all_month", sources: ["migrated"] };
        }
        e.permanent = !!old.permanent;
        e.updatedAt = Date.now();
        saveEnt(e);
      }
    }catch(e3){}
  }
  if(!e.one) e.one = {};
  /* 清理已过期的单语言条目 */
  const now = Date.now();
  for(const k of Object.keys(e.one)){
    const v = e.one[k];
    if(!v.permanent && v.expires && v.expires < now) delete e.one[k];
  }
  return e;
}
function saveEnt(e){
  e.updatedAt = Date.now();
  try{ localStorage.setItem(ENT_KEY, JSON.stringify(e)); }catch(err){}
  /* 同时写一份「兼容状态」，供仍读取 pk("pro") 的旧代码使用 */

/* 叠加一项权益：同一语言 / 全语言取「最晚到期」，不会覆盖更长的那个 */
function addEntitlement(scope, lang, expires, permanent, plan, source){
  const e = loadEnt();
  if(permanent || !expires){
    e.permanent = true;
    if(scope === "one" && lang){ e.one[lang] = { expires:0, permanent:true, plan: plan||"lang", sources:[source||"activation"] }; }
    else { e.all = { expires:0, permanent:true, plan: plan||"permanent", sources:[source||"activation"] }; }
  } else {
    if(scope === "one" && lang){
      const cur = e.one[lang] || { expires:0, permanent:false, plan:"", sources:[] };
      if(!cur.permanent){
        cur.expires = Math.max(Number(cur.expires)||0, Number(expires));
        cur.plan = (Number(expires) >= (Number(cur.expires)||0)) ? (plan || cur.plan) : cur.plan;
        cur.sources = [...new Set([...(cur.sources||[]), source||"activation"])];
        cur.permanent = false;
        e.one[lang] = cur;
      }
    } else {
      if(!e.all.permanent){
        const keep = Math.max(Number(e.all.expires)||0, Number(expires));
        e.all = { expires: keep, permanent: false, plan: (Number(expires) >= (Number(e.all.expires)||0)) ? (plan || "all_month") : (e.all.plan || "all_month"),
                  sources: [...new Set([...(e.all.sources||[]), source||"activation"])] };
      }
    }
  }
  saveEnt(e);
  return e;
}
/* 展示用的合并状态：最多到期的权益作为「主方案」 */
function proState(){
  try{
    const e = loadEnt();
    const now = Date.now();
    const allActive = e.permanent || e.all.permanent || (e.all.expires && e.all.expires > now);
    const ones = Object.entries(e.one).filter(([, v]) => v.permanent || (v.expires && v.expires > now));
    if(!allActive && !ones.length) return null;
    if(allActive){
      return { plan: e.all.plan || "all_month", scope:"all", lang:"",
               expires: e.permanent || e.all.permanent ? 0 : e.all.expires,
               permanent: e.permanent || e.all.permanent, at: e.updatedAt || now, source: (e.all.sources||[]).join(","),
               ones: ones.map(([k,v]) => ({ lang:k, expires:v.expires, permanent:v.permanent })) };
    }
    /* 没有全语言时，取到期最晚的单语言 */
    ones.sort((a,b) => (b[1].permanent?Infinity:b[1].expires) - (a[1].permanent?Infinity:a[1].expires));
    const [lang, v] = ones[0];
    return { plan: v.plan || "lang", scope:"one", lang,
             expires: v.permanent ? 0 : v.expires, permanent: !!v.permanent, at: e.updatedAt || now,
             source: (v.sources||[]).join(","),
             ones: ones.map(([k, vv]) => ({ lang:k, expires:vv.expires, permanent:vv.permanent })) };

}

  /* 叠加而不是覆盖：同时买了两门单语言 / 单语言 + 全语言，都保留，取各自最晚到期 */
  addEntitlement(scope, scope === "one" ? (lang || activeLang()) : "", Number(expires) || 0, permanent, plan, source || "activation");
  updatePlanBadge();
  if(document.getElementById("view-plan") && document.getElementById("view-plan").classList.contains("on")) renderPlan();

async function activateCode(code, silent){
  const c = normalizeCode(code);
  if(!c){ if(!silent) toast("请输入激活码。"); return false; }
  const def = REDEEM_CODES[c];
  if(!def){
    if(!silent) toast("激活码无效，请检查大小写后再试（大小写不敏感）。");
    return false;
  }
  const did = deviceId();
  const used = localRedeemed();
  if(used[c]){
    if(!silent) toast("这个激活码已经在本机使用过了（一机一码一次）。");
    return false;
  }
  /* 优先服务端校验：防止同一码在另一台设备重复使用 */
  let serverOk = false, serverMsg = "", serverExpires = 0, serverPlan = def.plan, serverScope = def.scope || "";
  if(/^https?:/.test(location.protocol)){
    try{
      const r = await fetch(apiUrl("api/redeem"), {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({code:c, device:did})
      });
      const j = await r.json().catch(()=>({}));
      if(r.ok && j.ok){
        serverOk = true;
        serverPlan = j.plan || def.plan;
        serverScope = j.scope || def.scope || "";
        serverExpires = Number(j.expires || 0);
      } else if(r.status === 409){
        if(!silent) toast(j.message || "这个激活码已经在另一台设备使用过了（一机一码一次）。");
        return false;
      } else serverMsg = j.message || ("服务端校验失败 " + r.status);
    }catch(e){ serverMsg = e.message || "网络失败"; }
  }
  if(!serverOk && /^https?:/.test(location.protocol)){
    /* 服务端不可用时：仍允许本机激活，但只在本地登记，避免把用户卡死 */
    if(!silent) toast("服务端暂不可用，已在本机登记激活（" + (serverMsg || "离线") + "）。");
  }
  const now = Date.now();
  let expires = 0;
  if(serverOk && serverExpires){ expires = serverExpires; }
  else if(serverOk && serverPlan === "permanent"){ expires = 0; }
  else if(def.days){
    const prev = proState();
    const base = prev && !prev.permanent && prev.expires > now ? prev.expires : now;
    expires = base + def.days * 86400000;
  }
  used[c] = {at: now, plan: serverPlan || def.plan, device: did};
  saveLocalRedeemed(used);
  applyPro(serverPlan || def.plan, expires, "code:" + c,
           (serverScope || def.scope) === "one" ? (PAYMENT_LANGS.lang || activeLang()) : "",
           serverScope || def.scope);
  if(!silent) toast("激活成功：" + (PLAN_DEF[serverPlan || def.plan]?.name || def.label) + (expires ? "，有效期至 " + new Date(expires).toLocaleDateString() : "，永久有效") + "。");
  return true;
}

function freeQuotaLeft(){
  if(langIsPaid()) return Infinity;
  /* 免费额度：英语 120 句/天，其余语言统一 80 句/天 */
  const q = langQuota();
  /* 按语言统计今日已用额度（历史上未按语言分开的记录不计入） */
  let used = 0;
  try{
    const all = statsAll();
    const lb = (all.byLang || {})[activeLang()] || {};
    const today = _dateKey();
    used = ((lb.days || {})[today] || {}).translated || 0;
  }catch(e){ used = 0; }
  return Math.max(0, q - used);
}
function consumeTranslate(n){
  if(isPro() || n <= 0) return n;
  const left = freeQuotaLeft();
  const used = Math.min(left, n);
  if(used > 0) statsBump({translated: used});
  return used;
}

/* 服务端二次校验（RevenueCat）：拿到购买凭证后调用，防止改包白嫖 */
async function iapVerifyServer(productId){
  try{
    let uid = localStorage.getItem("lz_iap_uid");
    if(!uid){ uid = "lz_" + Math.random().toString(36).slice(2, 12); localStorage.setItem("lz_iap_uid", uid); }
    const r = await fetch(window.__LZ_NATIVE ? "public/api/iap/verify" : apiUrl("api/iap/verify"), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ appUserId: uid, product: productId }),
      signal: AbortSignal.timeout(12000)
    });
    if(!r.ok) return { ok:false, offline:true };
    return await r.json();
  }catch(e){ return { ok:false, offline:true }; }
}
/* 启动时与切回前台时自动恢复订阅（换机/重装/续订后立即生效） */
async function iapSyncOnLaunch(){
  if(!iapAvailable()) return;

}

/* 发起 App 内购买；成功后解锁并写回本地状态 */
async function iapBuy(productId){
  const P = iapPlugin();
  if(!P){ toast("内购插件未安装"); return; }
  try{
    const r = P.purchaseProduct ? await P.purchaseProduct({ productIdentifier: productId })
                                : await P.purchase({ productId, type: "subs" });
    const info = (r && (r.customerInfo || r.transaction)) || r || {};
    const ents = (info.entitlements && info.entitlements.active) || {};
    const pid = Object.keys(ents)[0] || productId;
    const exp = (ents[pid] && ents[pid].expirationDate) || (info.expirationDate) || (Date.now() + 31*86400000);
    /* 服务端二次校验：能连上就以后端为准，连不上则用本地票据（离线也能用） */
    const chk = await iapVerifyServer(pid);
    const expFinal = (chk && chk.ok && chk.entitlements && chk.entitlements[0] && chk.entitlements[0].expires) ? chk.entitlements[0].expires : exp;
    const st = applyStoreEntitlement({ productId: pid, expiresDate: expFinal });
    closePaywall();
    toast(st ? ("购买成功：" + planLabel()) : "购买成功，但订阅仍在同步中");
    renderPlan();
  }catch(e){
    const msg = String(e && e.message || e);
    if(/cancel/i.test(msg)) toast("已取消购买");
    else toast("购买失败：" + msg);
  }
}

function downloadFile(name, content, mime){
  const blob = new Blob([content], {type: mime || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

async function idbBookGet(gb){ return idbGet(gb); }
async function runFullTextSearch(){
  const q = (document.getElementById("searchBox").value || "").trim();
  const panel = document.getElementById("ftResults");
  if(!panel) return;
  panel.style.display = "block";
  if(q.length < 2){
    panel.innerHTML = `<div class="tip">输入至少 2 个字符再搜索。全文搜索范围：已下载/已导入的书；未下载的书请先用书名搜索并打开一次。</div>`;
    return;
  }
  if(_ftRunning) return;
  _ftRunning = true;
  panel.innerHTML = `<div class="tip">正在搜索「${escHtml(q)}」…（已缓存书 + 导入书）</div>`;
  const hits = [];
  const ql = q.toLowerCase();
  const addHit = (kind, bookId, title, si, text, zh) => {
    if(hits.length >= 60) return;
    const idx = text.toLowerCase().indexOf(ql);
    if(idx < 0) return;
    const start = Math.max(0, idx - 60), end = Math.min(text.length, idx + q.length + 90);
    hits.push({kind, bookId, title, si, text, zh, snippet: (start>0?"…":"") + text.slice(start, end) + (end<text.length?"…":"")});
  };
  try{
    const imports = await idbAllImports();
    for(const rec of imports){
      const sents = rec.sents || (rec.text ? splitSentences(rec.text) : []);
      for(let i=0;i<sents.length;i++) addHit("import", rec.id, rec.t, i, sents[i].en, sents[i].zh);
    }
    /* 只读取前 6 本缓存书，避免一次性把上百 MB 全文拉进内存 */
    const cachedKeys = (await idbBookKeys()).slice(0, 6);
    for(const gb of cachedKeys){
      if(hits.length >= 60) break;
      const txt = await idbBookGet(gb);
      if(!txt) continue;
      const parsed = (fullCache["remote-"+gb] && fullCache["remote-"+gb].sents) ? fullCache["remote-"+gb] : parseFull(txt);
      const b = BOOKS.find(x => x.gb === Number(gb));
      const title = b ? dispTitle(b) : ("PG #" + gb);
      for(let i=0;i<parsed.sents.length;i++) addHit("book", b ? b.id : "remote-"+gb, title, i, parsed.sents[i].en, parsed.sents[i].zh);
    }
    for(const id of Object.keys(fullCache)){
      if(hits.length >= 60) break;
      const data = fullCache[id];
      if(!data || !data.sents) continue;
      const b = BOOKS.find(x => x.id === id) || store.imports.find(x => x.id === id) || {};
      for(let i=0;i<data.sents.length;i++) addHit("loaded", id, dispTitle(b) || id, i, data.sents[i].en, data.sents[i].zh);
    }
  }catch(e){ /* ignore */ }
  _ftRunning = false;
  if(!hits.length){
    panel.innerHTML = `<div class="tip">没有找到「${escHtml(q)}」。可能这本书还没下载到本地：先在书城点开一次（会自动缓存全文），或在导入书里搜索。</div>`;
    return;
  }
  panel.innerHTML = `<div class="tip">找到 ${hits.length} 处（最多显示 60 处）。点结果可直接跳到原句。</div>` +
    hits.map((h, i) => `<div class="ft-item" onclick="openSearchHit(${i})">
      <div class="ft-b">📖 ${escHtml(h.title)}</div>
      <div class="ft-s">${escHtml(h.snippet)}</div>
      <div class="ft-x">${h.kind === "import" ? "导入书" : "已缓存全文"} · 第 ${h.si+1} 句${h.zh ? " · 已有译文" : ""}</div>
    </div>`).join("");
  window._ftHits = hits;
}
async function openSearchHit(i){
  const h = window._ftHits && window._ftHits[i];
  if(!h) return;
  if(h.kind === "import"){
    await ensureImportLoaded(h.bookId);
    openReader(h.bookId);
  } else {
    const b = BOOKS.find(x => x.id === h.bookId) || {id:h.bookId, t:h.title, gb:Number(String(h.bookId).replace(/^remote-/,""))};
    await openFull(b.id || h.bookId);
  }
  setTimeout(() => { try{ scrollToSent(h.si); }catch(e){} }, 500);
}

    navigator.clipboard.writeText(t).then(()=>toast("已复制到剪贴板")).catch(()=>fallbackCopy(t));
  } else fallbackCopy(t);

function fallbackCopy(t){

  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";

  try{ document.execCommand("copy"); toast("已复制到剪贴板"); }catch(e){ toast("复制失败，请手动选择"); }

}

function dailyStreak(){
  const KEY = "lz_streak";
  let s = { date:"", count:0, streak:0 };
  try{ s = JSON.parse(localStorage.getItem(KEY)||"null") || s; }catch(e){}
  const today = new Date().toISOString().slice(0,10);
  if(s.date === today) return;  /* 今天已打卡 */
  /* 连续：昨天也打过 */
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(s.date === yesterday){ s.streak++; } else { s.streak = 1; }
  s.date = today;

/* 金句收藏存取 */
const _SENTCOL_KEY = "lz_sentcol";
function sentCol(){
  try{ return JSON.parse(localStorage.getItem(_SENTCOL_KEY)||"[]"); }catch(e){ return []; }
}
function saveSentCol(arr){ localStorage.setItem(_SENTCOL_KEY, JSON.stringify(arr.slice(0,500))); }
function collectSent(){
  if(!lastSent || !curBook){ alert("点一句话里的任意单词再来 ⭐ 收藏这句"); return; }
  const list = sentCol();
  const key = curBook.id + ":" + sheetSent;
  if(list.find(x=>x.k===key)){ alert("这句已收藏"); return; }
  list.unshift({
    k:key, bookId:curBook.id, bookTitle:curBook.t||"",
    en:lastSent.en, zh:lastSent.zh||"", t:Date.now()
  });
  saveSentCol(list);
  tutorialEvent("collect");
  alert("⭐ 已收入金句本（"+list.length+" 条）");
}
function removeSent(k){
  saveSentCol(sentCol().filter(x=>x.k!==k)); renderSentCol();
}
function renderSentCol(){
  const list = sentCol();
  const tip = document.getElementById("sentcolTip");
  const body = document.getElementById("sentcolList");
  if(!list.length){
    tip.textContent = "金句本是空的。在阅读器里点一句话里的任意单词，再点⭐收藏那句。";
    body.innerHTML = ""; return;
  }
  tip.textContent = "共 "+list.length+" 条 · 按收藏时间倒序";
  body.innerHTML = list.map(s=>`
    <div class="sent" style="cursor:default">
      <div class="en" style="text-align:justify">${escHtml(s.en)}</div>
      <div class="zh">${escHtml(s.zh||"（本句译文未缓存）")}</div>

/* 阅读器快捷键 + ⭐ 句子收藏辅助 */
function simClickWord(sentIdx){

  const all = getSents(curBook.id);

  if(!s){ alert("句子未找到"); return; }
  lastSent = s; sheetSent = sentIdx;
  /* sheetWord 设成这句里第一个有效词，方便弹层显示 */
  const m = (s.en||"").match(/[A-Za-z']+/);
  sheetWord = m ? m[0].toLowerCase() : "";
  /* 立刻 collect */
  collectSent();
}
function estimateBookStats(bookId){
  const all = getSents(bookId);
  if(!all.length) return null;
  let words = 0; all.forEach(s=>{ const w = (s.en||"").trim().split(/\s+/); words += w.length; });
  const chars = all.reduce((t,s)=> t + (s.en||"").length, 0);
  const pages = Math.ceil(chars / 2500);  /* 约 2500 字符/页（传统书籍排法） */
  const minutes = Math.round(words / 200);  /* 200 wpm 阅读速度 */
  return { words, chars, pages, minutes };
}
function fmtMin(n){
  if(n < 60) return n+" 分钟";
  const h = Math.floor(n/60), m = n%60;
  return h+" 小时"+(m?(" "+m+" 分钟"):"");
}
document.addEventListener("keydown", e=>{
  const isReader = document.getElementById("view-reader").classList.contains("on");
  if(!isReader) return;
  /* 空格翻页（注意不拦截输入框） */
  const tgt = e.target.tagName;
  const editable = e.target.isContentEditable || (e.target.closest && e.target.closest("[contenteditable='true']"));
  if(tgt==="INPUT"||tgt==="TEXTAREA"||tgt==="SELECT"||editable) return;
  const pct = window.innerHeight * 0.8;
  if(e.code==="Space"){ e.preventDefault(); window.scrollBy(0, pct); return; }
  if(e.key==="j"){ window.scrollBy(0, 400); return; }
  if(e.key==="k"){ window.scrollBy(0,-400); return; }
  if(e.key==="b"){ window.scrollTo(0,0); return; }
  if(e.key==="e"){ window.scrollTo(0, document.body.scrollHeight); return; }
  if(e.key==="Escape"){ hideSheet(); return; }
});

/* bookId 转换：pg11 → book011，或 camus → camus */
function gbToBookId(gbOrId){
  if(typeof gbOrId === "number") return "book" + String(gbOrId).padStart(3,"0");
  return gbOrId;
}
/* 给拼装面板用的本地词义信息（不联网） */
window.lzWordInfo = function(word){
  const low = String(word || "").toLowerCase().replace(/[^a-z'-]/g, "");
  if(!low) return null;
  const d = dictEntry(low);
  const cache = _dictCache[low];
  const senses = (cache && cache.defs) ? cache.defs.map(x => x.en).filter(Boolean) : [];
  const en = dictEnDef(low);
  if(en && !senses.includes(en)) senses.unshift(en);
  return { def:d, zh:_zhCache[low] || "", senses:senses.slice(0,4) };
};

/* 生词弹层 / 阅读器里的「在句中练」按钮触发函数 */
async function openAssemblyForCurrentWord(){
  if(!curBook){ alert("先在阅读器里打开一本书"); return; }
  if(!window.AssemblyCore || !window.AssemblyPanel){ alert("拼装模块加载中，请刷新重试"); return; }
  const bookId = sentBookIdFor(curBook) || curBook.id;
  const all = getSents(curBook.id);
  const curSent = all[sheetSent] || null;
  closeSheet();
  /* 有预制句子包就找最接近的一句；没有/差异大就实时生成 */
  let best = null;
  if(curBook.gb){
    try{
      const pack = await window.AssemblyCore.loadBookSentences(bookId);
      if(pack && pack.length){
        let bestScore = 0;
        pack.forEach(s=>{
          const score = similarity(s.text, (curSent&&curSent.en)||"");
          if(score > bestScore){ bestScore = score; best = s; }
        });
        if(bestScore < 0.65) best = null;
      }
    }catch(e){}
  }
  if(!best){
    best = buildSentenceFromReader(bookId, sheetSent, sheetWord);
    best.custom = true;
    best.source = "当前阅读句";
  }
  if(curSent && !best.zh) best.zh = curSent.zh || "";
  if(best && best.sentence_id) window.__lastAsmSentenceId = best.sentence_id;
  const rng = currentChapterRange();
  const ctx = {
    prev: rng && sheetSent > rng[0] && all[sheetSent-1] ? all[sheetSent-1].en : "",
    next: rng && sheetSent + 1 < rng[1] && all[sheetSent+1] ? all[sheetSent+1].en : "",
    chapter: (fullMode && fullCache[curBook.id] && fullCache[curBook.id].chapters[fullMode.chap] || {}).t || "",
    word: sheetWord
  };
  window.AssemblyPanel.openAssembly(best, sheetWord, ctx);
}
/* 是否存在本书的预制句子包（离线壳/导入书没有） */
/* 当前书的句子包 ID：多语言书用 <lang>-<gb>，英语书用 book<gb> */
function sentBookIdFor(b){
  if(!b) return "";
  if(b.gb){
    const code = activeLang();
    return code === "en" ? ("book" + String(b.gb).padStart(3,"0")) : (code + "-" + b.gb);
  }
  return b.id || "";
}
function BOOKS_SENT_POOL(bookId){
  try{
    if(!/^https?:/.test(location.protocol)) return false;
    if(!window.LZAssembly || !Array.isArray(window.LZAssembly.books) || !window.LZAssembly.books.length) return false;
    return window.LZAssembly.books.some(b => b && b.bookId === bookId);
  }catch(e){ return false; }
}
/* 运行时动态构建句子对象（无需预制 JSON） */
function buildSentenceFromReader(bookId, sentIdx, word){
  const all = getSents(curBook.id);
  const s = all[sentIdx] || {en:"", zh:""};
  const text = s.en || "";
  const chunks = window.AssemblyCore.splitIntoChunks(text);
  const roles = window.AssemblyCore.chunkRoles(chunks);
  return {
    sentence_id: `${bookId}_s${String(sentIdx+1).padStart(3,"0")}`,
    book_id: bookId,
    level: (curBook && curBook.lv) || "B1",
    text: text,
    zh: s.zh || "",
    target_words: word ? [word.toLowerCase()] : [],
    chunks: chunks,
    chunk_roles: roles,
    readability: 5.0,
    custom: true,
    source: "当前阅读句"
  };
}
/* 文本相似度（Jaccard on words） */
function similarity(a, b){
  const sa = new Set((a||"").toLowerCase().split(/\s+/));
  const sb = new Set((b||"").toLowerCase().split(/\s+/));
  if(sa.size === 0 || sb.size === 0) return 0;
  let inter = 0; sa.forEach(w => { if(sb.has(w)) inter++; });
  return inter / (sa.size + sb.size - inter);
}
/* 拼装完全正确后 → 自动把生词标为「已掌握」 */
window.onAssemblySuccess = function(word, sentence){
  /* 拼装完全正确后把触发词标为「已掌握」，并记录句子来源 */
  if(word){
    const stem = stemOf(word.toLowerCase());
    const ws = wordStates();
    if(ws[stem]){ ws[stem].st = 2; saveWS(); }
    const vocab = store.vocab;
    const idx = vocab.findIndex(v => v.w === word.toLowerCase());
    if(idx >= 0){
      if(sentence && sentence.sentence_id) vocab[idx].source_sentence_id = sentence.sentence_id;
      vocab[idx].st = 2;
      store.vocab = vocab;
    }
  }
  if(typeof toast === "function") toast("拼装正确：这个词已标为「已掌握」");
};
/* 拼装每次提交的统计（面板直接回调全局函数，避免加载顺序问题） */
window.onAssemblyAttempt = function(res, log){
  statsBump({asm:1, exact: res && res.result === "EXACT" ? 1 : 0});
  try{
    const st = asmStats();
    st.attempts = (st.attempts || 0) + 1;
    if(res && res.result === "EXACT") st.exact = (st.exact || 0) + 1;
    st.byLevel = st.byLevel || {};
    const lv = (log && log.level) || "B1";
    st.byLevel[lv] = (st.byLevel[lv] || 0) + 1;
    asmSaveStats(st);
  }catch(e){}
};
/* 句子译文回写缓存（面板翻译后调用） */
window.__cacheSentenceZh = function(sentence, zh){
  if(!sentence || !sentence.sentence_id) return;
  if(!_isUsableZh(sentence.text, zh)) return;
  kvSet("sentzh_" + sentence.sentence_id, zh).catch(()=>{});
  const m = String(sentence.sentence_id).match(/^(book\d+)_/);
  if(m && window.LZAssembly && window.LZAssembly.packCache && window.LZAssembly.packCache[m[1]]){
    const pack = window.LZAssembly.packCache[m[1]];
    const hit = pack.find(x => x.sentence_id === sentence.sentence_id);
    if(hit) hit.zh = zh;
  }
};

/* 保存阅读进度节流 — 见上方 _pgSaveTimer 已声明 */
/* PWA：可安装到桌面/手机主屏（GitHub Pages 的 https 下可全局生效） */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")){
  /* 自动更新：注册 SW 并监听更新；发现新版本时顶部出现「立即更新」条 */
  navigator.serviceWorker.register("sw.js").then((reg) => {
    /* 每次打开都主动查一次有没有新版本 */
    try{ reg.update(); }catch(e){}
    const promptUpdate = (worker)=>{
      if(document.getElementById("lzUpdateBar")) return;
      const bar = document.createElement("div");
      bar.id = "lzUpdateBar";
      bar.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9998;background:var(--brand);color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13px";
      bar.innerHTML = `<span>🎉 有新版本可用</span>
        <button class="btn small" style="margin-left:auto;background:#fff;color:var(--brand-deep)" id="lzUpdateGo">立即更新</button>
        <button style="background:none;border:none;color:rgba(255,255,255,.8);font-size:18px;cursor:pointer" id="lzUpdateLater">×</button>`;
      document.body.appendChild(bar);
      document.getElementById("lzUpdateGo").onclick = ()=>{
        document.getElementById("lzUpdateGo").textContent = "更新中…";
        try{
          if(worker) worker.postMessage({type:"SKIP_WAITING"});
          else if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
        }catch(e){}
        setTimeout(()=>location.reload(), 600);
      };
      document.getElementById("lzUpdateLater").onclick = ()=>bar.remove();
    };
    if(reg.waiting) promptUpdate(reg.waiting);
    reg.addEventListener("updatefound", ()=>{
      const nw = reg.installing;
      if(!nw) return;
      nw.addEventListener("statechange", ()=>{ if(nw.state === "installed" && navigator.serviceWorker.controller) promptUpdate(nw); });
    });
    /* 控制器切换后（更新完成）刷新一次，拿到新资源 */
    let refreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(refreshed) return; refreshed = true; });
    /* iOS 没有 beforeinstallprompt：给一次性图文引导（Safari 分享 → 添加到主屏幕） */
    if(!matchMedia("(display-mode: standalone)").matches && /iPad|iPhone|iPod/.test(navigator.userAgent) && !navigator.standalone){
      setTimeout(() => { try{ showIosInstallGuide(); }catch(e){} }, 5000);
    }
  }).catch(()=>{});
}

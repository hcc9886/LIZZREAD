<!DOCTYPE html>
<!-- ============================================================
  LIZZREAD —— 双语线上图书馆（单文件版，无框架）
  功能：词汇量测试(CEFR 定级) → 按等级推荐 → 百余本名著书库
        → 双语试读（可开关中文、可选背景色、词/句颜色标记）
        → 点词自动弹卡（语境义 + 常用义 + 英英释义）+ TTS → 本地生词本
        → 导入书籍(TXT/EPUB) → 本地多账号
  存储：localStorage（账号 / 生词本 / 标记 / 阅读偏好）
============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIZZREAD · 线上图书馆</title>
<meta name="theme-color" content="#2F5D50">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ---------- 全局变量（默认 纯白 主题） ---------- */
:root{
  --bg:#F6F7F5; --surface:#FFFFFF; --surface2:#EFEFEA;
  --text:#1B1F1D; --muted:#6B7370; --border:#E2E5E0;
  --brand:#0F8A4D; --brand-deep:#0B6B3C; --brand-soft:#E7F5EC;
  --gold:#B98A2F; --danger:#D34B3E;
  --radius:12px; --shadow:0 1px 3px rgba(20,30,25,.08),0 8px 24px rgba(20,30,25,.06);
  --font:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Georgia","Songti SC",serif;
}
/* ---------- 阅读背景主题（全站生效） ---------- */
body[data-bg="sepia"]{--bg:#F1E9D6;--surface:#FBF5E6;--surface2:#EFE4C9;--border:#E0D3B2;--muted:#8A7A55}
body[data-bg="green"]{--bg:#E2EEE1;--surface:#EFF6EE;--surface2:#DFEBDD;--border:#C9DBC7;--muted:#5F7A60}
body[data-bg="blue"]{--bg:#E3EDF4;--surface:#F0F6FA;--surface2:#DFEAF2;--border:#C9DCE8;--muted:#5A7386}
body[data-bg="dark"]{--bg:#17191B;--surface:#212527;--surface2:#2C3134;--text:#E1E5E2;
  --muted:#98A09B;--border:#383F41;--brand:#2FBF72;--brand-deep:#5CD594;--brand-soft:#1D3327;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font:15px/1.6 var(--font);
     -webkit-tap-highlight-color:transparent;transition:background .25s}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.bar{max-width:1080px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:700 20px/1 var(--serif);letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.logo b{color:var(--brand)}
.logo small{font:400 11px/1 var(--font);color:var(--muted);margin-left:6px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav button{border:1px solid transparent;background:none;color:var(--muted);
  padding:7px 14px;border-radius:999px;font:500 14px/1 var(--font);cursor:pointer}
nav button:hover{background:var(--surface2)}
nav button.on{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--border)}

/* ---------- 布局容器 ---------- */
main{max-width:1080px;margin:0 auto;padding:20px 16px 90px}
.view{display:none}
.view.on{display:block}
h2.sec{font:700 20px/1.4 var(--font);margin:18px 0 12px}
.tip{color:var(--muted);font-size:13px;margin-bottom:12px}

/* ---------- 筛选器 ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px;align-items:center}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);
  padding:6px 13px;border-radius:999px;font:500 13px/1 var(--font);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.search{flex:1;min-width:160px;border:1px solid var(--border);border-radius:999px;
  padding:8px 14px;font:14px var(--font);outline:none;background:var(--surface);color:var(--text)}
.search:focus{border-color:var(--brand)}

/* ---------- 书卡网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.book{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.book:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cover{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;
  padding:12px;color:#fff;position:relative;overflow:hidden}
.cover img.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 文字浮于书皮图之上并带暗色投影保证可读 */
.cover .lv{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);
  font:600 11px/1 var(--font);padding:4px 8px;border-radius:999px;z-index:2}
.cover .t{position:relative;z-index:2;font:700 15px/1.3 var(--serif);
  text-shadow:0 1px 3px rgba(0,0,0,.65),0 0 6px rgba(0,0,0,.4);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cover .a{position:relative;z-index:2;font:400 11px/1.4 var(--font);
  text-shadow:0 1px 3px rgba(0,0,0,.65)}
.book .meta{padding:8px 10px 10px;font-size:12px;color:var(--muted)}
.book .meta .g{color:var(--brand-deep);font-weight:600}
.badge{display:inline-block;background:var(--gold);color:#fff;font:600 11px/1 var(--font);
  padding:3px 8px;border-radius:999px;margin-left:4px}
/* 各类型封面配色 */
.g-lit{background:linear-gradient(135deg,#2E5E4E,#4E8C6A)}
.g-mys{background:linear-gradient(135deg,#2B2F3A,#4A5268)}
.g-sci{background:linear-gradient(135deg,#1F3A5F,#3E6FA3)}
.g-fab{background:linear-gradient(135deg,#B96A2F,#E0A45C)}
.g-adv{background:linear-gradient(135deg,#8A4B2F,#C08A5A)}
.g-phl{background:linear-gradient(135deg,#4B3A6B,#7A68A0)}
.g-drama{background:linear-gradient(135deg,#7A3B3B,#A86868)}
.g-imp{background:linear-gradient(135deg,#555F66,#8A9AA5)}

/* ---------- 推荐横幅 ---------- */
.rec-banner{background:var(--brand-soft);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-banner b{color:var(--brand-deep)}
.rec-banner button{margin-left:auto}

/* ---------- 按钮 ---------- */
.btn{display:inline-block;border:none;cursor:pointer;font:500 14px/1 var(--font);
  padding:9px 18px;border-radius:10px;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-deep)}
.btn.ghost{background:var(--surface);color:var(--brand-deep);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--surface2)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 词汇测试 ---------- */
.test-card{max-width:560px;margin:24px auto;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow);padding:28px 24px;text-align:center}
.test-card .prog{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-bottom:20px}
.test-card .prog i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .25s}
.test-card .tier{font:600 12px/1 var(--font);color:var(--muted);letter-spacing:1px}
.test-card .word{font:700 34px/1.3 var(--serif);margin:14px 0 20px}
.opts{display:grid;gap:10px}
.opts button{border:1px solid var(--border);background:var(--surface);border-radius:10px;
  padding:12px;font:15px var(--font);cursor:pointer;text-align:left;color:var(--text)}
.opts button:hover{border-color:var(--brand);background:var(--brand-soft)}
.opts button.ok{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.opts button.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface));color:var(--danger)}
.result-lv{font:800 56px/1.2 var(--serif);color:var(--brand)}
.result-desc{color:var(--muted);font-size:14px;margin:10px 0 20px}

/* ---------- 书籍详情 ---------- */
.detail-head{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.detail-head .cover{width:130px;flex:0 0 auto;border-radius:var(--radius)}
.detail-info{flex:1;min-width:240px}
.detail-info h2{font:700 24px/1.3 var(--serif)}
.detail-info .by{color:var(--muted);margin:4px 0 10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.tag{background:var(--surface2);border-radius:999px;padding:4px 12px;font:500 12px/1 var(--font);color:var(--muted)}
.links a{color:var(--brand-deep);text-decoration:none;font-size:13px}
.links a:hover{text-decoration:underline}
.back{color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--brand-deep)}

/* ---------- 阅读器（逐句对照） ---------- */
.reader{max-width:720px;margin:0 auto}
.rd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rd-head h2{font:700 19px/1.3 var(--serif);flex:1;min-width:180px}
.rd-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.bgdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0}
.bgdot.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.sent{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;transition:background .2s}
.sent .en{font:17px/1.7 var(--serif)}
/* 整段模式：段落正文两端对齐，读起来像原版书 */
.sent.para .en{text-align:justify}
.sent .en span.w{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .1s}
.sent .en span.w:hover{background:var(--brand-soft)}
.sent .zh{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);
  color:var(--muted);font-size:14px}
body.no-zh .sent .zh{display:none}
.sent .tools{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 颜色标记 */
.mk1{background:#FFE58F}.mk2{background:#B7EB8F}.mk3{background:#FFB8C6}
.mk4{background:#A8D8FF}.mk5{background:#D9BFFF}
.sent.sm1{border-left-color:#F3C53D;background:color-mix(in srgb,#FFE58F 16%,var(--surface))}
.sent.sm2{border-left-color:#7BC34A;background:color-mix(in srgb,#B7EB8F 16%,var(--surface))}
.sent.sm3{border-left-color:#E86F87;background:color-mix(in srgb,#FFB8C6 16%,var(--surface))}
.sent.sm4{border-left-color:#5AA7E0;background:color-mix(in srgb,#A8D8FF 16%,var(--surface))}
.sent.sm5{border-left-color:#9F7BE0;background:color-mix(in srgb,#D9BFFF 16%,var(--surface))}
.mdot{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);cursor:pointer;padding:0}
.mdot.tit{width:auto;height:auto;border:none;background:none;font-size:12px;color:var(--muted);cursor:default;padding:0}

/* ---------- 生词卡（底部弹层） ---------- */
.mask{position:fixed;inset:0;background:rgba(15,20,17,.35);display:none;z-index:90}
.mask.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);
  width:100%;max-width:540px;background:var(--surface);border-radius:18px 18px 0 0;
  box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:20px 22px 26px;z-index:99;
  transition:transform .25s ease;max-height:78vh;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}
.sheet .w{font:700 26px/1.2 var(--serif)}
.sheet .sec-t{font:600 12px/1.5 var(--font);color:var(--brand-deep);margin:14px 0 4px;letter-spacing:.5px}
.sheet .d{color:var(--text);margin:2px 0;font-size:14px}
.sheet .d.dim{color:var(--muted)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sheet .close{position:absolute;top:10px;right:14px;background:none;border:none;
  font-size:20px;color:var(--muted);cursor:pointer}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- 生词本 ---------- */
.vlist{display:grid;gap:10px;max-width:720px}
.vitem{display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.vitem .w{font:600 17px/1.3 var(--serif);flex:1;min-width:100px;overflow:hidden;text-overflow:ellipsis}
.vitem .m{color:var(--muted);font-size:13px;flex:2;min-width:120px}
/* 词卡折叠区 */
.fold{border:1px solid var(--border);border-radius:10px;margin-top:10px;padding:8px 12px}
.fold summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.fold[open] summary{color:var(--brand)}
/* 生词详情展开区 */
.vdet{flex-basis:100%;border-top:1px dashed var(--border);margin-top:8px;
  padding-top:8px;font-size:13px;color:var(--text);cursor:default}
.vdet .dim{color:var(--muted)}
/* M2：词族熟练度正文高亮（陌生=红点线，学习中=琥珀实线，已掌握=不高亮） */
.w.st0{background:rgba(220,80,60,.12);border-bottom:1.5px dotted rgba(200,60,40,.55)}
.w.st1{background:rgba(230,160,30,.16);border-bottom:1.5px solid rgba(220,140,20,.6)}
.defen{cursor:pointer}
.defen:hover{text-decoration:underline}
/* 划选弹层（查首词 / 整段翻译 / 朗读） */
#selpop{display:none;position:absolute;z-index:80;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.2);
  padding:10px 12px;max-width:300px}
.rec-banner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 18px;font-size:15px;margin-bottom:14px;text-align:center}
.iconbtn{background:none;border:1px solid var(--border);border-radius:8px;
  padding:5px 10px;cursor:pointer;font-size:14px;color:var(--muted)}
.iconbtn:hover{border-color:var(--brand);color:var(--brand-deep)}
.empty{text-align:center;color:var(--muted);padding:50px 0;font-size:14px}

/* ---------- 移动端适配 ---------- */
@media (max-width:560px){
  .bar{padding:8px 12px}
  .logo small{display:none}
  main{padding:14px 12px 80px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .test-card{margin:14px auto;padding:22px 16px}
  .test-card .word{font-size:28px}
  .detail-head .cover{width:110px}
  .sent .en{font-size:16px}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" onclick="go('library')">LIZZ<b>READ</b><small>线上图书馆</small></div>
    <nav>
      <button id="nav-library" class="on" onclick="go('library')">书城</button>
      <button id="nav-test" onclick="go('test')">词汇测试</button>
      <button id="nav-vocab" onclick="go('vocab')">生词本</button>
      <button id="nav-sreview" onclick="go('sreview')">生词模式</button>
      <button id="nav-account" onclick="go('account')">账号</button>
    </nav>
  </div>
</header>

<main>
  <!-- ============ 书城 ============ -->
  <section class="view on" id="view-library">
    <div id="recBanner"></div>
    <div class="filters" id="lvChips"></div>
    <div class="filters"><div id="genreChips" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
    <div class="filters">
      <button class="btn ghost small" onclick="document.getElementById('importFile').click()">📥 导入书籍</button>
      <input type="file" id="importFile" accept=".txt,.epub" style="display:none" onchange="doImport(this)">
      <input class="search" id="searchBox" placeholder="搜索书名 / 作者…">
    </div>
    <div id="recSec"></div>
    <h2 class="sec" id="gridTitle">全部书目</h2>
    <div class="grid" id="bookGrid"></div>
  </section>

  <!-- ============ 词汇测试 ============ -->
  <section class="view" id="view-test">
    <div id="testIntro">
      <div class="test-card">
        <div class="word" style="font-size:26px">📚 词汇量测试</div>
        <p class="result-desc">
          24 道题，从 A1 到 C2 六个难度递进。<br>
          选出你认为最接近的解释，答完即得 CEFR 等级，<br>
          系统将按等级为你推荐适合的书。
        </p>
        <button class="btn" onclick="startTest()">开始测试（约 2 分钟）</button>
        <p class="result-desc" id="haveLv"></p>
      </div>
    </div>
    <div id="testBox" style="display:none">
      <div class="test-card">
        <div class="prog"><i id="progBar"></i></div>
        <div class="tier" id="qTier"></div>
        <div class="word" id="qWord"></div>
        <div class="opts" id="qOpts"></div>
      </div>
    </div>
    <div id="testResult" style="display:none">
      <div class="test-card">
        <div class="tier">你的词汇等级</div>
        <div class="result-lv" id="resLv"></div>
        <p class="result-desc" id="resDesc"></p>
        <button class="btn" onclick="afterTest()">去书城看推荐书目</button>
        <button class="btn ghost" onclick="startTest()" style="margin-left:8px">重新测试</button>
      </div>
    </div>
  </section>

  <!-- ============ 生词本 ============ -->
  <section class="view" id="view-vocab">
    <h2 class="sec">我的生词本 <span class="tip" style="display:inline" id="vocabCount"></span></h2>
    <div class="vlist" id="vocabList"></div>
  </section>

  <!-- ============ 生词模式（每日复习 + 详细词库） ============ -->
  <section class="view" id="view-sreview">
    <div id="sreviewBody"></div>
  </section>

  <!-- ============ 账号 ============ -->
  <section class="view" id="view-account">
    <div class="test-card" id="accountCard"></div>
  </section>

  <!-- ============ 书籍详情 ============ -->
  <section class="view" id="view-book"></section>

  <!-- ============ 阅读器 ============ -->
  <section class="view" id="view-reader"></section>
</main>

<!-- 生词弹层 -->
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <button class="close" onclick="closeSheet()">✕</button>
  <div class="w" id="shWord"></div>
  <div class="sec-t">📖 平时常用义</div>
  <div class="d" id="shDef"></div>
  <details class="fold"><summary>🔍 本句语境义 · 英英 · 音标 · 读法（点开）</summary>
    <div class="d" id="shCtx" style="margin-bottom:8px"></div>
    <div class="d dim" id="shEn">查询中…</div></details>
  <details class="fold"><summary>🎨 标记 · 🎯 熟练度（点开）</summary>
    <div class="mrow" id="shMarks"></div>
    <div class="mrow" id="shState" style="margin-top:8px"></div>
    <div class="d dim" id="shLookup" style="font-size:12px"></div></details>
  <div class="row" style="margin-top:14px">
    <button class="btn small" id="shAdd">＋ 加入生词本</button>
    <button class="btn ghost small" onclick="speakWord()">🔊 朗读</button>
    <a class="btn ghost small" id="shMore" target="_blank" rel="noopener">更多释义 ↗</a>
  </div>
</div>
<div id="selpop">
  <div id="selpopTxt" style="font-size:13px;font-weight:600;word-break:break-word"></div>
  <div id="selpopOut" class="dim" style="font-size:13px;margin-top:4px;word-break:break-word"></div>
  <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
    <button class="btn ghost small" onclick="selWord()">🔍 查首词</button>
    <button class="btn ghost small" onclick="selTranslate()">🌐 整段翻译</button>
    <button class="btn ghost small" onclick="selSpeak()">🔊 朗读</button>
  </div>
</div>

<script>
/* =====================================================
  一、书库数据：英文书名 / 通行中文译名 / 作者 / 年份 / 难度 / 类型
  lv: CEFR 难度  g: 类型  gb: 兼容字段（链接统一走 Open Library 检索）
===================================================== */
const GENRES = {
  lit:"文学经典", mys:"侦探推理", sci:"科幻幻想",
  fab:"童话寓言", adv:"冒险探索", phl:"哲学历史", drama:"戏剧诗歌", imp:"我的导入"
};

function go(name){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.getElementById("view-"+name).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
  const nb = document.getElementById("nav-"+name);
  if(nb) nb.classList.add("on");
  if(name==="library") renderLibrary();
  if(name==="vocab") renderVocab();
  if(name==="sreview") renderSReview();
  if(name==="test") renderTestIntro();
  if(name==="account") renderAccount();
  if(name!=="book" && name!=="reader") window.scrollTo(0,0);
}

let fLv = "all", fGenre = "all";
function chip(label, val, cur, fn){
  return `<button class="chip ${cur===val?"on":""}" onclick="${fn}('${val}')">${label}</button>`;
}
function renderChips(){
  document.getElementById("lvChips").innerHTML =
    chip("全部难度","all",fLv,"setLv") + TIERS.map(t=>chip(t,t,fLv,"setLv")).join("");
  document.getElementById("genreChips").innerHTML =
    chip("全部类型","all",fGenre,"setGenre") +
    Object.entries(GENRES).map(([k,v])=>chip(v,k,fGenre,"setGenre")).join("");
}
function setLv(v){ fLv=v; renderLibrary(); }
function setGenre(v){ fGenre=v; renderLibrary(); }

function renderLibrary(){
  renderChips();
  const kw = document.getElementById("searchBox").value.trim().toLowerCase();
  /* 导入书籍排在最前（无筛选时） */
  const showImp = fLv==="all" && (fGenre==="all"||fGenre==="imp") && !kw;
  const impList = showImp ? store.imports.map(x=>({
    id:x.id, t:x.t, zh:"（导入书籍）", a:"本地导入", y:"", lv:"·", g:"imp", imp:true
  })) : [];
  let list = [...impList, ...BOOKS.filter(b=>
    (fLv==="all"||b.lv===fLv) &&
    (fGenre==="all"||b.g===fGenre) &&
    (!kw || (b.t+" "+b.zh+" "+b.a).toLowerCase().includes(kw))
  )];
  const lv = store.level;
  const banner = document.getElementById("recBanner");
  if(lv && fLv==="all" && fGenre==="all" && !kw){
    banner.innerHTML = `<div class="rec-banner">
      🎯 已测得词汇等级 <b>${lv}</b>，下面标有「推荐」的书最适合你
      <button class="btn ghost small" onclick="go('test')">重新测试</button></div>`;
  } else banner.innerHTML="";
  const rec = document.getElementById("recSec");
  if(lv && fLv==="all" && fGenre==="all" && !kw){
    const recs = BOOKS.filter(b=>b.lv===lv);
    if(recs.length){
      rec.innerHTML = `<h2 class="sec">为你推荐（${lv} 水平）</h2>
        <div class="grid">${recs.map(b=>bookCard(b,true)).join("")}</div>`;
    } else rec.innerHTML="";
  } else rec.innerHTML="";
  document.getElementById("gridTitle").textContent =
    (fLv!=="all"||fGenre!=="all"||kw) ? `筛选结果（${list.length} 本）` : `全部书目（${list.length} 本）`;
  document.getElementById("bookGrid").innerHTML =
    list.length ? list.map(b=>bookCard(b,false)).join("") :
    `<div class="empty">没有匹配的书，换个筛选条件试试～</div>`;
}
function bookCard(b, rec){
  /* 导入书籍：无书皮图，用灰色渐变底 */
  const cov = b.imp
    ? `<span class="lv">导入</span><div class="t">${b.t}</div><div class="a">本地导入 · 点击阅读</div>`
    : `<img class="cimg" loading="lazy" src="${coverUrl(b)}" alt="${b.t} 书皮" onerror="this.remove()">
       <span class="lv">${b.lv}</span><div class="t">${b.t}</div>
       <div class="a">${b.zh} · ${b.a}（${AUTHOR_ZH[b.a]||""}）</div>`;
  return `<div class="book" onclick="openBook('${b.id}')">
    <div class="cover ${b.imp?"g-imp":"g-"+b.g}">${cov}</div>
    <div class="meta"><b>${b.zh}</b> · <span class="g">${b.imp?"我的导入":GENRES[b.g]}</span>
      ${rec?`<span class="badge">推荐</span>`:""}
      <br>${b.imp?"✦ 可阅读":(SAMPLES[b.id]?"✦ 可试读":"")}</div>
  </div>`;
}

/* 解析古腾堡纯文本：去头尾 → 按空行分段 → 按章节标题分章 → 全书分句 */
function parseFull(txt){
  let t = txt.replace(/\r/g,"");
  const st = t.search(/\*\*\*\s*START OF (THE|THIS) PROJECT/i);
  if(st > -1) t = t.slice(st).replace(/^[^\n]*\n/, "");
  const en = t.search(/\*\*\*\s*END OF (THE|THIS) PROJECT/i);
  if(en > -1) t = t.slice(0, en);
  const paras = t.split(/\n\s*\n/).map(s=>s.replace(/\s+/g," ").trim())
    .filter(p=>p && !/^(image|illustration|\[illustration)/i.test(p));
  const sents = [], chapters = [];
  let heading = "开篇";
  const closeChap = ()=>{
    const start = chapters.length ? chapters[chapters.length-1].end : 0;
    chapters.push({t:heading, start, end:sents.length});
  };
  for(const p of paras){
    if(p.length < 70 && /((chapter|canto|stave|act|book|part|letter|scene)\s+[ivxlc0-9]+|^[ivxlcdm]{1,7}$)/i.test(p)){
      closeChap();
      heading = p.slice(0, 40);
    }else{
      p.split(/(?<=[.!?…"”])\s+/).forEach(s=>{ s = s.trim(); if(s) sents.push({en:s, zh:null}); });
    }
  }
  closeChap();
  let chs = chapters.filter(c=>c.end > c.start);
  if(chs.length < 4){   // 标题识别不出来时，每 250 句切一部分
    chs = [];
    for(let i=0; i<sents.length; i+=250)
      chs.push({t:`第 ${chs.length+1} 部分`, start:i, end:Math.min(i+250, sents.length)});
  }
  return {sents, chapters:chs};
}
/* 整书阅读入口：加载全文 → 分章 → 打开阅读器 */
async function openFull(id){
  curBook = BOOKS.find(x=>x.id===id);
  if(fullCache[id]){ fullMode = {id, chap:0}; openReader(id); return; }
  document.getElementById("view-reader").innerHTML =
    `<div class="reader"><div class="rd-head"><h2>《${curBook.t}》全文加载中…</h2></div>
     <p class="tip">首次加载约需几秒，加载后可离线阅读。</p></div>`;
  go("reader");
  try{
    const txt = await (await fetch("./books/pg"+curBook.gb+".txt")).text();
    fullCache[id] = parseFull(txt);
    fullMode = {id, chap:0};
    openReader(id);
  }catch(e){
    document.getElementById("view-reader").innerHTML =
      `<div class="reader"><div class="rd-head"><h2>加载失败</h2></div>
       <p class="tip">全文文件缺失（books/pg${curBook.gb}.txt）。${e.message}</p>
       <button class="btn ghost small" onclick="openBook('${id}')">← 返回详情</button></div>`;
  }
}
function jumpChapter(n){
  if(!fullMode) return;
  fullMode.chap = Math.max(0, Math.min(fullCache[curBook.id].chapters.length-1, Number(n)));
  openReader(curBook.id);
  window.scrollTo(0, 0);
}
/* 机翻本章：按 5 句一组请求，译文写回句对象，完成后随对照开关显示 */
async function mtChapter(){
  if(!fullMode) return;
  const sents = getSents(curBook.id);
  const ch = fullCache[curBook.id].chapters[fullMode.chap];
  const todo = [];
  for(let i=ch.start; i<ch.end; i++) if(sents[i].zh==null) todo.push(i);
  if(!todo.length){ alert("本章已全部翻译"); return; }
  const btn = document.getElementById("mtChapBtn");
  btn.disabled = true;
  for(let p=0; p<todo.length; p+=5){
    const grp = todo.slice(p, p+5);
    try{
      const t = await mtFetch(grp.map(i=>sents[i].en).join(" "));
      const parts = t.split(/(?<=[。！？…])/).map(s=>s.trim()).filter(Boolean);
      grp.forEach((gi,k)=>{
        sents[gi].zh = (parts.length===grp.length && parts[k]) ? parts[k] : (k===0 ? t : "");
      });
    }catch(e){
      grp.forEach(gi=>{ sents[gi].zh = ""; });
    }
    btn.textContent = `🌐 机翻本章 ${Math.min(p+5, todo.length)}/${todo.length}`;
  }
  btn.disabled = false;
  btn.textContent = "🌐 机翻本章 ✓";
  if(store.showzh) openReader(curBook.id);
}

function getBookMarks(id){
  const m = store.marks;
  if(!m[id]) m[id] = {w:{}, s:{}};
  return m[id];
}
function saveMarks(m){ store.marks = m; }

function openReader(id){
  /* 导入书没有 BOOKS 记录，构造一个临时对象供标题显示 */
  curBook = BOOKS.find(x=>x.id===id) ||
    { id, t:(store.imports.find(x=>x.id===id)||{t:"导入书籍"}).t };
  const sents = getSents(id);   // 内置书 = 样章；导入书 = 全文分句；整书 = 全书
  const isFull = fullMode && fullMode.id===id && fullCache[id];
  const rng = isFull
    ? (c=>[c.start, c.end])(fullCache[id].chapters[fullMode.chap])
    : [0, sents.length];        // 整书模式只渲染当前章（句序号仍是全书全局序号）
  const bm = getBookMarks(id);
  const ws = wordStates();   // M2 词族状态（用于正文高亮）
  /* 英文按单词切片包 span（si 为所在句序号，词标记在两种模式下都生效） */
  const wordSpans = (s,i)=> s.en.replace(/[A-Za-z'’-]+/g, m=>{
    const low = m.toLowerCase();
    const mk = bm.w[i+":"+low];
    const fs = ws[stemOf(low)];
    const stc = fs ? (fs.st===0 ? "st0" : fs.st===1 ? "st1" : "") : "";
    return `<span class="w ${stc} ${mk?("mk"+mk):""}" data-w="${m.replace(/[’]/g,"'")}">${m}</span>`;
  });
  /* 中文行：内置书为人工译文；导入书未翻译时显示「机翻」按钮 */
  const zhBlock = (key, list)=>{
    if(list.every(s=>s.zh!=null)) return list.map(s=>s.zh).join("");
    return `<button class="btn ghost small" onclick="mtOnce('${key}')">🌐 机翻</button><span id="mtout-${key}"></span>`;
  };
  let html = "";
  if(store.mode === "para"){
    /* 整段模式：每 3 句合成一段，原文连续排版；开启对照时整段译文在下方 */
    for(let p=rng[0]; p<rng[1]; p+=3){
      const end = Math.min(p+3, rng[1]);
      const grp = sents.slice(p, end);
      html += `<div class="sent para" data-si="${p}">
        <div class="en" onclick="wordClick(event)">${grp.map((s,k)=>wordSpans(s,p+k)).join(" ")}</div>
        <div class="zh">${zhBlock("p"+p, grp)}</div>
        <div class="tools">
          <button class="btn ghost small" onclick="speakPara(${p})">🔊 读本段</button>
          <button class="btn ghost small" onclick="openBook('${id}')">← 详情</button>
        </div>
      </div>`;
    }
  }else{
    /* 逐句模式：一句一卡，含整句标记色条 */
    html = sents.slice(rng[0], rng[1]).map((s,k)=>{
      const i = rng[0]+k;
      const en = wordSpans(s,i);
      const sm = bm.s[i] ? (" sm"+bm.s[i]) : "";
      return `<div class="sent${sm}" data-si="${i}">
        <div class="en" onclick="wordClick(event)">${en}</div>
        <div class="zh">${zhBlock("i"+i, [s])}</div>
        <div class="tools">
          <button class="btn ghost small" onclick="speak(${i})">🔊 读这句</button>
          <span class="mdot tit">标记整句:</span>
          ${MKS.map((c,n)=>`<button class="mdot" style="background:${c[0]}"
            onclick="markSent(${i},${n+1})" title="标记颜色${n+1}"></button>`).join("")}
          ${bm.s[i]?`<button class="mdot" style="width:auto;background:none;border:none;color:var(--muted);font-size:12px"
            onclick="markSent(${i},0)">✕ 取消</button>`:""}
          <button class="btn ghost small" onclick="openBook('${id}')">← 详情</button>
        </div>
      </div>`;
    }).join("");
  }
  /* 顶部工具条：模式切换 + 双语开关 + 背景色选择（整书模式加章节导航与机翻本章） */
  document.getElementById("view-reader").innerHTML = `
    <div class="reader">
      <span class="back" onclick="openBook('${id}')">← 返回详情</span>
      <div class="rd-head"><h2>${curBook.t} · ${isFull ? "整本阅读" : "双语试读"}</h2></div>
      ${isFull ? `
      <div class="rd-tools">
        <button class="btn ghost small" onclick="jumpChapter(${fullMode.chap-1})" ${fullMode.chap===0?"disabled":""}>← 上一章</button>
        <select class="chip" style="width:auto;max-width:220px" onchange="jumpChapter(this.value)">
          ${fullCache[id].chapters.map((c,i)=>
            `<option value="${i}" ${i===fullMode.chap?"selected":""}>${c.t}</option>`).join("")}
        </select>
        <button class="btn ghost small" onclick="jumpChapter(${fullMode.chap+1})" ${fullMode.chap===fullCache[id].chapters.length-1?"disabled":""}>下一章 →</button>
        <button class="btn ghost small" id="mtChapBtn" onclick="mtChapter()">🌐 机翻本章</button>
        <span class="tip" style="display:inline;margin:0">第 ${fullMode.chap+1}/${fullCache[id].chapters.length} 章</span>
      </div>` : `
      <div class="rd-tools">
        <button class="btn ghost small" onclick="toggleMode()">${store.mode==="para"?"排版：整段原文":"排版：逐句对照"}</button>
        <button class="btn ghost small" id="zhToggle" onclick="toggleZh()">${store.showzh?"中文对照：开":"中文对照：关"}</button>
        <span class="tip" style="display:inline;margin:0">背景：</span>
        ${BGS.map(([v,label,c])=>`<button class="bgdot ${store.bg===v?"on":""}"
          style="background:${v==="dark"?"#17191B":c}" title="${label}"
          onclick="setBg('${v}')"></button>`).join("")}
      </div>`}
      ${isFull ? `
      <div class="rd-tools">
        <button class="btn ghost small" onclick="toggleMode()">${store.mode==="para"?"排版：整段原文":"排版：逐句对照"}</button>
        <button class="btn ghost small" id="zhToggle" onclick="toggleZh()">${store.showzh?"中文对照：开":"中文对照：关"}</button>
        <span class="tip" style="display:inline;margin:0">背景：</span>
        ${BGS.map(([v,label,c])=>`<button class="bgdot ${store.bg===v?"on":""}"
          style="background:${v==="dark"?"#17191B":c}" title="${label}"
          onclick="setBg('${v}')"></button>`).join("")}
      </div>
      <p class="tip">点词查义 · 划选短语整段翻译 · 「机翻本章」自动翻译全章后随对照开关显示。</p>`
      : `<p class="tip">点击任意英文单词：自动弹出「本句语境义 + 平时常用义 + 英英释义」，可朗读、标记颜色、收入生词本。</p>`}
      ${html}
    </div>`;
  go("reader");
}
/* 逐句 / 整段 排版切换 */
function toggleMode(){
  store.mode = store.mode === "para" ? "sent" : "para";
  openReader(curBook.id);
}
/* 双语对照开关 */
function toggleZh(){
  store.showzh = !store.showzh;
  document.body.classList.toggle("no-zh", !store.showzh);
  openReader(curBook.id);
}
/* 阅读背景色 */
function setBg(v){
  store.bg = v;
  document.body.dataset.bg = v;
  openReader(curBook.id);
}
/* 整句标记：n=0 取消 */
function markSent(si, n){
  const m = store.marks, bm = getBookMarks(curBook.id);
  if(n===0) delete bm.s[si]; else bm.s[si] = n;
  saveMarks(m); openReader(curBook.id);
}
/* 单词标记：在弹层中选择颜色 */
let sheetWord = "", sheetSent = -1;
function wordClick(e){
  const el = e.target.closest("span.w");
  if(!el) return;
  sheetWord = el.dataset.w;
  sheetSent = Number(el.closest(".sent").dataset.si);
  /* 根据排版模式取所在文本：逐句=单句；整段=所在段落（3 句连读） */
  const all = getSents(curBook.id);
  let ctxEn, localZh;
  if(store.mode === "para"){
    const p = Math.floor(sheetSent/3)*3;
    const grp = all.slice(p, Math.min(p+3, all.length));
    ctxEn = grp.map(s=>s.en).join(" ");
    localZh = grp.map(s=>s.zh||"").join("");
  }else{
    ctxEn = all[sheetSent].en;
    localZh = all[sheetSent].zh || "";
  }
  localZh = localZh || "（暂无译文）";
  lastCtxZh = localZh;
  const low = sheetWord.toLowerCase().replace(/[^a-z'-]/g,"");
  const d = DICT[low];
  /* M2：记录查词次数并自动升级熟练度（跨阈值时刷新正文高亮） */
  const stBefore = (wordStates()[stemOf(low)]||{}).st;
  const fsNow = recordLookup(low);
  if(stBefore !== undefined && fsNow.st !== stBefore) openReader(curBook.id);
  document.getElementById("shWord").textContent = sheetWord;
  /* 平时常用义：本地词典优先 */
  document.getElementById("shDef").textContent =
    d ? `${d[0]} ${d[1]}` : "本地词典未收录，正在联网查询英英释义…";
  /* 本句语境义：整句机翻（缓存 + 本地译文兜底） */
  const ctxEl = document.getElementById("shCtx");
  ctxEl.textContent = "翻译中…";
  ctxTranslate(ctxEn, localZh).then(t=>{ ctxEl.textContent = t; });
  /* 英英释义：dictionaryapi.dev（免费无 key，失败静默降级） */
  const enEl = document.getElementById("shEn");
  enEl.textContent = "查询中…";
  fetchDict(low).then(r=>{ enEl.innerHTML = r; }).catch(()=>{ enEl.textContent = "联网查询失败，可点击下方「更多释义」。"; });
  /* 生词本按钮状态 */
  const addBtn = document.getElementById("shAdd");
  addBtn.disabled = store.vocab.some(v=>v.w===low);
  addBtn.textContent = addBtn.disabled ? "✓ 已在生词本" : "＋ 加入生词本";
  addBtn.onclick = ()=>addVocab(low);
  renderStateRow(low);
  document.getElementById("shMore").href = "https://dict.youdao.com/w/"+encodeURIComponent(low);
  /* 颜色标记行：当前词的颜色高亮 */
  const bm = getBookMarks(curBook.id);
  const cur = bm.w[sheetSent+":"+low];
  document.getElementById("shMarks").innerHTML =
    MKS.map((c,n)=>`<button class="mdot ${cur===n+1?"on":""}" style="background:${c[0]};${cur===n+1?"border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)":""}"
      onclick="markWord(${n+1})"></button>`).join("") +
    `<button class="btn ghost small" onclick="markWord(0)">✕ 取消标记</button>`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("mask").classList.add("on");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("mask").classList.remove("on");
}
function markWord(n){
  const m = store.marks, bm = getBookMarks(curBook.id);
  const key = sheetSent+":"+sheetWord.toLowerCase();
  if(n===0) delete bm.w[key]; else bm.w[key] = n;
  saveMarks(m); closeSheet(); openReader(curBook.id);
}
/* 加入生词本：记录 原句/出处书/句序/收藏时间，随后异步补充详细释义 */
function addVocab(w){
  if(!w || store.vocab.some(v=>v.w===w)) return;
  const d = DICT[w];
  const all = getSents(curBook.id);
  store.vocab = [{
    w,
    m: d ? d[0]+" "+d[1] : "（查看英英详解）",
    src: curBook ? curBook.t : "导入书籍",
    book: curBook ? curBook.id : "",
    si: sheetSent, sent: all[sheetSent] ? all[sheetSent].en : "",
    ctx: lastCtxZh, at: Date.now()
  }, ...store.vocab];
  fetchDictDetail(w, store.vocab[0]);
  const btn = document.getElementById("shAdd");
  btn.disabled = true; btn.textContent = "✓ 已在生词本";
}
/* 联网抓取详细释义（音标+多义项+例句）写回生词记录，供生词模式展示 */
async function fetchDictDetail(word, entry){
  try{
    const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word));
    if(!r.ok) return;
    const j = await r.json();
    const e0 = j[0];
    const phon = e0.phonetic || (e0.phonetics.find(p=>p.text)||{}).text || "";
    const defs = [];
    outer: for(const e of j) for(const m of e.meanings) for(const df of m.definitions){
      defs.push({pos:m.partOfSpeech, en:df.definition, ex:df.example||""});
      if(defs.length>=4) break outer;
    }
    const v = store.vocab, it = v.find(x=>x.w===word && x.at===entry.at);
    if(it){ it.phon = phon; it.defs = defs; store.vocab = v; }
  }catch(e){ /* 离线时保留基础信息 */ }
}

/* ---- 联网查询：整句机翻（MyMemory 免费接口）+ 英英释义 ---- */
async function mtFetch(text){
  /* MyMemory 单次约 500 字符上限，超长截断 */
  if(text.length > 450) text = text.slice(0,450);
  const r = await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=en|zh-CN");
  const j = await r.json();
  const t = j && j.responseData && j.responseData.translatedText;
  if(!t) throw new Error("empty");
  return t;
}
async function ctxTranslate(sent, fallback){
  if(mtCache[sent]) return mtCache[sent];
  try{
    const t = await mtFetch(sent);
    mtCache[sent] = t; return t;
  }catch(e){ return fallback + "（离线模式：显示本站译文）"; }
}
/* 导入书的「机翻这句/此段」按钮：翻完写入句子缓存，重绘后即为常显译文 */
async function mtOnce(key){
  const sents = getSents(curBook.id);
  const idxs = key[0]==="p"
    ? [...Array(Math.min(3, sents.length - Number(key.slice(1)))).keys()].map(k=>Number(key.slice(1))+k)
    : [Number(key.slice(1))];
  const el = document.getElementById("mtout-"+key);
  if(el) el.textContent = " 翻译中…";
  try{
    const t = await mtFetch(idxs.map(i=>sents[i].en).join(" "));
    idxs.forEach(i=>{ if(sents[i].zh==null) sents[i].zh = t; });
    if(el) el.textContent = " " + t;
  }catch(e){ if(el) el.textContent = " 翻译失败，请稍后重试"; }
}

/* =====================================================
  九·补：导入书籍（TXT 直接读取；EPUB 解包正文提取）
===================================================== */
const impCache = {};   // 导入书 id → 分句缓存
/* 内置书取样章；导入书取全文分句（首次访问时生成） */
function getSents(id){
  /* 整书模式下返回全书句子（点词语境/标记/朗读都用全局句序号） */
  if(fullMode && fullMode.id===id && fullCache[id]) return fullCache[id].sents;
  if(SAMPLES[id]) return SAMPLES[id];
  if(!impCache[id]){
    const rec = store.imports.find(x=>x.id===id);
    if(!rec) return [];
    impCache[id] = splitSentences(rec.text);
  }
  return impCache[id];
}
/* 分句：按空行/换行分段，再按句号/问号/感叹号断句 */
function splitSentences(text){
  const paras = text.replace(/\r/g,"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  for(const p of paras){
    p.split(/(?<=[.!?…])\s+/).forEach(s=>{
      s = s.trim(); if(s) out.push({en:s, zh:null});
    });
  }
  return out.slice(0, 6000);   // 防止超长卡顿
}
/* 动态加载 JSZip（EPUB 解析用，cdnjs 免费库） */
function loadJsZip(){
  return new Promise((res,rej)=>{
    if(window.JSZip) return res();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = res; s.onerror = ()=>rej(new Error("JSZip 加载失败"));
    document.head.appendChild(s);
  });
}
async function doImport(input){
  const file = input.files && input.files[0];
  input.value = "";
  if(!file) return;
  let text = "";
  try{
    if(/\.epub$/i.test(file.name)){
      await loadJsZip();
      const zip = await JSZip.loadAsync(file);
      const names = Object.keys(zip.files).filter(n=>/\.(xhtml|html|htm)$/i.test(n)).sort();
      const parts = [];
      for(const n of names){
        const html = await zip.files[n].async("string");
        const doc = new DOMParser().parseFromString(html, "text/html");
        parts.push(doc.body ? doc.body.textContent : "");
        if(parts.join("").length > 1200000) break;
      }
      text = parts.join("\n\n");
    }else{
      text = await file.text();
    }
  }catch(e){ alert("文件解析失败：" + e.message); return; }
  text = text.replace(/\u0000/g,"").trim();
  if(!text){ alert("未在文件中找到可读文本"); return; }
  if(text.length > 1200000){ text = text.slice(0,1200000); alert("书籍过长，已截取前 120 万字符"); }
  const list = store.imports;
  list.push({ id:"imp"+Date.now(), t:file.name.replace(/\.(txt|epub)$/i,""), text });
  store.imports = list;
  renderLibrary();
  alert("《" + file.name.replace(/\.(txt|epub)$/i,"") + "》导入成功，已出现在书城顶部，可直接点词查义、机翻对照。");
}

}
/* =====================================================
  M2：词族状态机（近似词根归并 + 三态 + 查词自动升级）
  st: 0=陌生 1=学习中 2=已掌握 -1=忽略；n=查词次数
  正文高亮：陌生=红点线 / 学习中=琥珀实线 / 已掌握与忽略=不高亮
  标记一个 = 标记整族（同一词根的变形共用一条状态记录）
===================================================== */
let _ws = null;
function wordStates(){ if(_ws===null) _ws = store.wstates; return _ws; }
function saveWS(){ store.wstates = _ws; }
/* 常见不规则动词/名词词形 → 词根 */
const IRREG = {went:"go",gone:"go",was:"be",were:"be",been:"be",am:"be",is:"be",are:"be",
 had:"have",has:"have",did:"do",does:"do",made:"make",said:"say",saw:"see",seen:"see",
 took:"take",taken:"take",came:"come",got:"get",gotten:"get",gave:"give",given:"give",
 found:"find",knew:"know",known:"know",thought:"think",felt:"feel",left:"leave",
 kept:"keep",held:"hold",brought:"bring",began:"begin",begun:"begin",grew:"grow",
 spoke:"speak",spoken:"speak",broke:"break",broken:"break",chose:"choose",chosen:"choose",
 drove:"drive",driven:"drive",ate:"eat",eaten:"eat",fell:"fall",fallen:"fall",
 heard:"hear",lost:"lose",met:"meet",paid:"pay",ran:"run",rose:"rise",risen:"rise",
 sat:"sit",slept:"sleep",stood:"stand",understood:"understand",told:"tell",
 wore:"wear",worn:"wear",won:"win",wrote:"write",written:"write",better:"good",
 best:"good",worse:"bad",worst:"bad",children:"child",men:"man",women:"woman",
 feet:"foot",teeth:"tooth",mice:"mouse",people:"person"};
/* 近似词根：规则后缀剥离（同族词归并到同一 key，允许个别误差） */
function stemOf(w){
  w = w.toLowerCase();
  if(IRREG[w]) return IRREG[w];
  const suf = [["ies","y",5],["ied","y",5],["sses","ss",6],["ves","f",5],
    ["es","",4],["ed","",4],["ing","",5],["ly","",4],["er","",4],["est","",5],["s","",3]];
  for(const [a,b,min] of suf){
    if(w.length > min && w.endsWith(a)) return w.slice(0, -a.length) + b;
  }
  return w;
}
/* 点词时调用：累计查词次数，达阈值自动升级（忽略词除外） */
function recordLookup(low){
  const ws = wordStates(); const stem = stemOf(low);
  const fs = ws[stem] || (ws[stem] = {st:null, n:0, w:low});
  fs.n++; fs.w = low;
  if(fs.st !== -1){
    if(fs.n >= 6 && fs.st !== 2) fs.st = 2;             // 查满 6 次 → 已掌握
    else if(fs.n >= 3 && (fs.st===null || fs.st===0)) fs.st = 1;  // 满 3 次 → 学习中
  }
  saveWS();
  return fs;
}
/* 词卡状态行：四态按钮 + 查词次数说明 */
function renderStateRow(low){
  const row = document.getElementById("shState");
  if(!row) return;
  const stem = stemOf(low);
  const fs = wordStates()[stem];
  const st = fs ? fs.st : null, n = fs ? fs.n : 0;
  row.innerHTML = [[0,"陌生"],[1,"学习中"],[2,"已掌握"],[-1,"忽略"]].map(([v,l])=>
    `<button class="mdot" style="width:auto;padding:4px 10px;background:none;
      border:1px solid ${st===v?"var(--brand)":"var(--border)"};
      color:${st===v?"var(--brand)":"var(--muted)"};font-size:12px"
      onclick="setWordState('${low}',${v})">${st===v?"● ":""}${l}</button>`).join("");
  document.getElementById("shLookup").textContent =
    `已查 ${n} 次 · 词族【${stem}*】 · 满 3 次自动升「学习中」，满 6 次自动「已掌握」`;
}
/* 手动切换状态：刷新正文高亮与状态行 */
function setWordState(low, st){
  const ws = wordStates(); const stem = stemOf(low);
  const fs = ws[stem] || (ws[stem] = {st:null, n:0, w:low});
  fs.st = st; fs.w = low;
  saveWS();
  if(curBook) openReader(curBook.id);
  renderStateRow(low);
}

/* 英英区：默认只显示 1 个义项（防英文过多），点「展开全部义项」看其余 */
let _dictCache = {};
async function fetchDict(word){
  const r = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(word));
  if(!r.ok) throw new Error("http");
  const j = await r.json();
  const e0 = j[0];
  const phon = e0.phonetic || (e0.phonetics.find(p=>p.text)||{}).text || "";
  const defs = [];
  outer: for(const e of j) for(const m of e.meanings) for(const df of m.definitions){
    defs.push({pos:m.partOfSpeech, en:df.definition, ex:df.example||""});
    if(defs.length>=5) break outer;
  }
  _dictCache[word] = {phon, defs};
  return renderDefs(word, 1);
}
function renderDefs(word, n){
  const d0 = _dictCache[word] || {phon:"", defs:[]};
  const esc = word.replace(/'/g,"\\'");
  let html = "";
  if(d0.phon) html += `<span style="font-size:16px;color:var(--text)">/${d0.phon.replace(/^\/|\/$/g,"")}/</span>
    <button class="iconbtn" onclick="speakText('${esc}')">🔊 读法</button>`;
  d0.defs.slice(0,n).forEach(d=>{
    html += `<div style="margin-top:6px;color:var(--text)">[${d.pos}] ${d.en}</div>` +
      (d.ex ? `<div class="dim">常用于：${d.ex}</div>` : "");
  });
  if(d0.defs.length > n)
    html += `<button class="btn ghost small" style="margin-top:8px"
      onclick="this.outerHTML=renderDefs('${esc}',${d0.defs.length})">展开全部 ${d0.defs.length} 个义项</button>`;
  return html || "（暂无英英释义）";
}

/* 生词模式里的英文释义可点击 → 即时机翻出中文（点击处弹出） */
async function transDef(el){
  if(el.dataset.done) return;
  const en = el.dataset.en || el.textContent;
  const tip = document.createElement("span");

}

  testQ = 0; testAns = TIERS.map(()=>0);

function showQ(){
  const q = TEST[testQ];
  document.getElementById("progBar").style.width = (testQ/TEST.length*100)+"%";
  document.getElementById("qTier").textContent = `第 ${testQ+1} / ${TEST.length} 题 · 难度 ${q.tier}`;
  document.getElementById("qWord").textContent = q.w;
  const right = q.o[0];
  const opts = [...q.o].sort(()=>Math.random()-.5);
  document.getElementById("qOpts").innerHTML = opts.map(o=>
    `<button onclick="pick(this,'${o===right?"1":"0"}')">${o}</button>`).join("");
}
function pick(btn, ok){
  if(document.getElementById("qOpts").dataset.lock) return;
  document.getElementById("qOpts").dataset.lock = "1";
  if(ok==="1") testAns[TIERS.indexOf(TEST[testQ].tier)]++;

/* =====================================================

const SRS = [1,2,4,7,15];   // 认识次数 → 下次复习间隔（天）

        <span class="m">${wsLabel(f.st)} · 查 ${f.n} 次 · 词族 ${k}*</span>
        <button class="iconbtn" onclick="event.stopPropagation();speakText('${(f.w||k).replace(/'/g,"\\'")}')">🔊</button>
        <button class="iconbtn" onclick="wsToggle('${k}')">切换状态</button>
        <button class="iconbtn" onclick="wsDel('${k}')">🗑</button>
      </div>`).join("") || `<div class="empty">暂无记录：阅读时点词即自动进入词库。</div>`}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
      <button class="btn ghost small" onclick="wsBatch()">把筛选结果全部标为已掌握</button>
      <button class="btn ghost small" onclick="wsExport()">📤 导出 JSON</button>
      <button class="btn ghost small" onclick="document.getElementById('wsImportFile').click()">📥 导入 JSON</button>
      <input type="file" id="wsImportFile" accept=".json" style="display:none" onchange="wsImport(this)">
    </div>
    <h2 class="sec" style="margin-top:20px">⚡ 预设词表：一键标为已掌握，正文不再高亮这些词</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${Object.entries(PRESETS).map(([k,p])=>
        `<button class="btn ghost small" onclick="markPreset('${k}')">${p.name}（${p.words.length}词）</button>`).join("")}
    </div>`;
}
function wsToggle(k){
  const ws = wordStates(); const f = ws[k];
  if(!f) return;
  f.st = f.st===-1 ? 0 : (f.st+1)%3;
  saveWS(); renderWSMgr();
}
function wsDel(k){
  const ws = wordStates();
  delete ws[k]; saveWS(); renderWSMgr();
}
function wsBatch(){
  const ws = wordStates();
  let n=0;
  Object.entries(ws).forEach(([k,f])=>{
    if((wsf==="all"||String(f.st)===wsf) && (!wsk || (f.w||k).toLowerCase().includes(wsk))){ f.st=2; n++; }
  });
  saveWS(); renderWSMgr();
  alert(`已把 ${n} 个词族标为已掌握`);
}
function wsExport(){
  const data = JSON.stringify({wstates:wordStates(), vocab:store.vocab, exportedAt:new Date().toISOString()}, null, 2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
  a.download = "lizzread-vocab.json";
  a.click();
}
function wsImport(input){
  const f = input.files && input.files[0];
  input.value = "";
  if(!f) return;
  f.text().then(txt=>{
    try{
      const j = JSON.parse(txt);
      const ws = wordStates();
      Object.entries(j.wstates||{}).forEach(([k,v])=>{
        if(!ws[k] || (v.n||0) > (ws[k].n||0)) ws[k] = v;
      });
      saveWS();
      if(Array.isArray(j.vocab)){
        const cur = store.vocab;
        j.vocab.forEach(x=>{ if(!cur.some(y=>y.w===x.w)) cur.push(x); });
        store.vocab = cur;
      }
      renderSReview();
      alert("导入完成");
    }catch(e){ alert("JSON 解析失败：" + e.message); }
  });
}
function markPreset(k){
  const ws = wordStates();
  let n=0;
  PRESETS[k].words.forEach(w=>{
    const stem = stemOf(w);
    if(!ws[stem] || ws[stem].st!==2){ ws[stem] = {st:2, n:Math.max(ws[stem]?.n||0, 9), w}; n++; }
  });
  saveWS(); renderWSMgr();
  alert(`《${PRESETS[k].name}》：${n} 个词族已标为已掌握`);
}

/* =====================================================
  M2：划选弹层（查首词 / 整段翻译 / 朗读）
===================================================== */
document.addEventListener("mouseup", e=>{
  const pop = document.getElementById("selpop");
  if(!pop || e.target.closest("#selpop")) return;
  const sel = (window.getSelection().toString()||"").trim();
  if(!sel || sel.length<2 || !e.target.closest("#view-reader .en")){
    pop.style.display="none"; return;
  }
  const r = window.getSelection().getRangeAt(0).getBoundingClientRect();
  pop.dataset.sel = sel.slice(0,300);
  pop.style.left = Math.max(10, Math.min(r.left+window.scrollX, window.innerWidth-310))+"px";
  pop.style.top  = (r.bottom+window.scrollY+8)+"px";
  document.getElementById("selpopTxt").textContent = sel.length>60 ? sel.slice(0,60)+"…" : sel;
  document.getElementById("selpopOut").textContent = "";
  pop.style.display = "block";
});
function selTranslate(){
  const out = document.getElementById("selpopOut");
  out.textContent = "翻译中…";
  mtFetch(document.getElementById("selpop").dataset.sel)
    .then(t=>{ out.textContent = t; })
    .catch(()=>{ out.textContent = "翻译失败，请稍后重试"; });
}
function selWord(){
  const pop = document.getElementById("selpop");
  const sel = pop.dataset.sel || "";
  const w = (sel.match(/[A-Za-z]+/)||[])[0];
  if(!w || !curBook) return;
  const all = getSents(curBook.id);
  const si = all.findIndex(s=>s.en.toLowerCase().includes(w.toLowerCase()));
  if(si<0) return;
  const sp = [...document.querySelectorAll(`#view-reader .sent[data-si="${si}"] .w`)]
    .find(x=>x.textContent.toLowerCase().replace(/[^a-z'-]/g,"")===w.toLowerCase());
  if(sp) sp.click();
  pop.style.display = "none";
}
function selSpeak(){ speakText(document.getElementById("selpop").dataset.sel); }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LIZZREAD 耳朵图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111C"/>
      <stop offset="1" stop-color="#0E1A29"/>
    </linearGradient>
    <linearGradient id="au" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5CFFC4"/>
      <stop offset="0.45" stop-color="#00E676"/>
      <stop offset="1" stop-color="#00B84C"/>
    </linearGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 耳朵：一笔从底部左侧起 → 向上 → 绕成耳尖 → 右下落到耳垂，自然形成 L 的竖笔 -->
  <path d="M150 424 V268 C150 180 206 112 282 112 C346 112 392 156 392 214 C392 266 354 296 310 296"
        fill="none" stroke="url(#au)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>

  <!-- L 的横笔：与竖笔共用底端，向右收笔 -->
  <path d="M150 424 H300" fill="none" stroke="url(#au)" stroke-width="38" stroke-linecap="round" filter="url(#gl)"/>

  <!-- 耳道：从耳垂往内卷的小圈 -->
  <circle cx="292" cy="342" r="24" fill="none" stroke="#00E676" stroke-width="14" opacity="0.95"/>
</svg>

name: Keepalive (每 20 天自动提交一次，防止 Actions 定时任务被停用)

on:
  schedule:
    - cron: '0 0 1 */20 *'   # 近似每 20 天
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
      - name: Commit
        run: |
          git config user.name "lizzread-bot"
          git config user.email "bot@lizzread.local"
          git add .keepalive
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: keepalive $(date -u +%F)"
          git push

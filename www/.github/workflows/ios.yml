name: iOS Release (no local Xcode needed)

on:
  workflow_dispatch:
  push:
    tags: [ 'ios-v*' ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm i -D @capacitor/cli@8

      - name: Sync web assets
        run: |
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude node_modules \
            --exclude android --exclude ios --exclude www --exclude .sdk \
            --exclude dist --exclude .backup --exclude scripts --exclude store \
            --exclude '.screenshots' --exclude extension --exclude 'redemptions.json' \
            --exclude '*.part-*' --exclude '*.original' \
            ./ www/
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App && pod install --repo-update

      - name: Restore signing certificate
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          echo "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" | base64 --decode > /tmp/cert.p12
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/profile.mobileprovision
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/LIZZREAD.xcarchive \
            -destination generic/platform=iOS \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/LIZZREAD.xcarchive \
            -exportOptionsPlist store/ExportOptions.plist \
            -exportPath build/

      - uses: actions/upload-artifact@v4
        with:
          name: lizzread-ios
          path: |
            build/*.ipa
            build/*.xcarchive

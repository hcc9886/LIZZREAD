name: Deploy web app to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (web-only files)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude 'android' --exclude 'ios' --exclude 'www' --exclude '.sdk' \
            --exclude 'dist' --exclude '.backup' --exclude 'scripts' --exclude 'store' \
            --exclude '.screenshots' --exclude 'extension' --exclude '.trae-html-share-packages' \
            --exclude 'redemptions.json' --exclude '*.part-*' --exclude '*.original' \
            ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
